# O ponto de invocação da suíte.
#
# Ela existia e nada a rodava: o repositório não tinha `.github/`, e os únicos checks do PR #1
# eram o deploy da Vercel e o comentário de preview — nenhum dos dois roda `pnpm test`. Uma
# suíte que só protege quem lembrar de digitá-la não protege ninguém num PR de terceiro.
#
# `pnpm test` também virou `prebuild` no `package.json`, então quem roda `pnpm build` leva a suíte
# junto — inclusive a Vercel: o log do deploy do commit 4a867a7 (16/09/2026) mostra
# "Running \"pnpm run build\"", "> prebuild", "> pnpm test" e "tests 32" antes do "> next build".
# Isso vale enquanto o projeto da Vercel usar o comando de build padrão. Este workflow é o que NÃO
# depende disso: roda a suíte sozinha, e reprova com ela.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # `--test` do Node não tem watch aqui: sai 1 no primeiro caso vermelho.
      - run: pnpm test
      # O build baixa o CHANGELOG da `main` do produto e gera uma página por versão × 3 idiomas.
      - run: pnpm build

dias","texto":"\"Em risco\" é o negócio parado há mais de 24 horas e menos de 3 dias. Ainda dá tempo de retomar com calma, mas ele vira crítico se continuar esquecido.","antes":[],"destaques":[{"alvo":{"texto":"Em risco","exato":true,"dentro":{"css":"[data-testid=radar-item]:has-text(\"Renata Duarte\")"}},"rotulo":"Em risco","tipo":"seta"},{"alvo":{"texto":"parado há 30h","dentro":{"css":"[data-testid=radar-item]:has-text(\"Renata Duarte\")"}},"rotulo":"Parado há 30 horas","tipo":"caixa"}]},{"id":"p4","titulo":"Em voo: o assistente vai voltar a falar","texto":"\"Em voo\" é o negócio parado, mas com um retorno já marcado pelo assistente. A linha mostra quando ele pretende voltar a falar com o cliente, como \"Assistente retorna em 2d\". Ele não está esquecido: só fique de olho, porque o retorno só sai se o WhatsApp estiver conectado e o assistente estiver ligado.","dica":"O prazo de 24 horas pode mudar por etapa do funil. Abra \"Ver tudo em CRM\" no menu e depois \"Etapas do funil\": cada etapa tem a \"Janela de esfriando\". Com 48 horas, por exemplo, o negócio só fica crítico depois de 6 dias.","antes":[],"destaques":[{"alvo":{"texto":"Em voo","exato":true,"dentro":{"css":"[data-testid=radar-item]:has-text(\"Gustavo Ramos\")"}},"rotulo":"Em voo","tipo":"seta"},{"alvo":{"texto":"^Assistente retorna","regex":true,"dentro":{"css":"[data-testid=radar-item]:has-text(\"Gustavo Ramos\")"}},"rotulo":"Quando o assistente volta","tipo":"caixa"}]}]},{"id":"quem-esta-cuidando","titulo":"Quem está cuidando de cada cliente","objetivo":"Saber, pela linha do Radar, se o negócio tem alguém cuidando ou se está largado.","papel":"admin","busca":["quem cuida do cliente","sem dono","com atendente","responsável","agente de IA","assistente"],"passos":[{"id":"p1","titulo":"Quatro situações","texto":"No fim da segunda linha de cada negócio aparece quem cuida dele. \"Sem dono\": ninguém. \"Com atendente\": uma pessoa da equipe. \"Assistente na conversa\": o atendimento automático está respondendo esse cliente. \"Agente:\" seguido de um nome: o negócio é de um agente de IA.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"testid":"radar-assignee","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}},"rotulo":"Ninguém","tipo":"caixa"},{"alvo":{"testid":"radar-assignee","dentro":{"css":"[data-testid=radar-item]:has-text(\"Paulo Teixeira\")"}},"rotulo":"Uma pessoa da equipe","tipo":"caixa"},{"alvo":{"testid":"radar-assignee","dentro":{"css":"[data-testid=radar-item]:has-text(\"Renata Duarte\")"}},"rotulo":"O atendimento automático","tipo":"caixa"},{"alvo":{"testid":"radar-assignee","dentro":{"css":"[data-testid=radar-item]:has-text(\"Gustavo Ramos\")"}},"rotulo":"Um agente de IA","tipo":"caixa"}]},{"id":"p2","titulo":"Quando aparece o botão \"Assumir\"","texto":"O botão \"Assumir\" aparece quando o cliente tem conversa no WhatsApp e nem a conversa nem o negócio estão com uma pessoa da equipe. Na Sandra, ninguém cuida. Na Renata, quem responde é o atendimento automático. No Gustavo, o negócio é do agente de IA: assumir traz a conversa para você e cala o atendimento automático nela, mas o negócio continua em nome do agente. No Paulo não aparece, porque ele já está com uma atendente. No Marcos também não: ele ainda não conversou pelo WhatsApp.","antes":[],"destaques":[{"alvo":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}},"rotulo":"Sem ninguém","tipo":"seta"},{"alvo":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Renata Duarte\")"}},"rotulo":"Tirar do automático","tipo":"seta"},{"alvo":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Gustavo Ramos\")"}},"rotulo":"Tirar a conversa do agente","tipo":"seta"},{"alvo":{"css":"[data-testid=radar-item]:has-text(\"Paulo Teixeira\")"},"rotulo":"Já está com uma atendente","tipo":"caixa"}]}]},{"id":"assumir-pelo-radar","titulo":"Assumir um cliente pelo Radar","objetivo":"Trazer para você um cliente esquecido e ir direto para a conversa com ele.","papel":"admin","busca":["assumir cliente","pegar atendimento","resgatar cliente","cliente esquecido","responder cliente parado"],"passos":[{"id":"p1","titulo":"Clique em \"Assumir\"","texto":"A Sandra está crítica e ninguém cuida dela. Clique em \"Assumir\" na linha dela para trazer a conversa para você.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}},"rotulo":"Assumir","tipo":"seta"}],"clicar":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}}},{"id":"p2","titulo":"Agora a conversa é sua","texto":"A linha passa a mostrar \"Com atendente\" e o botão some. A conversa fica com você e o atendimento automático para de responder nela. Se o negócio não tinha responsável, você passa a ser o responsável. A Sandra continua no Radar até alguém falar com ela. Para responder, clique no nome do negócio.","antes":[{"acao":"click","alvo":{"testid":"radar-claim","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}}},{"acao":"aguardar","alvo":{"texto":"Com atendente","exato":true,"dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}}}],"destaques":[{"alvo":{"testid":"radar-assignee","dentro":{"css":"[data-testid=radar-item]:has-text(\"Sandra Vieira\")"}},"rotulo":"Agora com você","tipo":"caixa"},{"alvo":{"role":"link","nome":"Alinhador invisível — Sandra Vieira"},"rotulo":"Abrir a conversa","tipo":"seta"}],"clicar":{"role":"link","nome":"Alinhador invisível — Sandra Vieira"}},{"id":"p3","titulo":"A conversa da Sandra","texto":"A Inbox abre na conversa com a Sandra. No alto, \"Automático pausado — alguém assumiu\" confirma que o assistente parou de responder, e o seu nome aparece abaixo do dela. Leia o que já foi dito e responda.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Alinhador invisível — Sandra Vieira"}},{"acao":"aguardar","alvo":{"testid":"chat-thread"}},{"acao":"esperar","ms":2500}],"destaques":[{"alvo":{"testid":"chat-thread"},"rotulo":"A conversa com a Sandra","tipo":"caixa"},{"alvo":{"texto":"Automático pausado — alguém assumiu","exato":true},"rotulo":"O assistente parou","tipo":"caixa"}]}]},{"id":"abrindo-o-negocio","titulo":"Para onde cada linha leva","objetivo":"Saber o que abre quando você clica num negócio do Radar, com e sem conversa no WhatsApp.","papel":"admin","busca":["abrir negócio","abrir conversa","ver cliente","clicar no radar","cliente sem conversa","funil"],"passos":[{"id":"p1","titulo":"Cliente com conversa","texto":"Clique na linha, fora do botão \"Assumir\", para abrir o cliente. Quando ele já conversou pelo WhatsApp, como a Renata, a Inbox abre direto na conversa dela.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Avaliação nutricional — Renata Duarte"},"rotulo":"Abre a conversa","tipo":"caixa"}],"clicar":{"role":"link","nome":"Avaliação nutricional — Renata Duarte"}},{"id":"p2","titulo":"A conversa da Renata","texto":"Aqui está a conversa com a Renata. A última mensagem foi do assistente, há 30 horas, e ela não respondeu. O botão \"Assumir\" no alto também existe aqui, para tirar a conversa do automático. Para voltar ao Radar, use o item \"Radar\" no menu da esquerda.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Avaliação nutricional — Renata Duarte"}},{"acao":"aguardar","alvo":{"testid":"chat-thread"}},{"acao":"esperar","ms":2500}],"destaques":[{"alvo":{"testid":"chat-thread"},"rotulo":"A conversa com a Renata","tipo":"caixa"},{"alvo":{"role":"link","nome":"Radar","exato":true},"rotulo":"Voltar ao Radar","tipo":"seta"}]},{"id":"p3","titulo":"Cliente sem conversa","texto":"O Marcos ainda não conversou pelo WhatsApp. Por isso a linha dele não tem \"Assumir\". Clique nela para abrir o negócio no funil.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Avaliação postural — Marcos Azevedo"},"rotulo":"Abre o funil","tipo":"caixa"}],"clicar":{"role":"link","nome":"Avaliação postural — Marcos Azevedo"}},{"id":"p4","titulo":"O negócio no funil","texto":"O funil abre com os detalhes do negócio do Marcos na tela: valor, etapa, responsável e os dados do contato. Daqui você edita o negócio sem procurá-lo no quadro. Como ele ainda não conversou, \"Abrir conversa no Inbox\" cria a conversa com ele e leva você até ela, sem mandar nenhuma mensagem.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Avaliação postural — Marcos Azevedo"}},{"acao":"esperar","ms":2500}],"destaques":[{"alvo":{"role":"dialog"},"rotulo":"O negócio do Marcos","tipo":"caixa"},{"alvo":{"texto":"Abrir conversa no Inbox","dentro":{"role":"dialog"}},"rotulo":"Começar a conversa","tipo":"seta"}]}]},{"id":"sem-proximo-passo","titulo":"Demandas sem próximo passo","objetivo":"Achar o cliente que espera sem nada combinado e tirá-lo do Radar anotando o próximo passo.","papel":"admin","busca":["sem próximo passo","demanda aberta","cliente esperando","nada combinado","quadro amarelo","próximo passo"],"passos":[{"id":"p1","titulo":"O quadro amarelo","texto":"O quadro amarelo no alto lista os clientes com um pedido em aberto em que ninguém anotou o que acontece a seguir. Na mesma linha, à direita, aparece há quantas horas o pedido está aberto. Clique no nome para abrir a conversa.","dica":"Se a sua empresa usa Propostas, podem aparecer ali mais dois quadros: propostas vencidas sem retomada e propostas esperando revisão.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"testid":"radar-sem-proximo-passo"},"rotulo":"Esperando sem nada combinado","tipo":"caixa"},{"alvo":{"role":"link","nome":"Fernanda Oliveira","exato":true,"dentro":{"testid":"radar-sem-proximo-passo"}},"rotulo":"Abre a conversa","tipo":"seta"}],"clicar":{"role":"link","nome":"Fernanda Oliveira","exato":true,"dentro":{"testid":"radar-sem-proximo-passo"}}},{"id":"p2","titulo":"O pedido da Fernanda","texto":"A Inbox abre na conversa da Fernanda. Na ficha do cliente, à direita, \"Demandas abertas\" mostra o pedido dela com a frase \"Sem próximo passo definido\". Clique em \"Marcar próximo passo\". A mensagem com borda vermelha na conversa é outro assunto: um envio que falhou, que se manda de novo em \"Tentar de novo\".","antes":[{"acao":"click","alvo":{"role":"link","nome":"Fernanda Oliveira","exato":true,"dentro":{"testid":"radar-sem-proximo-passo"}}},{"acao":"aguardar","alvo":{"testid":"marcar-proximo-passo"}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"testid":"inbox-demandas"},"rotulo":"O pedido em aberto","tipo":"caixa"},{"alvo":{"testid":"marcar-proximo-passo"},"rotulo":"Anotar o próximo passo","tipo":"seta"}],"clicar":{"testid":"marcar-proximo-passo"}},{"id":"p3","titulo":"Escreva o que vem a seguir","texto":"Escreva o que vai acontecer a seguir e clique em \"Salvar\".","antes":[{"acao":"click","alvo":{"testid":"marcar-proximo-passo"}},{"acao":"fill","alvo":{"testid":"campo-proximo-passo"},"valor":"Ligar para confirmar o retorno de quinta"},{"acao":"hover","alvo":{"testid":"salvar-proximo-passo"}}],"destaques":[{"alvo":{"testid":"campo-proximo-passo"},"rotulo":"O que vem a seguir","tipo":"caixa"},{"alvo":{"testid":"salvar-proximo-passo"},"rotulo":"Salvar","tipo":"caixa"}],"clicar":{"testid":"salvar-proximo-passo"}},{"id":"p4","titulo":"Próximo passo anotado","texto":"A demanda agora mostra o próximo passo. Volte ao Radar pelo item \"Radar\" do menu da esquerda.","antes":[{"acao":"click","alvo":{"testid":"salvar-proximo-passo"}},{"acao":"aguardar","alvo":{"testid":"demanda-com-proximo-passo"}}],"destaques":[{"alvo":{"testid":"demanda-com-proximo-passo"},"rotulo":"Próximo passo anotado","tipo":"caixa"},{"alvo":{"role":"link","nome":"Radar","exato":true},"rotulo":"Voltar ao Radar","tipo":"seta"}],"clicar":{"role":"link","nome":"Radar","exato":true}},{"id":"p5","titulo":"A Fernanda saiu do quadro","texto":"De volta ao Radar, a Fernanda sai do quadro amarelo: ela já tem um próximo passo anotado. Se ela ainda aparecer, espere até um minuto ou atualize a página. Os negócios parados continuam na lista até alguém agir em cada um: anotar o próximo passo da demanda não tira o negócio da lista.","rota":"/app/radar","antes":[],"destaques":[{"alvo":{"testid":"radar-counts"},"rotulo":"Onde ficava o quadro amarelo","tipo":"caixa"}]}]}]},{"id":"agenda","titulo":"Agenda","tela":"/app/agenda","resumo":"Onde ficam as consultas, sessões e reuniões da equipe: ver a semana, marcar, remarcar, cancelar e registrar quem veio.","licoes":[{"id":"conhecendo-a-agenda","titulo":"Conhecendo a Agenda","objetivo":"Reconhecer as partes da Agenda e andar pelos dias, semanas e meses.","papel":"admin","busca":["agenda","agendamentos","calendário","compromissos","consultas marcadas","semana","mês","dia","hoje"],"passos":[{"id":"p1","titulo":"As partes da tela","texto":"A Agenda mostra os compromissos da clínica: consultas, sessões e reuniões da equipe. Abaixo do título \"Agendamentos\" ficam as setas para mudar de semana e os botões de visão. Logo depois vem a lista de compromissos, separada em abas, e mais abaixo a grade da semana, com um bloco colorido para cada compromisso. No topo, o quadro \"Sincronizar com o Google ainda não está disponível\" aparece enquanto a instalação não tem a ligação com o Google cadastrada. A Agenda funciona normalmente sem ela; só não troca compromissos com a agenda do Google.","dica":"Quem administra a instalação vê o link \"Cadastrar as credenciais do Google\". O resto do quadro, com o endereço de retorno, é para essa pessoa e pode ser ignorado por quem só usa a Agenda. Na sua instalação, o endereço mostra o seu domínio; na foto aparece o desta demonstração (127.0.0.1). Depois do cadastro, o quadro troca pelo botão \"Conectar Google\".","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[],"destaques":[{"alvo":{"testid":"google-nao-configurado"},"rotulo":"Ligação com o Google","tipo":"caixa"},{"alvo":{"role":"heading","nome":"Agendamentos","exato":true},"rotulo":"Título da tela","tipo":"caixa"},{"alvo":{"testid":"historico-da-agenda"},"rotulo":"Lista de compromissos","tipo":"caixa"},{"alvo":{"testid":"grade-da-agenda"},"rotulo":"Grade da semana","tipo":"caixa"}]},{"id":"p2","titulo":"Andar pelas semanas","texto":"As setas ao lado da data mudam o período: a da esquerda volta e a da direita avança. Na visão de semana, cada clique anda uma semana inteira. O texto ao lado das setas mostra o período que está na tela, de domingo a sábado. O botão \"Hoje\" volta para o dia de hoje, de onde você estiver.","antes":[],"destaques":[{"alvo":{"testid":"periodo-anterior"},"rotulo":"Voltar","tipo":"caixa"},{"alvo":{"testid":"periodo-seguinte"},"rotulo":"Avançar","tipo":"caixa"},{"alvo":{"testid":"periodo"},"rotulo":"Período na tela","tipo":"caixa"},{"alvo":{"role":"button","nome":"Hoje","exato":true},"rotulo":"Voltar para hoje","tipo":"caixa"}],"clicar":{"testid":"visao-dia"}},{"id":"p3","titulo":"Ver um dia só","texto":"Os botões \"Dia\", \"Semana\" e \"Mês\" trocam o tamanho do período. Em \"Dia\", a grade mostra só um dia, com mais espaço para cada compromisso, e as setas passam a andar um dia por vez. No celular, a Agenda já abre nesta visão.","antes":[{"acao":"click","alvo":{"testid":"visao-dia"}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"testid":"alternador-de-visao"},"rotulo":"Dia, Semana ou Mês","tipo":"seta"},{"alvo":{"testid":"periodo"},"rotulo":"O dia na tela","tipo":"seta"}],"clicar":{"testid":"visao-mes"}},{"id":"p4","titulo":"Ver o mês inteiro","texto":"Em \"Mês\", cada quadrado é um dia. Dentro dele aparecem até dois compromissos, com a hora e o nome, na cor de quem atende. Quando o dia tem mais, aparece no canto quantos ficaram de fora, como \"+1\". É o jeito de ver de longe quais dias estão cheios. Para voltar à grade de horários, clique em \"Semana\", no alto, ao lado de \"Dia\".","antes":[{"acao":"click","alvo":{"testid":"visao-mes"}},{"acao":"esperar","ms":1500},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}},{"acao":"press","tecla":"ArrowDown","alvo":{"testid":"visao-mes"}}],"destaques":[{"alvo":{"testid":"alternador-de-visao"},"rotulo":"Voltar para Semana","tipo":"seta"},{"alvo":{"testid":"grade-da-agenda"},"rotulo":"O mês na tela","tipo":"caixa"},{"alvo":{"css":"[data-testid^='celula-mes-']:has([data-testid='chip-mes-be300000-0000-4000-8000-000000000001'])"},"rotulo":"Dia com +1","tipo":"seta"}]}]},{"id":"agenda-de-cada-pessoa","titulo":"A agenda de cada pessoa da equipe","objetivo":"Saber de quem é cada compromisso e ver a agenda de uma pessoa só.","papel":"admin","busca":["agenda da equipe","agenda de um profissional","filtrar por pessoa","cores","quem atende","agenda da Ana","ver só uma pessoa"],"passos":[{"id":"p1","titulo":"Cada pessoa tem uma cor","texto":"As bolinhas com as iniciais, ao lado dos botões \"Dia\", \"Semana\" e \"Mês\", são as pessoas da equipe. Cada pessoa tem uma cor, e os compromissos dela aparecem na grade e na lista com essa cor. Aqui estão a Helena Prado, a Ana Ribeiro, da fisioterapia, e o Carlos Mendes, da odontologia.","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[],"destaques":[{"alvo":{"testid":"filtro-de-pessoas"},"rotulo":"Pessoas da equipe","tipo":"caixa"},{"alvo":{"testid":"agendamento-be300000-0000-4000-8000-000000000010"},"rotulo":"Compromisso da Ana","tipo":"caixa"}],"clicar":{"role":"button","nome":"Ver só a agenda de Ana Ribeiro","exato":true}},{"id":"p2","titulo":"Ver só a agenda de uma pessoa","texto":"Clique na bolinha de uma pessoa para ver só a agenda dela. A grade e a lista passam a mostrar apenas os compromissos da Ana, a bolinha dela sobe um pouco e as outras ficam cinza. Ao lado aparece o botão \"Todos\".","antes":[{"acao":"click","alvo":{"role":"button","nome":"Ver só a agenda de Ana Ribeiro","exato":true}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"testid":"filtro-de-pessoas"},"rotulo":"Só a Ana","tipo":"caixa"},{"alvo":{"testid":"botao-todos"},"rotulo":"Voltar a ver todos","tipo":"caixa"},{"alvo":{"testid":"grade-da-agenda"},"rotulo":"Só os compromissos da Ana","tipo":"caixa"}],"clicar":{"testid":"botao-todos"}},{"id":"p3","titulo":"Voltar a ver a equipe inteira","texto":"Para ver de novo a agenda de todos, clique em \"Todos\" ou outra vez na bolinha da pessoa escolhida. A grade volta a mostrar os compromissos da equipe inteira, cada um na cor de quem atende.","antes":[{"acao":"click","alvo":{"testid":"botao-todos"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"testid":"filtro-de-pessoas"},"rotulo":"Todos de volta","tipo":"caixa"}]}]},{"id":"lista-de-compromissos","titulo":"A lista de compromissos","objetivo":"Usar as abas da lista para ver o que vem pela frente, aprovar horários e registrar quem veio.","papel":"admin","busca":["próximos compromissos","aguardando confirmação","confirmar horário","passados","realizado","faltou","não compareceu","cancelados","histórico"],"passos":[{"id":"p1","titulo":"As quatro abas","texto":"A lista fica logo acima da grade e tem quatro abas: \"Próximos\", \"Aguardando confirmação\", \"Passados\" e \"Cancelados\". O número em cada aba diz quantos compromissos ela tem. A lista acompanha o período que está na tela: aqui avançamos uma semana com a seta da direita, para ver o que vem pela frente. Em cada linha aparecem o dia, o horário, o nome do cliente (ou o nome do compromisso, quando não há cliente), quem vai atender e a situação.","dica":"Clique no nome da linha para abrir os detalhes do compromisso.","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[{"acao":"click","alvo":{"testid":"periodo-seguinte"}},{"acao":"aguardar","alvo":{"testid":"linha-be300000-0000-4000-8000-000000000021"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"tablist","nome":"Filtrar o histórico","exato":true},"rotulo":"Abas da lista","tipo":"caixa"},{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000021"},"rotulo":"Um compromisso","tipo":"caixa"},{"alvo":{"testid":"periodo"},"rotulo":"Semana que vem","tipo":"seta"}],"clicar":{"testid":"aba-aguardando"}},{"id":"p2","titulo":"Aprovar um horário","texto":"Em \"Aguardando confirmação\" ficam os horários reservados que ainda precisam de um sim da clínica. Isso acontece nos tipos de atendimento em que uma pessoa aprova cada horário. O botão \"Confirmar\" aprova o horário, e ele passa para \"Próximos\".","antes":[{"acao":"click","alvo":{"testid":"aba-aguardando"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000023"},"rotulo":"Esperando aprovação","tipo":"caixa"},{"alvo":{"testid":"confirmar-be300000-0000-4000-8000-000000000023"},"rotulo":"Aprovar o horário","tipo":"seta"}],"clicar":{"testid":"aba-passados"}},{"id":"p3","titulo":"O que já passou","texto":"\"Passados\" mostra o que já aconteceu no período. Aqui voltamos para a semana passada, clicando duas vezes na seta da esquerda. Como a semana já passou, a grade avisa que não há horário livre. O selo diz o resultado: \"Realizado\" quando o paciente veio e \"Não compareceu\" quando faltou. Os que ainda estão como \"Confirmado\" esperam alguém da equipe dizer o que houve, com os botões \"Realizado\" e \"Faltou\".","antes":[{"acao":"click","alvo":{"testid":"aba-passados"}},{"acao":"click","alvo":{"testid":"periodo-anterior"}},{"acao":"click","alvo":{"testid":"periodo-anterior"}},{"acao":"aguardar","alvo":{"testid":"linha-be300000-0000-4000-8000-000000000004"}},{"acao":"esperar","ms":800},{"acao":"rolar","alvo":{"testid":"linha-be300000-0000-4000-8000-000000000004"}}],"destaques":[{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000004"},"rotulo":"Já registrado: faltou","tipo":"caixa"},{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000005"},"rotulo":"Sem registro: Realizado ou Faltou","tipo":"caixa"}],"clicar":{"testid":"realizado-be300000-0000-4000-8000-000000000005"}},{"id":"p4","titulo":"Registrar que o paciente veio","texto":"Ao clicar em \"Realizado\", aparece o aviso \"Marcado como realizado.\" e, em instantes, o selo da linha muda e os botões somem. Só dá para registrar presença ou falta depois que o horário começou.","antes":[{"acao":"click","alvo":{"testid":"realizado-be300000-0000-4000-8000-000000000005"}},{"acao":"esperar","ms":2000}],"destaques":[{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000005"},"rotulo":"Agora: Realizado","tipo":"caixa"}],"clicar":{"testid":"aba-cancelados"}},{"id":"p5","titulo":"Os cancelados","texto":"Em \"Cancelados\" ficam os horários desmarcados. Eles saem da grade, para o horário ficar livre de novo, mas continuam aqui para consulta.","antes":[{"acao":"click","alvo":{"testid":"aba-cancelados"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"linha-be300000-0000-4000-8000-000000000007"},"rotulo":"Horário desmarcado","tipo":"caixa"}]}]},{"id":"detalhes-do-compromisso","titulo":"Os detalhes de um compromisso","objetivo":"Abrir um compromisso e entender o que cada parte do painel mostra.","papel":"admin","busca":["abrir compromisso","detalhes da consulta","observação","anotação","local do atendimento","compareceu","faltou","lembrar em uma hora","motivo do cancelamento"],"passos":[{"id":"p1","titulo":"Abrir pelo bloco da grade","texto":"Clique num bloco da grade para abrir os detalhes daquele compromisso. Todo bloco mostra o nome; os mais compridos mostram também o horário de início. Aqui vamos abrir a reunião de equipe de quarta-feira.","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[],"destaques":[{"alvo":{"testid":"agendamento-be300000-0000-4000-8000-000000000009"},"rotulo":"Reunião de equipe","tipo":"caixa"}],"clicar":{"testid":"agendamento-be300000-0000-4000-8000-000000000009"}},{"id":"p2","titulo":"O que o painel mostra","texto":"Os detalhes abrem na lateral: o nome do compromisso, o dia e o horário, o local e a observação. A \"Anotação\" é um recado interno, para quem vai atender. Logo abaixo vem a situação (aqui, \"Agendado\", que é o mesmo que aparece como \"Confirmado\" na lista) e com quem é. Esta reunião não tem cliente, por isso aparece \"Compromisso pessoal, sem cliente vinculado.\". Quando há um cliente, no lugar aparece o link \"Ver contato\", que abre a ficha dele.","dica":"O quadro \"Sincronização Google\", no alto do painel, aparece em todo compromisso. Enquanto a agenda do Google não estiver conectada, ele pode dizer \"Ainda não publicado no Google.\" ou \"Há alterações aguardando sincronização.\", com o botão \"Tentar sincronizar novamente\". Pode ignorar: o compromisso fica só aqui na Agenda.","antes":[{"acao":"click","alvo":{"testid":"agendamento-be300000-0000-4000-8000-000000000009"}},{"acao":"aguardar","alvo":{"testid":"compromisso-horario"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"compromisso-horario"},"rotulo":"Dia e horário","tipo":"caixa"},{"alvo":{"testid":"compromisso-local"},"rotulo":"Local","tipo":"caixa"},{"alvo":{"testid":"compromisso-observacao"},"rotulo":"Observação","tipo":"caixa"},{"alvo":{"testid":"compromisso-anotacao"},"rotulo":"Recado interno","tipo":"caixa"}]},{"id":"p3","titulo":"As ações do compromisso","texto":"Mais abaixo ficam as ações. \"Compareceu\" e \"Faltou\" registram o que aconteceu, e só funcionam depois que o horário começou. Quando o compromisso tem cliente e ele avisou por mensagem, escolha a mensagem dele em \"Mensagem do cliente usada como evidência (opcional)\" antes de clicar. \"Lembrar em uma hora\" adia por uma hora o aviso que pede à equipe para registrar a presença. Para desmarcar, escreva o motivo, com pelo menos 3 letras, em \"Motivo do cancelamento\" e clique em \"Cancelar agendamento\".","antes":[{"acao":"rolar","alvo":{"role":"button","nome":"Cancelar agendamento","exato":true,"dentro":{"role":"dialog"}}}],"destaques":[{"alvo":{"role":"button","nome":"Compareceu","exato":true},"rotulo":"Registrar presença","tipo":"caixa"},{"alvo":{"role":"button","nome":"Faltou","exato":true},"rotulo":"Registrar falta","tipo":"caixa"},{"alvo":{"role":"button","nome":"Lembrar em uma hora","exato":true},"rotulo":"Adiar o aviso","tipo":"caixa"},{"alvo":{"rotulo":"Motivo do cancelamento"},"rotulo":"Motivo","tipo":"caixa"},{"alvo":{"role":"button","nome":"Cancelar agendamento","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Desmarcar","tipo":"caixa"}]}]},{"id":"novo-agendamento","titulo":"Marcar um novo agendamento","objetivo":"Marcar um horário para um cliente pelo botão Novo agendamento.","papel":"admin","busca":["marcar consulta","novo agendamento","agendar cliente","marcar horário","escolher dia","horários livres","convidado","endereço","observação"],"passos":[{"id":"p1","titulo":"O botão Novo agendamento","texto":"O botão \"Novo agendamento\", no alto à direita, abre o painel para marcar um horário. Ele só aparece para quem é atendente ou tem cargo acima, e fica apagado enquanto não houver nenhum tipo de agendamento cadastrado.","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[],"destaques":[{"alvo":{"testid":"novo-agendamento"},"rotulo":"Marcar um horário","tipo":"seta"}],"clicar":{"testid":"novo-agendamento"}},{"id":"p2","titulo":"Os dados do compromisso","texto":"O painel abre na lateral. Em cima ficam os dados do compromisso: \"Quem será atendido\", o \"Tipo de agendamento\", o \"E-mail do convidado\", o \"Endereço\" e a \"Observação\". Escolha o tipo pelos botões (eles aparecem quando a clínica tem mais de um tipo); cada um mostra a duração. O endereço já vem com o do tipo escolhido, e dá para trocar. Se \"Quem será atendido\" ficar em branco, o compromisso é pessoal, sem cliente.","dica":"O convite por e-mail só sai quando quem atende conectou a agenda do Google. Aí o cliente com e-mail na ficha já é convidado, e o \"E-mail do convidado\" serve para chamar mais alguém, como um acompanhante. Sem o Google conectado, ninguém recebe convite por e-mail.","antes":[{"acao":"click","alvo":{"testid":"novo-agendamento"}},{"acao":"aguardar","alvo":{"testid":"contexto-da-marcacao"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"testid":"quem-sera-atendido"},"rotulo":"Cliente","tipo":"caixa"},{"alvo":{"testid":"tipos-de-agendamento"},"rotulo":"Tipo e duração","tipo":"caixa"},{"alvo":{"testid":"email-do-convidado"},"rotulo":"Convidado","tipo":"caixa"},{"alvo":{"testid":"endereco-do-compromisso"},"rotulo":"Endereço","tipo":"caixa"},{"alvo":{"testid":"observacao-do-compromisso"},"rotulo":"Observação","tipo":"caixa"}],"clicar":{"testid":"quem-sera-atendido"}},{"id":"p3","titulo":"Escolher o cliente","texto":"Clique em \"Quem será atendido\" e digite o nome do cliente. A lista mostra os contatos que combinam; clique no certo. Quando nenhum contato combina com o que você digitou, a lista oferece \"Criar\" com esse nome, para cadastrar o cliente ali mesmo. A primeira opção, \"Compromisso pessoal, sem cliente\", serve para marcar um horário sem cliente, como uma reunião.","antes":[{"acao":"fill","alvo":{"testid":"quem-sera-atendido"},"valor":"Mariana"},{"acao":"aguardar","alvo":{"role":"option","nome":"Mariana Souza","exato":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"quem-sera-atendido"},"rotulo":"Nome digitado","tipo":"caixa"},{"alvo":{"role":"option","nome":"Mariana Souza","exato":true},"rotulo":"Cliente encontrado","tipo":"caixa"}],"clicar":{"role":"option","nome":"Mariana Souza","exato":true}},{"id":"p4","titulo":"O resumo e o calendário","texto":"Com o cliente escolhido, aparece \"Conversa vinculada (opcional)\", para ligar o compromisso a uma conversa dele. Mais abaixo, à esquerda, o painel resume o atendimento: quem atende, o tipo, a duração e o local. No calendário ao lado, os dias com horário livre ficam coloridos. Clique num deles.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Mariana Souza","exato":true}},{"acao":"esperar","ms":1000},{"acao":"aguardar","alvo":{"css":"[data-testid^='dia-'][data-disponivel='true']","n":1}},{"acao":"rolar","alvo":{"testid":"contexto-da-marcacao"}}],"destaques":[{"alvo":{"rotulo":"Conversa vinculada (opcional)"},"rotulo":"Ligar a uma conversa","tipo":"caixa"},{"alvo":{"testid":"contexto-da-marcacao"},"rotulo":"Resumo do atendimento","tipo":"caixa"},{"alvo":{"css":"[data-testid^='dia-'][data-disponivel='true']","n":1},"rotulo":"Dia com horário livre","tipo":"caixa"}],"clicar":{"css":"[data-testid^='dia-'][data-disponivel='true']","n":1}},{"id":"p5","titulo":"Escolher o horário e confirmar","texto":"Os horários livres do dia aparecem à direita. Clique no que quiser e aparece o resumo com o dia e a hora. O compromisso só é marcado quando você clica em \"Confirmar\". Depois disso, o painel mostra \"Marcado.\" e o botão \"Ver na agenda\".","dica":"Precisa de um horário que não está na lista? \"Outro horário\" deixa digitar a hora. Vale fora dos horários publicados; a agenda só recusa se o horário já estiver ocupado.","antes":[{"acao":"click","alvo":{"css":"[data-testid^='dia-'][data-disponivel='true']","n":1}},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"css":"[data-testid^='horario-']","n":0}},{"acao":"aguardar","alvo":{"testid":"confirmacao"}},{"acao":"esperar","ms":500},{"acao":"rolar","alvo":{"testid":"confirmar-marcacao"}}],"destaques":[{"alvo":{"testid":"lista-de-horarios"},"rotulo":"Horários livres do dia","tipo":"caixa"},{"alvo":{"testid":"confirmacao"},"rotulo":"Dia e hora escolhidos","tipo":"caixa"},{"alvo":{"testid":"confirmar-marcacao"},"rotulo":"Marcar","tipo":"seta"}]}]},{"id":"marcar-pela-grade","titulo":"Marcar direto na grade","objetivo":"Escolher o tipo de atendimento e marcar clicando num horário livre da grade.","papel":"admin","busca":["clicar na grade","horário livre","marcar rápido","horários livres de","tipo de atendimento","jornada","expediente","semana que vem"],"passos":[{"id":"p1","titulo":"Horários livres de qual tipo","texto":"Logo acima da grade fica a linha \"Horários livres de\", com um botão para cada tipo de agendamento. O tipo escolhido decide quais horários a grade oferece: a duração dele e o expediente de quem atende. Aqui está escolhida a \"Sessão de fisioterapia\", que é da Ana. Quando não sobra horário livre no período, aparece o aviso \"Nenhum horário livre neste período.\". E, se quem atende ainda não publicou o expediente, o aviso é \"A jornada de atendimento ainda não foi publicada.\".","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[],"destaques":[{"alvo":{"testid":"tipo-da-grade"},"rotulo":"Horários livres de","tipo":"caixa"},{"alvo":{"testid":"tipo-da-grade-be310000-0000-4000-8000-000000000001"},"rotulo":"Tipo escolhido","tipo":"caixa"}],"clicar":{"testid":"periodo-seguinte"}},{"id":"p2","titulo":"Achar um horário livre","texto":"Avançamos uma semana: ali a Ana ainda tem muitos horários livres. Passe o mouse na grade: o horário livre que está embaixo do mouse fica colorido e o cursor vira a mãozinha de clique. Os espaços fora do expediente e os horários já ocupados não mudam de cor nem respondem ao clique.","antes":[{"acao":"click","alvo":{"testid":"periodo-seguinte"}},{"acao":"aguardar","alvo":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0}},{"acao":"esperar","ms":800},{"acao":"rolar","alvo":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0}},{"acao":"hover","alvo":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0}}],"destaques":[{"alvo":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0},"rotulo":"Horário livre","tipo":"caixa"}],"clicar":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0}},{"id":"p3","titulo":"O painel já vem com a hora","texto":"Clique no horário livre e o painel de marcação abre com esse dia e essa hora já escolhidos. Preencha \"Quem será atendido\" no alto do painel, se for um cliente, e clique em \"Confirmar\".","antes":[{"acao":"click","alvo":{"css":"[data-testid^='bloco-'][data-testid$='-13:00'][data-livre='true']","n":0}},{"acao":"aguardar","alvo":{"testid":"confirmacao"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"confirmacao"},"rotulo":"Dia e hora da grade","tipo":"caixa"},{"alvo":{"testid":"confirmar-marcacao"},"rotulo":"Marcar","tipo":"seta"}]}]},{"id":"remarcar-e-cancelar","titulo":"Remarcar e cancelar","objetivo":"Mudar o horário de um compromisso e desmarcar com motivo.","papel":"admin","busca":["remarcar consulta","mudar horário","trocar dia","cancelar consulta","desmarcar","motivo do cancelamento","arrastar compromisso"],"passos":[{"id":"p1","titulo":"Remarcar e Cancelar na lista","texto":"Na aba \"Próximos\" da lista, cada compromisso tem os botões \"Remarcar\" e \"Cancelar\". Avançamos para a semana que vem e vamos remarcar a sessão de fisioterapia do Roberto Almeida.","rota":"/app/agenda?tipo=be310000-0000-4000-8000-000000000001","antes":[{"acao":"click","alvo":{"testid":"periodo-seguinte"}},{"acao":"aguardar","alvo":{"testid":"remarcar-be300000-0000-4000-8000-000000000021"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"remarcar-be300000-0000-4000-8000-000000000021"},"rotulo":"Mudar o horário","tipo":"caixa"},{"alvo":{"testid":"cancelar-be300000-0000-4000-8000-000000000021"},"rotulo":"Desmarcar","tipo":"caixa"}],"clicar":{"testid":"remarcar-be300000-0000-4000-8000-000000000021"}},{"id":"p2","titulo":"Escolher o novo horário","texto":"Abre o painel \"Remarcar agendamento\", com o mesmo calendário de marcar. Escolha o novo dia e o novo horário e clique em \"Confirmar\". O compromisso muda de lugar e continua com o mesmo cliente, o mesmo tipo e a mesma pessoa que atende.","dica":"Antes de clicar em \"Remarcar\", confira se \"Horários livres de\", acima da grade, está no tipo do compromisso: os horários oferecidos seguem esse tipo. Para remarcar uma consulta do Carlos, escolha antes \"Consulta odontológica\" ali. Trocar o tipo dentro do painel não muda o tipo do compromisso. Também dá para arrastar o bloco na grade até outro horário: a Agenda pergunta antes de remarcar.","antes":[{"acao":"click","alvo":{"testid":"remarcar-be300000-0000-4000-8000-000000000021"}},{"acao":"aguardar","alvo":{"testid":"contexto-da-marcacao"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"heading","nome":"Remarcar agendamento","exato":true},"rotulo":"Remarcando","tipo":"caixa"},{"alvo":{"testid":"painel-de-marcacao"},"rotulo":"Novo dia e horário","tipo":"caixa"}]},{"id":"p3","titulo":"Cancelar com motivo","texto":"Para desmarcar, clique em \"Cancelar\" na linha do compromisso. Aqui vamos desmarcar a sessão da Camila Rocha de quarta-feira. O painel pede o motivo, que é obrigatório: escreva pelo menos 3 letras e o botão \"Cancelar agendamento\" acende. O horário volta a ficar livre e o compromisso vai para a aba \"Cancelados\". \"Voltar\" fecha o painel sem cancelar nada.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"testid":"cancelar-be300000-0000-4000-8000-000000000024"}},{"acao":"aguardar","alvo":{"testid":"motivo-do-cancelamento"}},{"acao":"fill","alvo":{"testid":"motivo-do-cancelamento"},"valor":"A paciente pediu para remarcar por telefone."},{"acao":"esperar","ms":500}],"destaques":[{"alvo":{"testid":"motivo-do-cancelamento"},"rotulo":"Motivo","tipo":"caixa"},{"alvo":{"testid":"confirmar-cancelamento"},"rotulo":"Desmarcar","tipo":"caixa"},{"alvo":{"role":"button","nome":"Voltar","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Fechar sem cancelar","tipo":"caixa"}]}]}]},{"id":"respostas-rapidas","titulo":"Respostas rápidas","tela":"/app/templates","resumo":"Textos, imagens e áudios prontos que você e a equipe usam na Inbox com um clique, para não digitar a mesma coisa toda vez.","licoes":[{"id":"conhecendo-respostas-rapidas","titulo":"Conhecendo as respostas rápidas","objetivo":"Entender o que cada linha da lista mostra: de quem é a resposta, se leva imagem ou áudio e o que dá para fazer com ela.","papel":"admin","busca":["respostas rápidas","mensagens prontas","textos salvos","modelos de mensagem","scripts de atendimento","resposta padrão","onde ficam as respostas prontas"],"passos":[{"id":"p1","titulo":"A lista de respostas prontas","texto":"Respostas rápidas são mensagens que você salva uma vez e usa sempre que precisar, sem digitar de novo: horários, endereço, preparo para exame. Cada linha mostra o nome da resposta e o começo do texto. Elas aparecem na Inbox, logo acima do campo de mensagem, na mesma ordem desta lista.","rota":"/app/templates","antes":[],"destaques":[{"alvo":{"css":"[data-rfd-droppable-id='respostas-rapidas']"},"rotulo":"Suas respostas prontas","tipo":"caixa"},{"alvo":{"role":"button","nome":"Nova resposta rápida","exato":true},"rotulo":"Criar uma nova","tipo":"seta"}]},{"id":"p2","titulo":"Da equipe ou só sua","texto":"O selo ao lado do nome diz de quem é a resposta. \"Compartilhado\" é da equipe: todos usam. \"Pessoal\" é só de quem criou: aqui, a \"Confirmação de consulta\" é da Helena, que é quem está usando o sistema nesta tela, e só ela pode mudá-la. Os colegas não veem as respostas pessoais uns dos outros.","dica":"A conta que instalou o sistema é a exceção: ela vê também as respostas pessoais dos colegas, na lista e nos botões da Inbox, com o selo \"Pessoal\" e sem lápis nem lixeira.","antes":[],"destaques":[{"alvo":{"texto":"Compartilhado","exato":true,"n":0},"rotulo":"Da equipe","tipo":"caixa"},{"alvo":{"texto":"Pessoal","exato":true,"dentro":{"css":"li:has-text('Confirmação de consulta')"}},"rotulo":"Só de quem criou","tipo":"caixa"}]},{"id":"p3","titulo":"Respostas com imagem ou áudio","texto":"Uma resposta rápida pode levar imagens junto com o texto, ou ser só um áudio. O selo \"Imagens\" mostra quantas imagens ela leva. O selo \"🎧 Áudio\" marca a resposta que é um áudio gravado; no lugar do texto aparece \"Resposta rápida de áudio\".","antes":[],"destaques":[{"alvo":{"texto":"Imagens 1","exato":true},"rotulo":"Leva 1 imagem","tipo":"caixa"},{"alvo":{"texto":"🎧 Áudio","exato":true},"rotulo":"É um áudio","tipo":"caixa"}]},{"id":"p4","titulo":"Os botões de cada linha","texto":"À direita de cada linha ficam o lápis, que abre a resposta para editar, e a lixeira, que apaga. Os pontinhos à esquerda servem para mudar a ordem: clique neles e arraste a linha para cima ou para baixo. Esses botões só aparecem nas respostas que você pode mudar.","dica":"Quem é atendente vê os botões só nas respostas pessoais dele. As compartilhadas só gerente e administrador mudam.","antes":[],"destaques":[{"alvo":{"css":"[aria-label='Arrastar para reordenar']","n":0},"rotulo":"Arrastar para mudar a ordem","tipo":"seta"},{"alvo":{"role":"button","nome":"Editar resposta rápida","exato":true,"n":0},"rotulo":"Editar","tipo":"seta"},{"alvo":{"role":"button","nome":"Excluir resposta rápida","exato":true,"n":0},"rotulo":"Excluir","tipo":"seta"}]}]},{"id":"criar-resposta","titulo":"Criar uma resposta rápida","objetivo":"Salvar um texto pronto, com o nome do cliente trocado sozinho, e encontrá-lo na Inbox.","papel":"admin","busca":["criar resposta rápida","nova mensagem pronta","salvar texto para reutilizar","colocar nome do cliente na mensagem","atalho de mensagem","compartilhar resposta com a equipe"],"passos":[{"id":"p1","titulo":"Começar uma nova","texto":"Clique em \"Nova resposta rápida\", no alto da tela. Abre uma janela para escrever a resposta.","rota":"/app/templates","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Nova resposta rápida","exato":true},"rotulo":"Clique aqui","tipo":"seta"}],"clicar":{"role":"button","nome":"Nova resposta rápida","exato":true}},{"id":"p2","titulo":"Nome e mensagem","texto":"Em \"Título\" vai o nome curto que aparece no botão da Inbox. Em \"Mensagem\" vai o texto que o cliente vai receber. Escreva {{primeiro_nome}} onde quiser o primeiro nome do cliente, ou {{nome}} para o nome completo: na Inbox, ele é trocado sozinho pelo nome de quem está na conversa.","dica":"Se a Inbox não souber o nome do cliente (nem no cadastro, nem no WhatsApp), o {{primeiro_nome}} fica escrito do jeito que está, aparece um aviso amarelo e o envio fica travado até você apagar ou trocar essa parte.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova resposta rápida","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"Título","exato":true},"valor":"Pagamento por Pix"},{"acao":"fill","alvo":{"rotulo":"Mensagem","exato":true},"valor":"Oi, {{primeiro_nome}}! Aceitamos Pix, sim. A chave é o CNPJ da clínica: 12.345.678/0001-90. Depois é só mandar o comprovante por aqui."}],"destaques":[{"alvo":{"rotulo":"Título","exato":true},"rotulo":"Nome do botão","tipo":"caixa"},{"alvo":{"rotulo":"Mensagem","exato":true},"rotulo":"Texto para o cliente","tipo":"caixa"},{"alvo":{"texto":"para personalizar","exato":false},"rotulo":"Nome do cliente trocado sozinho","tipo":"seta"}]},{"id":"p3","titulo":"Atalho e equipe","texto":"O \"Atalho (opcional)\" é uma palavra curta para achar a resposta rápido: na Inbox, com o campo de mensagem vazio, digite / e o atalho (aqui, /pix) e clique na resposta que aparece na lista. Ligue \"Compartilhar com a equipe\" para todos usarem a resposta; desligado, ela fica só para você. Depois de criada, isso não muda mais. No fim, clique em \"Criar resposta rápida\".","dica":"Só gerente e administrador veem a opção de compartilhar. O que um atendente cria é sempre pessoal.","antes":[{"acao":"fill","alvo":{"rotulo":"Atalho (opcional)","exato":true},"valor":"pix"},{"acao":"click","alvo":{"role":"switch","nome":"Compartilhar com a equipe","exato":true}}],"destaques":[{"alvo":{"rotulo":"Atalho (opcional)","exato":true},"rotulo":"Palavra para achar com /","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Compartilhar com a equipe","exato":true},"rotulo":"Ligado: a equipe toda usa","tipo":"seta"}],"clicar":{"role":"button","nome":"Criar resposta rápida","exato":true}},{"id":"p4","titulo":"A resposta nova entra no topo","texto":"Ao clicar em \"Criar resposta rápida\", a janela fecha e a resposta aparece no alto da lista, com o selo \"Compartilhado\". Toda resposta nova entra em primeiro lugar; para mudar a posição, arraste-a pelos pontinhos.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar resposta rápida","exato":true}},{"acao":"aguardar","alvo":{"texto":"Pagamento por Pix","exato":true}}],"destaques":[{"alvo":{"css":"li:has-text('Pagamento por Pix')"},"rotulo":"Criada no topo","tipo":"caixa"}]},{"id":"p5","titulo":"Pronta para usar na Inbox","texto":"Abra uma conversa na Inbox: a resposta nova já está entre os botões acima do campo de mensagem. Um clique coloca o texto no campo, com o nome do cliente já trocado. Atenção: ele substitui o que você já tinha escrito. Nada é enviado sem você conferir e clicar em enviar. Se os botões estiverem apagados, a conversa ainda não pode receber resposta (por exemplo, falta assumi-la).","rota":"/app/inbox","antes":[{"acao":"click","alvo":{"css":"[data-conversation-id=\"be100000-0000-4000-8000-000000000001\"]"}},{"acao":"aguardar","alvo":{"testid":"barra-de-recursos"}}],"destaques":[{"alvo":{"testid":"barra-de-recursos"},"rotulo":"Respostas rápidas na Inbox","tipo":"caixa"},{"alvo":{"role":"button","nome":"Pagamento por Pix","exato":true,"dentro":{"testid":"barra-de-recursos"}},"rotulo":"A que você criou","tipo":"seta"}]}]},{"id":"imagem-e-audio","titulo":"Respostas com imagem ou áudio","objetivo":"Saber como pôr imagens numa resposta rápida, criar uma resposta de áudio e conferir o que já está salvo.","papel":"admin","busca":["resposta rápida com imagem","mandar foto pronta","resposta de áudio","áudio pronto para o cliente","anexar imagem na resposta","formato de áudio aceito"],"passos":[{"id":"p1","titulo":"Imagens junto com o texto","texto":"Na janela \"Nova resposta rápida\", abaixo do atalho, fica a parte \"Imagens (opcional)\". Clique em \"Adicionar imagem\" e escolha uma foto do seu computador: vale JPG ou PNG, até 5 MB cada, no máximo 5 imagens. Na Inbox, a imagem entra junto com o texto, e você vê a prévia antes de enviar.","rota":"/app/templates","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova resposta rápida","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"texto":"Imagens (opcional)","exato":true},"rotulo":"Imagens desta resposta","tipo":"seta"},{"alvo":{"texto":"Adicionar imagem","exato":true},"rotulo":"Escolher foto","tipo":"caixa"}],"clicar":{"role":"button","nome":"Áudio","exato":true}},{"id":"p2","titulo":"Uma resposta que é um áudio","texto":"No alto da janela, em \"Tipo de resposta rápida\", clique em \"Áudio\". O campo de mensagem dá lugar a \"Arquivo de áudio\": escolha o arquivo gravado (OGG, MP3, AAC, AMR ou WAV, até 16 MB). A resposta de áudio não tem texto: na Inbox, o clique abre a janela \"Enviar anexo\" com o arquivo pronto, e você confere e clica em \"Enviar\". Para ouvir antes, use o lápis aqui nesta tela.","dica":"O áudio do gravador do iPhone e do Mac (M4A) não é aceito e nem aparece na hora de escolher o arquivo. Converta para MP3 antes.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Áudio","exato":true}}],"destaques":[{"alvo":{"css":"div.space-y-2:has(> div.flex.gap-1 > button)","dentro":{"role":"dialog"}},"rotulo":"Texto ou Áudio","tipo":"caixa"},{"alvo":{"rotulo":"Arquivo de áudio","exato":true},"rotulo":"Escolha o arquivo","tipo":"caixa"}]},{"id":"p3","titulo":"Conferir a imagem salva","texto":"Para ver o que uma resposta já leva, clique no lápis dela. No \"Cartão da clínica\", a imagem aparece em miniatura abaixo de \"Imagens (opcional)\". O X no canto tira a imagem, mas nada muda até você clicar em \"Salvar\": \"Cancelar\" devolve tudo como estava.","rota":"/app/templates","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar resposta rápida","exato":true,"dentro":{"css":"li:has-text('Cartão da clínica')"}}},{"acao":"aguardar","alvo":{"role":"img","nome":"Imagem da resposta rápida","exato":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"img","nome":"Imagem da resposta rápida","exato":true},"rotulo":"Imagem salva","tipo":"caixa"},{"alvo":{"role":"button","nome":"Remover imagem","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Tirar a imagem","tipo":"seta"}]},{"id":"p4","titulo":"Ouvir o áudio salvo","texto":"Numa resposta de áudio, o lápis abre a janela com o tocador do áudio atual: dê o play para ouvir antes de usar (o tempo do áudio aparece depois do play). Para trocar o áudio, escolha outro arquivo em \"Arquivo de áudio\" e clique em \"Salvar\".","rota":"/app/templates","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar resposta rápida","exato":true,"dentro":{"css":"li:has-text('Orientações da fisioterapia')"}}},{"acao":"aguardar","alvo":{"css":"audio","dentro":{"role":"dialog"}}}],"destaques":[{"alvo":{"rotulo":"Arquivo de áudio","exato":true},"rotulo":"Trocar por outro","tipo":"caixa"},{"alvo":{"css":"audio","dentro":{"role":"dialog"}},"rotulo":"Áudio atual","tipo":"caixa"}]}]},{"id":"editar-ordenar-excluir","titulo":"Editar, mudar a ordem e excluir","objetivo":"Manter a lista em dia: corrigir um texto, deixar as mais usadas no começo e apagar o que não serve mais.","papel":"admin","busca":["editar resposta rápida","mudar texto da mensagem pronta","mudar ordem das respostas","arrastar resposta","apagar resposta rápida","excluir mensagem pronta"],"passos":[{"id":"p1","titulo":"Corrigir um texto","texto":"Clique no lápis da resposta que quer mudar. A janela \"Editar resposta rápida\" abre com tudo preenchido: altere o que precisar e clique em \"Salvar\". O botão \"Compartilhar com a equipe\" fica esmaecido, sem como clicar, porque não dá para mudar isso depois de criada.","dica":"Para transformar uma resposta pessoal em compartilhada, crie uma nova com a opção ligada e exclua a antiga.","rota":"/app/templates","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar resposta rápida","exato":true,"dentro":{"css":"li:has-text('Confirmação de consulta')"}}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"Mensagem","exato":true},"valor":"Oi, {{primeiro_nome}}! Passando para confirmar sua consulta de amanhã. Posso manter o horário? Se precisar remarcar, é só responder aqui."}],"destaques":[{"alvo":{"rotulo":"Mensagem","exato":true},"rotulo":"Texto corrigido","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Compartilhar com a equipe","exato":true},"rotulo":"Não muda depois de criada","tipo":"seta"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p2","titulo":"Mudar a ordem","texto":"As respostas mais usadas ficam melhor no começo, porque a Inbox mostra os botões na ordem desta lista. Clique nos pontinhos à esquerda de uma resposta e arraste para cima ou para baixo. Aqui, a \"Confirmação de consulta\" foi levada para o primeiro lugar.","dica":"Também dá pelo teclado: com o foco nos pontinhos, aperte a barra de espaço, use as setas ↑ e ↓ e aperte espaço de novo para soltar.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"esperar","ms":1500},{"acao":"press","tecla":"Space","alvo":{"css":"[aria-label='Arrastar para reordenar']","dentro":{"css":"li:has-text('Confirmação de consulta')"}}},{"acao":"press","tecla":"ArrowUp"},{"acao":"press","tecla":"ArrowUp"},{"acao":"press","tecla":"ArrowUp"},{"acao":"press","tecla":"Space"},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"li:has-text('Confirmação de consulta')"},"rotulo":"Agora é a primeira","tipo":"caixa"}]},{"id":"p3","titulo":"Excluir uma resposta","texto":"Clique na lixeira da resposta que não serve mais. Antes de apagar, aparece a pergunta \"Excluir esta resposta rápida?\": clique em \"Excluir\" para confirmar ou em \"Cancelar\" para desistir. Não dá para desfazer, e as imagens ou o áudio dela são apagados junto.","rota":"/app/templates","antes":[{"acao":"click","alvo":{"role":"button","nome":"Excluir resposta rápida","exato":true,"dentro":{"css":"li:has-text('Preparo para exame de sangue')"}}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Confirme antes de apagar","tipo":"caixa"},{"alvo":{"role":"button","nome":"Excluir","exato":true},"rotulo":"Apagar de vez","tipo":"seta"}],"clicar":{"role":"button","nome":"Excluir","exato":true}},{"id":"p4","titulo":"Saiu da lista","texto":"Depois de confirmar, o \"Preparo para exame de sangue\" some desta lista e dos botões da sua Inbox. Para os colegas, ele some assim que a Inbox deles recarregar.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Excluir","exato":true}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"[data-rfd-droppable-id='respostas-rapidas']"},"rotulo":"Sem o Preparo para exame de sangue","tipo":"caixa"}]}]},{"id":"visao-do-atendente","titulo":"O que o atendente vê","objetivo":"Entender o que muda quando quem entra na tela é um atendente, e não um gerente ou administrador.","papel":"agent","busca":["atendente não consegue editar resposta","permissão respostas rápidas","por que não aparece o lápis","resposta pessoal do atendente","quem pode compartilhar resposta"],"passos":[{"id":"p1","titulo":"A lista vista pela Ana","texto":"A Ana é atendente. Ela vê e usa todas as respostas compartilhadas, mas não tem lápis, lixeira nem pontinhos nelas: só gerente e administrador mudam o que é da equipe. A \"Confirmação de consulta\", que é pessoal da Helena, não aparece para ela.","rota":"/app/templates","antes":[],"destaques":[{"alvo":{"css":"li:has-text('Cartão da clínica')"},"rotulo":"Da equipe: a Ana só usa","tipo":"caixa"}],"clicar":{"role":"button","nome":"Nova resposta rápida","exato":true}},{"id":"p2","titulo":"O que a Ana cria é só dela","texto":"Na janela \"Nova resposta rápida\" da Ana não existe a opção \"Compartilhar com a equipe\": tudo o que um atendente cria fica pessoal. Para uma resposta valer para todos, peça a um gerente ou administrador que a crie.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova resposta rápida","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"Título","exato":true},"valor":"Lembrete dos exercícios"},{"acao":"fill","alvo":{"rotulo":"Mensagem","exato":true},"valor":"{{primeiro_nome}}, não esqueça dos alongamentos que combinamos: 3 vezes por semana, 10 minutos cada."}],"destaques":[{"alvo":{"role":"dialog"},"rotulo":"Sem a opção de compartilhar","tipo":"caixa"}],"clicar":{"role":"button","nome":"Criar resposta rápida","exato":true}},{"id":"p3","titulo":"A resposta pessoal da Ana","texto":"Depois de criada, a resposta aparece no alto da lista com o selo \"Pessoal\". Nela a Ana tem o lápis, a lixeira e os pontinhos: é dela, ela pode mudar. Os outros atendentes e o gerente não veem esta resposta.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar resposta rápida","exato":true}},{"acao":"aguardar","alvo":{"texto":"Lembrete dos exercícios","exato":true}}],"destaques":[{"alvo":{"css":"li:has-text('Lembrete dos exercícios')"},"rotulo":"Pessoal da Ana: ela pode mudar","tipo":"caixa"}]}]}]},{"id":"funis","titulo":"Funis","tela":"/app/kanban","resumo":"Onde você acompanha cada negócio da empresa num quadro: cada cliente é um cartão que anda pelas etapas, do primeiro contato até ganhar ou perder.","licoes":[{"id":"conhecendo-os-funis","titulo":"Conhecendo a tela de Funis","objetivo":"Reconhecer a lista de funis, os botões do topo e abrir o quadro de um funil.","papel":"admin","busca":["funis","funil de vendas","kanban","quadro de clientes","pipeline","onde ficam os negócios"],"passos":[{"id":"p1","titulo":"A lista de funis","texto":"Um funil é o caminho que um cliente percorre até fechar com você, dividido em etapas. Esta tela lista os funis da empresa. A Clínica Bem Viver tem um: \"Pacientes\". O selo \"Padrão\" marca o funil onde entra, sozinho, quem manda a primeira mensagem pelo WhatsApp da clínica (com o WhatsApp conectado).","rota":"/app/kanban","antes":[],"destaques":[{"alvo":{"css":"li[data-testid^='funil-']:has-text('Pacientes')"},"rotulo":"Um funil da empresa","tipo":"caixa"},{"alvo":{"texto":"Padrão","exato":true},"rotulo":"Funil padrão","tipo":"seta"}]},{"id":"p2","titulo":"Os botões do topo","texto":"\"Novo funil\" cria outro funil, por exemplo um só para pilates ou para odontologia. \"Importar planilha\" traz de uma vez uma lista de clientes que você já tem, num arquivo CSV: cada linha vira um cartão na primeira etapa do funil escolhido. Ao lado de cada funil ficam \"Renomear\" e \"Arquivar\"; você usa esses botões na última lição.","dica":"Só quem é gerente ou administrador vê \"Novo funil\", \"Renomear\" e \"Arquivar\". O atendente vê a lista e importa planilhas.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Novo funil","exato":true},"rotulo":"Criar outro funil","tipo":"caixa"},{"alvo":{"role":"button","nome":"Importar planilha","exato":true},"rotulo":"Trazer clientes de uma planilha","tipo":"caixa"}]},{"id":"p3","titulo":"A janela de importar planilha","texto":"Escolha em \"Funil de destino\" para onde os clientes vão e clique em \"Escolher o arquivo CSV\". CSV é um formato de planilha: no Excel, use Arquivo › Salvar como › CSV; no Google Planilhas, Arquivo › Fazer download › CSV. \"Baixar planilha modelo\" baixa um exemplo com as colunas certas. No fim, a janela mostra quantos cartões foram criados, as colunas que ela não reconheceu e as linhas recusadas, com o motivo.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Importar planilha","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"rotulo":"Funil de destino"},"rotulo":"Para qual funil","tipo":"caixa"},{"alvo":{"testid":"escolher-planilha"},"rotulo":"Escolher o arquivo","tipo":"caixa"},{"alvo":{"testid":"modelo-de-leads"},"rotulo":"Exemplo pronto","tipo":"seta"}]},{"id":"p4","titulo":"Abrindo o quadro do funil","texto":"Feche a janela e clique no nome do funil para abrir o quadro dele. É no quadro que você trabalha no dia a dia: ele mostra todos os clientes do funil, etapa por etapa.","dica":"O texto miúdo embaixo da lista lembra que, hoje, todo contato novo entra pelo funil padrão. Para mandar quem já é cliente para um funil separado, ligue \"Clientes pela agenda\" em Configurações › Tipos de agendamento. O link \"Abrir Tipos de agendamento\", ali mesmo, leva até lá.","antes":[{"acao":"press","tecla":"Escape"}],"destaques":[{"alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"},"rotulo":"Clique para abrir o quadro","tipo":"seta"}],"clicar":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}}]},{"id":"lendo-o-quadro","titulo":"Lendo o quadro do funil","objetivo":"Entender as colunas, os números do topo de cada etapa e o que cada cartão mostra.","papel":"admin","busca":["quadro","colunas do funil","etapas","cartão do cliente","valor do negócio","quanto tenho em cada etapa"],"passos":[{"id":"p1","titulo":"Cada coluna é uma etapa","texto":"O quadro tem uma coluna para cada etapa do funil, na ordem em que o cliente avança. Cada cartão é um negócio com um cliente. No topo da coluna aparecem o nome da etapa, quantos cartões ela tem e a soma do valor desses cartões.","dica":"Gerentes e administradores renomeiam uma etapa clicando no nome dela, no topo da coluna.","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}},{"acao":"aguardar","alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}],"destaques":[{"alvo":{"css":"[data-etapa-do-quadro]:has(input[aria-label='Nome da etapa «Primeiro contato»']) [data-cabecalho-da-etapa]"},"rotulo":"Etapa, quantidade e soma","tipo":"caixa"},{"alvo":{"css":"[data-etapa-do-quadro]:has(input[aria-label='Nome da etapa «Consulta agendada»'])"},"rotulo":"Outra etapa","tipo":"caixa"}]},{"id":"p2","titulo":"O que o cartão mostra","texto":"Em cima fica o título do negócio e, logo abaixo, o valor. A linha com o balão é a última mensagem da conversa com esse cliente: clicar nela abre a conversa na Inbox. O número verde no fim dessa linha conta as mensagens que ninguém leu ainda. Depois vêm o telefone do contato, quem é o responsável e há quanto tempo o cartão está nesta etapa (\"3h\" são três horas).","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Avaliação de fisioterapia — Roberto Almeida","exato":true},"rotulo":"Título do negócio","tipo":"seta"},{"alvo":{"css":"a[href^='/app/inbox?id=']","dentro":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}},"rotulo":"Última mensagem","tipo":"seta"},{"alvo":{"texto":"3h em Primeiro contato","exato":true},"rotulo":"Tempo nesta etapa","tipo":"seta"}]},{"id":"p3","titulo":"Quem cuida de cada negócio","texto":"O círculo com iniciais mostra o responsável. Círculo cheio é uma pessoa da equipe, como Ana Ribeiro. Círculo vazado, só com o contorno, é um agente de IA, como a Bia. O círculo tracejado com \"Sem responsável\", como no cartão da Mariana, avisa que ninguém está cuidando daquele negócio.","antes":[],"destaques":[{"alvo":{"css":"[aria-label='Responsável: Ana Ribeiro']","dentro":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}},"rotulo":"Uma pessoa","tipo":"caixa"},{"alvo":{"css":"[aria-label^='Responsável: Bia']","dentro":{"role":"group","nome":"Lead: Pacote de pilates — Camila Rocha","exato":true}},"rotulo":"Agente de IA","tipo":"caixa"},{"alvo":{"css":"[aria-label='Sem responsável']","dentro":{"role":"group","nome":"Lead: Primeira consulta nutricional — Mariana","exato":true}},"rotulo":"Ninguém cuidando","tipo":"caixa"}]},{"id":"p4","titulo":"Negócio esfriando","texto":"Quando um negócio fica parado, sem conversa nem mudança, por mais tempo que o normal da etapa (sem ajuste, um dia), o cartão ganha uma faixa laranja do lado esquerdo e o aviso \"Sem resposta há…\" logo abaixo do valor. O rodapé deixa de mostrar o tempo na etapa. É o mesmo aviso da tela Radar. Se já existe um retorno agendado com o cliente, o cartão não ganha o aviso. Aqui, a avaliação do Sérgio está parada há quatro dias: é hora de procurar esse cliente.","antes":[],"destaques":[{"alvo":{"texto":"Sem resposta há 4 dias","exato":true,"dentro":{"role":"group","nome":"Lead: Avaliação odontológica — Sérgio Tavares","exato":true}},"rotulo":"O aviso","tipo":"caixa"},{"alvo":{"texto":"em Consulta agendada","exato":true,"dentro":{"role":"group","nome":"Lead: Avaliação odontológica — Sérgio Tavares","exato":true}},"rotulo":"Sem o tempo na etapa","tipo":"seta"}]},{"id":"p5","titulo":"As etapas de ganho e de perda","texto":"Role o quadro para o lado para ver as outras etapas. Neste funil, \"Em tratamento\", a terceira coluna, é a etapa de ganho: o cartão que chega nela conta como negócio fechado. \"Cancelado\", a última coluna, é a etapa de perda. As colunas que dizem \"vazio\" ainda não têm nenhum cartão. No topo das etapas de ganho e de perda aparece também o valor \"ponderado\": na de ganho ele é igual à soma, porque o negócio já fechou; na de perda é zero.","antes":[{"acao":"rolar","alvo":{"css":"[data-etapa-do-quadro]:has(input[aria-label='Nome da etapa «Cancelado»'])"}}],"destaques":[{"alvo":{"role":"group","nome":"Lead: Implante dentário — Ricardo Nunes","exato":true},"rotulo":"Negócio perdido","tipo":"caixa"}]},{"id":"p6","titulo":"Quadro ou calendário","texto":"No alto, \"Quadro\" e \"Calendário\" trocam o jeito de ver o mesmo funil. O calendário espalha os cartões pelos dias de um campo de data que você cria no funil, como a data da avaliação (a data de fechamento previsto não entra). Este funil ainda não tem campo de data, então o calendário avisa isso. Os campos se criam em CRM › \"Ver tudo em CRM\" › \"Etapas do funil\".","antes":[{"acao":"click","alvo":{"testid":"visao-calendario"}}],"destaques":[{"alvo":{"css":"div:has(> [data-testid='visao-quadro'])"},"rotulo":"Quadro ou calendário","tipo":"caixa"},{"alvo":{"texto":"Este funil não tem campo de data para montar o calendário."},"rotulo":"Falta um campo de data","tipo":"caixa"}]}]},{"id":"achando-um-negocio","titulo":"Achando o negócio certo","objetivo":"Usar a busca e os filtros do quadro para ver só os cartões que interessam.","papel":"admin","busca":["buscar cliente no funil","filtro","filtrar por responsável","negócios perdidos","atrasados","etiqueta"],"passos":[{"id":"p1","titulo":"A barra de filtros","texto":"Acima das colunas fica a barra de filtros. A caixa de busca procura no título e na descrição dos negócios. Os botões ao lado filtram por responsável, por situação (\"Status\") e por etiqueta (\"Tag\"). \"Apenas atrasados\" mostra só os negócios abertos com data de fechamento prevista que já passou.","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}},{"acao":"aguardar","alvo":{"placeholder":"Buscar por título…"}}],"destaques":[{"alvo":{"placeholder":"Buscar por título…"},"rotulo":"Busca","tipo":"caixa"},{"alvo":{"role":"button","nome":"Responsável: Todos","exato":true},"rotulo":"Por responsável","tipo":"numero"},{"alvo":{"role":"button","nome":"Status: Todos","exato":true},"rotulo":"Por situação","tipo":"numero"},{"alvo":{"role":"button","nome":"Tag: todas","exato":true},"rotulo":"Por etiqueta","tipo":"numero"},{"alvo":{"css":"label:has-text('Apenas atrasados')"},"rotulo":"Só os atrasados","tipo":"numero"}]},{"id":"p2","titulo":"Buscando pelo nome","texto":"Digite parte do título, por exemplo \"pilates\". O quadro passa a mostrar só os cartões que combinam com o que você digitou. O botão \"Limpar filtros\" aparece no fim da barra e desfaz tudo de uma vez.","antes":[{"acao":"fill","alvo":{"placeholder":"Buscar por título…"},"valor":"pilates"},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"placeholder":"Buscar por título…"},"rotulo":"O que você digitou","tipo":"caixa"},{"alvo":{"role":"group","nome":"Lead: Pacote de pilates — Camila Rocha","exato":true},"rotulo":"O que combina","tipo":"caixa"},{"alvo":{"role":"button","nome":"Limpar filtros","exato":true},"rotulo":"Desfazer filtros","tipo":"caixa"}]},{"id":"p3","titulo":"Filtrando por responsável","texto":"Limpe a busca e abra \"Responsável\". \"Sem responsável\" mostra os negócios que ninguém pegou; \"Eu\" mostra os seus. Abaixo vêm as outras pessoas da equipe e os agentes de IA. Escolha \"Ana Ribeiro\" para ver só a carteira dela.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Limpar filtros","exato":true}},{"acao":"esperar","ms":600},{"acao":"click","alvo":{"role":"button","nome":"Responsável: Todos","exato":true}},{"acao":"aguardar","alvo":{"role":"menu"}}],"destaques":[{"alvo":{"role":"menuitem","nome":"Ana Ribeiro","regex":true},"rotulo":"Escolha a Ana","tipo":"seta"}],"clicar":{"role":"menuitem","nome":"Ana Ribeiro","regex":true}},{"id":"p4","titulo":"Só a carteira da Ana","texto":"Agora o quadro mostra só os negócios da Ana, e o botão passa a dizer \"Responsável: Ana Ribeiro\". O número no topo de cada coluna e a soma do valor também passam a contar só o que está visível.","antes":[{"acao":"click","alvo":{"role":"menuitem","nome":"Ana Ribeiro","regex":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"button","nome":"Responsável: Ana Ribeiro","exato":true},"rotulo":"Filtro ligado","tipo":"caixa"},{"alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true},"rotulo":"Negócio da Ana","tipo":"caixa"}]},{"id":"p5","titulo":"Vendo os negócios perdidos","texto":"Em \"Status\", \"Perdidos\" mostra só os negócios que não fecharam; eles ficam na etapa de perda, \"Cancelado\", no fim do quadro. Com esse filtro ligado aparece o botão \"Motivo\", que separa as perdas pelo motivo escolhido na hora de perder, como \"Preço\". Ao lado pode aparecer \"Categoria\", que agrupa as perdas por quem causou: o cliente, a própria clínica (\"Nós\"), a concorrência ou a falta de resposta. É um jeito rápido de ver por que os clientes desistem.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Responsável: Ana Ribeiro","exato":true}},{"acao":"click","alvo":{"role":"menuitem","nome":"Todos","exato":true}},{"acao":"esperar","ms":600},{"acao":"click","alvo":{"role":"button","nome":"Status: Todos","exato":true}},{"acao":"click","alvo":{"role":"menuitem","nome":"Perdidos","exato":true}},{"acao":"esperar","ms":800},{"acao":"rolar","alvo":{"css":"[role=group][aria-label='Lead: Implante dentário — Ricardo Nunes']"}},{"acao":"click","alvo":{"role":"button","nome":"Motivo: Todos","exato":true}},{"acao":"aguardar","alvo":{"role":"menu"}}],"destaques":[{"alvo":{"role":"menu"},"rotulo":"Motivos das perdas","tipo":"caixa"},{"alvo":{"css":"button:has-text('Status: Perdidos')"},"rotulo":"Só os perdidos","tipo":"caixa"},{"alvo":{"css":"[role=group][aria-label='Lead: Implante dentário — Ricardo Nunes']"},"rotulo":"Negócio perdido","tipo":"caixa"}]},{"id":"p6","titulo":"Negócios atrasados","texto":"Marque \"Apenas atrasados\" para ver os negócios abertos cuja data de fechamento prevista já passou. Aqui aparece a avaliação do Sérgio, que ficou de confirmar a data e sumiu: é o cliente para procurar hoje.","dica":"Os filtros ficam guardados no endereço da página. Se você copiar o endereço e mandar para alguém da equipe, a pessoa abre o quadro já filtrado.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"click","alvo":{"role":"button","nome":"Limpar filtros","exato":true}},{"acao":"esperar","ms":600},{"acao":"click","alvo":{"role":"checkbox","nome":"Apenas atrasados"}},{"acao":"esperar","ms":800},{"acao":"rolar","alvo":{"role":"group","nome":"Lead: Avaliação odontológica — Sérgio Tavares","exato":true}}],"destaques":[{"alvo":{"css":"label:has-text('Apenas atrasados')"},"rotulo":"Filtro de atrasados","tipo":"seta"},{"alvo":{"role":"group","nome":"Lead: Avaliação odontológica — Sérgio Tavares","exato":true},"rotulo":"Negócio atrasado","tipo":"caixa"}]}]},{"id":"novo-negocio","titulo":"Criando um negócio novo","objetivo":"Pôr um cliente no funil à mão, ligado ao contato dele.","papel":"admin","busca":["novo lead","criar negócio","adicionar cliente no funil","novo cartão","cadastrar oportunidade"],"passos":[{"id":"p1","titulo":"O botão \"Novo Lead\"","texto":"Quando um cliente chega por telefone ou no balcão, você mesmo cria o cartão dele. Clique em \"Novo Lead\", no alto do quadro. O sistema chama cada negócio de \"lead\".","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}},{"acao":"aguardar","alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Novo Lead","exato":true},"rotulo":"Criar um negócio","tipo":"seta"}],"clicar":{"role":"button","nome":"Novo Lead","exato":true}},{"id":"p2","titulo":"Escolha o contato","texto":"Comece pelo contato: digite o nome ou o telefone e clique na pessoa certa. Se ela ainda não está cadastrada, \"Criar contato\" cadastra ali mesmo. Um negócio sem contato não recebe WhatsApp nem entra nas automações.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Novo Lead","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"placeholder":"Procure pelo nome ou telefone"},"valor":"Beatriz"},{"acao":"aguardar","alvo":{"role":"button","nome":"Beatriz Nogueira","regex":true}}],"destaques":[{"alvo":{"placeholder":"Procure pelo nome ou telefone"},"rotulo":"Procure a pessoa","tipo":"caixa"},{"alvo":{"role":"button","nome":"Beatriz Nogueira","regex":true},"rotulo":"Clique no contato","tipo":"seta"},{"alvo":{"role":"button","nome":"Criar contato","exato":true},"rotulo":"Ou cadastre um novo","tipo":"caixa"}],"clicar":{"role":"button","nome":"Beatriz Nogueira","regex":true}},{"id":"p3","titulo":"Preencha o negócio","texto":"Ao escolher o contato, o título vem com o nome dele; troque por algo que diga o que está sendo negociado. Em \"Etapa\" já vem a primeira etapa do funil. Preencha o \"Valor\" e, se quiser, a data de \"Fechamento previsto\" e etiquetas em \"Tags\", separadas por vírgula.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Beatriz Nogueira","regex":true}},{"acao":"fill","alvo":{"rotulo":"Título","exato":true},"valor":"Limpeza e avaliação odontológica — Beatriz Nogueira"},{"acao":"fill","alvo":{"rotulo":"Valor (R$)","exato":true},"valor":"250"},{"acao":"fill","alvo":{"rotulo":"Tags (separadas por vírgula)","exato":true},"valor":"odontologia"}],"destaques":[{"alvo":{"rotulo":"Título","exato":true},"rotulo":"O que está sendo negociado","tipo":"caixa"},{"alvo":{"rotulo":"Valor (R$)","exato":true},"rotulo":"Quanto vale","tipo":"caixa"},{"alvo":{"rotulo":"Tags (separadas por vírgula)","exato":true},"rotulo":"Etiquetas","tipo":"caixa"}],"clicar":{"role":"button","nome":"Criar lead","exato":true}},{"id":"p4","titulo":"O cartão novo no quadro","texto":"Clique em \"Criar lead\". O cartão aparece na etapa escolhida, com o valor, o telefone e a última conversa do contato. O quadro desce sozinho até o cartão novo; os outros continuam lá em cima. Como a Beatriz ainda não tem ninguém fixo cuidando dela, ele nasce \"Sem responsável\". Para escolher quem cuida, use o menu do cartão, que você conhece na próxima lição.","dica":"Se o contato já tem um negócio aberto neste funil, ao clicar em \"Criar lead\" a janela avisa e mostra o link para o que já existe. Aí você escolhe entre \"Não criar\" e \"Criar mesmo assim\".","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar lead","exato":true}},{"acao":"aguardar","alvo":{"role":"group","nome":"Lead: Limpeza e avaliação odontológica — Beatriz Nogueira","exato":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"group","nome":"Lead: Limpeza e avaliação odontológica — Beatriz Nogueira","exato":true},"rotulo":"Negócio criado","tipo":"caixa"}]}]},{"id":"mover-e-fechar","titulo":"Andar com o negócio: mover, ganhar e perder","objetivo":"Mudar o cartão de etapa, trocar o responsável e fechar o negócio como ganho ou perdido, um por um ou vários de uma vez.","papel":"admin","busca":["mover cartão de etapa","arrastar","marcar como ganho","marcar como perdido","motivo da perda","trocar responsável","selecionar vários"],"passos":[{"id":"p1","titulo":"Arrastar muda a etapa","texto":"Para mudar um negócio de etapa, segure o cartão e arraste até a coluna nova. Para os outros comandos, passe o mouse no cartão: aparecem os três pontinhos no canto de cima. Clique neles para abrir o menu do cartão.","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}},{"acao":"aguardar","alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}},{"acao":"hover","alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Ações do lead","dentro":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}},"rotulo":"Menu do cartão","tipo":"seta"}],"clicar":{"role":"button","nome":"Ações do lead","dentro":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}},{"id":"p2","titulo":"O menu do cartão","texto":"\"Editar\" muda título, valor, descrição e data prevista. \"Responsável\" passa o negócio para outra pessoa ou para um agente de IA. \"Marcar como ganho\" e \"Marcar como perdido\" fecham o negócio. \"Levar para outro funil\" recria o negócio em outro funil e fecha este como perdido; com um funil só, a janela avisa que não há para onde levar. \"Excluir\" apaga o cartão, mas o contato e as conversas continuam.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Ações do lead","dentro":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}},{"acao":"aguardar","alvo":{"role":"menu"}}],"destaques":[{"alvo":{"role":"menu"},"rotulo":"Comandos do cartão","tipo":"caixa"}],"clicar":{"role":"menuitem","nome":"Marcar como perdido","exato":true}},{"id":"p3","titulo":"Perder com motivo","texto":"\"Marcar como perdido\" sempre pede o motivo. Escolha o que aconteceu, aqui \"Sem resposta do cliente\", e clique em \"Confirmar\". O cartão vai para a etapa de perda do funil. Os motivos ficam guardados e depois aparecem no filtro \"Motivo\".","dica":"A lista que vem pronta traz motivos de loja, como \"Produto indisponível\". Para usar motivos com as palavras da sua clínica, cadastre a lista na tela \"Etapas do funil\".","antes":[{"acao":"click","alvo":{"role":"menuitem","nome":"Marcar como perdido","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"click","alvo":{"role":"radio","nome":"Sem resposta do cliente","exato":true}}],"destaques":[{"alvo":{"role":"radio","nome":"Sem resposta do cliente","exato":true},"rotulo":"O motivo","tipo":"seta"},{"alvo":{"role":"button","nome":"Confirmar","exato":true},"rotulo":"Confirmar a perda","tipo":"caixa"}],"clicar":{"role":"button","nome":"Confirmar","exato":true}},{"id":"p4","titulo":"Ganhar o negócio","texto":"Quando o cliente fecha, abra o menu do cartão (aqui, o da Juliana) e clique em \"Marcar como ganho\". O cartão vai para a etapa de ganho do funil, aqui \"Em tratamento\", e conta como negócio fechado. Sem ajuste no funil, se depois ele voltar para uma etapa aberta, o negócio é reaberto.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Confirmar","exato":true}},{"acao":"esperar","ms":1500},{"acao":"hover","alvo":{"role":"group","nome":"Lead: Clareamento dental — Juliana Castro","exato":true}},{"acao":"click","alvo":{"role":"button","nome":"Ações do lead","dentro":{"role":"group","nome":"Lead: Clareamento dental — Juliana Castro","exato":true}}},{"acao":"aguardar","alvo":{"role":"menu"}}],"destaques":[{"alvo":{"role":"menuitem","nome":"Marcar como ganho","exato":true},"rotulo":"Fechou!","tipo":"seta"},{"alvo":{"css":"[role=group][aria-label='Lead: Clareamento dental — Juliana Castro']"},"rotulo":"Cartão da Juliana","tipo":"caixa"}],"clicar":{"role":"menuitem","nome":"Marcar como ganho","exato":true}},{"id":"p5","titulo":"O cartão foi para a etapa de ganho","texto":"O cartão da Juliana saiu de \"Consulta agendada\" e agora está em \"Em tratamento\", a etapa de ganho. O da avaliação do Roberto, que você marcou como perdido, foi para \"Cancelado\", no fim do quadro.","antes":[{"acao":"click","alvo":{"role":"menuitem","nome":"Marcar como ganho","exato":true}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"role":"group","nome":"Lead: Clareamento dental — Juliana Castro","exato":true},"rotulo":"Negócio ganho","tipo":"caixa"}]},{"id":"p6","titulo":"Selecionar vários cartões","texto":"Para mexer em vários negócios de uma vez, passe o mouse no cartão e marque a caixinha ao lado do título. Para marcar a etapa inteira, use a caixinha que aparece no topo da coluna. Segurar Ctrl (Cmd no Mac) e clicar no cartão também marca.","antes":[{"acao":"click","alvo":{"role":"checkbox","nome":"Selecionar: Pacote de pilates — Camila Rocha","exato":true}},{"acao":"click","alvo":{"role":"checkbox","nome":"Selecionar: Consulta nutricional — Pedro Henrique Lima","exato":true}},{"acao":"esperar","ms":600}],"destaques":[{"alvo":{"role":"checkbox","nome":"Selecionar: Pacote de pilates — Camila Rocha","exato":true},"rotulo":"Caixinha do cartão","tipo":"seta"},{"alvo":{"role":"checkbox","nome":"Selecionar todos em Primeiro contato","exato":true},"rotulo":"A etapa inteira","tipo":"seta"}]},{"id":"p7","titulo":"A barra de ações em grupo","texto":"Com cartões marcados, aparece uma barra embaixo. \"Mover para…\" muda todos de etapa, \"Responsável…\" passa todos para alguém, \"Tag…\" põe uma etiqueta, \"Marcar como perdido…\" fecha todos com um motivo e \"Exc

ozinho quem parou de responder: a primeira chave deixa ele marcar novos retornos, e a segunda liga os fluxos automáticos criados na tela Follow-ups.","antes":[{"acao":"rolar","alvo":{"role":"switch","nome":"Permitir que o agente marque novos retornos por conta própria","exato":true}}],"destaques":[{"alvo":{"role":"switch","nome":"Deixar o agente pedir uma tarefa a alguém e seguir conversando","exato":true},"rotulo":"Pedir ajuda à equipe","tipo":"seta"},{"alvo":{"role":"switch","nome":"Deixar o agente rascunhar uma proposta quando o cliente pedir orçamento","exato":true},"rotulo":"Rascunhar proposta","tipo":"seta"},{"alvo":{"role":"switch","nome":"Permitir que o agente marque novos retornos por conta própria","exato":true},"rotulo":"Marcar retornos","tipo":"seta"},{"alvo":{"role":"switch","nome":"Habilitar gatilhos automáticos de follow-up","exato":true},"rotulo":"Fluxos de follow-up","tipo":"seta"}]},{"id":"p6","titulo":"Comandos pelo celular","texto":"Com \"Aceitar #on/#off enviados pelo celular\" ligado, qualquer mensagem que alguém da equipe mandar pelo WhatsApp do celular pausa a IA naquela conversa até alguém mandar #on ou clicar em \"devolver ao automático\". O #off pausa sem responder o cliente. Desligado, como na foto, #on e #off são texto comum e responder pelo celular pausa a IA só por um tempo. Atenção: o comando é digitado no chat do cliente e pode aparecer para ele.","dica":"Esta chave salva na hora, sem passar pelo rascunho.","antes":[{"acao":"rolar","alvo":{"role":"switch","nome":"Usar o servidor de ferramentas externo durante o atendimento","exato":true}}],"destaques":[{"alvo":{"role":"switch","nome":"Aceitar #on/#off enviados pelo celular","exato":true},"rotulo":"Comandos #on e #off","tipo":"seta"}]}]},{"id":"bastidores-e-abas","titulo":"Os bastidores: organizar, conferir, testar e acompanhar","objetivo":"Conhecer as partes que trabalham por trás da conversa e as abas que mostram testes, versões e o trabalho do agente.","papel":"admin","busca":["organizar o sistema","funis do agente","verificações","afirmação clínica","testar agente","histórico de versões","reverter versão","execuções","propostas de melhoria"],"passos":[{"id":"p1","titulo":"Organiza o sistema","texto":"\"Organiza o sistema\" é a parte que trabalha depois da conversa. Ligando a chave e marcando em \"O que ele pode mexer no sistema\" o que ele pode fazer, o agente também abre chamados, distribui para a pessoa certa e organiza marcadores e etapas. Desligada, ele continua atendendo e o básico continua registrado sozinho. Em \"Em que negócios ele pode mexer\", marque os funis que ele cuida: sem nenhum marcado, ele conversa normalmente, mas não mexe em negócio nenhum.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}},{"acao":"click","alvo":{"testid":"papel-operacao"}}],"destaques":[{"alvo":{"testid":"operador-liga"},"rotulo":"Organizar depois da conversa","tipo":"seta"},{"alvo":{"testid":"operador-consequencia"},"rotulo":"O que muda se desligar","tipo":"caixa"},{"alvo":{"role":"checkbox","nome":"Pacientes","exato":true},"rotulo":"Funil que ele pode mexer","tipo":"seta"}]},{"id":"p2","titulo":"Confere antes de enviar","texto":"\"Confere antes de enviar\" mostra as verificações que o sistema faz em cada mensagem do agente antes de ela sair. São 14, nesta ordem: se uma barra a mensagem, o agente recebe o motivo e reescreve. A maioria não se desliga, como \"Respeitar quem pediu para parar\". No alto, \"Estilo de resposta\" é um ajuste à parte, para todos os agentes da empresa, que troca o travessão (—) por vírgula nas mensagens; aqui ele está desligado.","antes":[{"acao":"click","alvo":{"testid":"papel-seguranca"}}],"destaques":[{"alvo":{"testid":"item-conferencia-stop"},"rotulo":"Não se desliga","tipo":"caixa"}]},{"id":"p3","titulo":"Verificações que você escolhe","texto":"Algumas verificações têm chave. \"Não fazer afirmação clínica\" foi feita para a área da saúde: barra a mensagem em que o agente diz o que a pessoa tem, indica remédio ou dose ou garante resultado. Aqui ela aparece desligada; numa clínica, vale ligar. Essas chaves valem na hora e para a empresa toda, sem passar pelo rascunho.","antes":[{"acao":"rolar","alvo":{"testid":"item-conferencia-clinical_claim"}}],"destaques":[{"alvo":{"testid":"item-conferencia-clinical_claim"},"rotulo":"Feita para clínicas","tipo":"caixa"}]},{"id":"p4","titulo":"Testar sem mandar nada","texto":"A aba \"Teste\" mostra como o agente responderia a uma mensagem de exemplo, sem mandar nada pelo WhatsApp. No alto aparecem a versão que será testada (aqui, a v1 publicada) e o modelo de IA. Você escreve a mensagem e clica em \"Executar teste\". O aviso em laranja lembra que o teste gasta créditos da empresa de inteligência artificial. Como esta instalação de exemplo não tem chave de acesso, não vamos executar o teste aqui.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Teste","exato":true}},{"acao":"aguardar","alvo":{"rotulo":"Mensagem do cliente (sample)"}}],"destaques":[{"alvo":{"texto":"⚠ Modo teste consome créditos do provider."},"rotulo":"O teste gasta créditos","tipo":"caixa"},{"alvo":{"rotulo":"Mensagem do cliente (sample)"},"rotulo":"Mensagem de exemplo","tipo":"caixa"},{"alvo":{"role":"button","nome":"Executar teste","exato":true},"rotulo":"Rodar o teste","tipo":"seta"}]},{"id":"p5","titulo":"Histórico de versões","texto":"A aba \"Histórico\" lista as versões do agente e mostra qual está publicada. \"Diff\" compara uma versão com outra. \"Reverter\" cria uma versão nova igual àquela e a publica na hora; a versão que estava no ar continua guardada.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Histórico","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Reverter","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Diff","exato":true},"rotulo":"Comparar versões","tipo":"caixa"},{"alvo":{"role":"button","nome":"Reverter","exato":true},"rotulo":"Voltar a esta versão","tipo":"caixa"}]},{"id":"p6","titulo":"Execuções","texto":"A aba \"Execuções\" ganha uma linha cada vez que o agente trabalha: quando começou, se deu certo, se foi teste ou atendimento de verdade, quanto custou e quanto demorou. Em cada linha, \"Detalhes\" abre esses mesmos números num painel. Como a Bia ainda não atendeu ninguém, a lista está vazia.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Execuções","exato":true}},{"acao":"aguardar","alvo":{"texto":"Nenhuma execução ainda."}}],"destaques":[{"alvo":{"role":"table"},"rotulo":"Uma linha por trabalho","tipo":"caixa"}]},{"id":"p7","titulo":"Propostas de melhoria","texto":"Na aba \"Propostas\", o agente sugere melhorias que aprendeu com as conversas reais. Nada é aplicado sozinho: cada proposta tem um botão para você aplicar, se concordar. Atenção: \"Aplicar como versão nova\" publica a mudança na hora, sem passar pelo rascunho, e a versão anterior fica no Histórico. As propostas dependem da chave de acesso da inteligência artificial; por enquanto não há nenhuma.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Propostas","exato":true}},{"acao":"aguardar","alvo":{"texto":"Nenhuma proposta ainda"}}],"destaques":[{"alvo":{"texto":"Nenhuma proposta ainda"},"rotulo":"Sugestões aparecem aqui","tipo":"caixa"}]}]}]},{"id":"follow-ups","titulo":"Follow-ups","tela":"/app/ai/followups","resumo":"Mensagens de retorno que saem sozinhas para o paciente que parou de responder: os fluxos prontos, o construtor e a fila de quem está sendo acompanhado.","licoes":[{"id":"conhecendo-a-tela","titulo":"Conhecendo os Follow-ups","objetivo":"Saber o que é um fluxo de follow-up, ler o cartão de cada fluxo e reconhecer os três estados: Ativo, Rascunho e Desativado.","papel":"admin","busca":["follow-up","retorno automático","paciente sumiu","parou de responder","fluxos","mensagem automática","reengajar cliente"],"passos":[{"id":"p1","titulo":"Fluxos e Fila","texto":"Um follow-up é uma sequência de mensagens que sai sozinha para o paciente que parou de responder. A aba \"Fluxos\" mostra os fluxos da clínica. A aba \"Fila\" mostra quem está ou já passou por um fluxo, quando sai a próxima mensagem e os retornos que a IA combinou com o paciente. Para criar um fluxo, use \"Começar de um modelo\" (textos prontos para clínica), \"Novo fluxo\" (desenhar do zero) ou \"Importar fluxo\" (trazer um arquivo exportado).","dica":"Só quem é gerente ou administrador vê os botões de criar, mexer e cancelar. As outras pessoas da equipe veem os fluxos e a Fila, mas não mudam nada.","rota":"/app/ai/followups","antes":[],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"Fluxos e Fila","tipo":"caixa"},{"alvo":{"role":"button","nome":"Começar de um modelo","exato":true},"rotulo":"Fluxos prontos para clínica","tipo":"seta"},{"alvo":{"role":"button","nome":"Novo fluxo","exato":true},"rotulo":"Desenhar do zero","tipo":"caixa"},{"alvo":{"testid":"import-followup-flow"},"rotulo":"Trazer um arquivo de fluxo","tipo":"caixa"}]},{"id":"p2","titulo":"O cartão de um fluxo","texto":"Cada fluxo é um cartão. No alto ficam o nome e a situação. \"Versão: publicada\" quer dizer que o fluxo já foi publicado ao menos uma vez. \"Handoff\" diz o que o fluxo faz quando uma pessoa da equipe assume a conversa do paciente: \"Pausar\" (espera a pessoa), \"Cancelar\" (encerra o fluxo) ou \"Permitir\" (continua mandando). Embaixo aparece a data da última alteração.","antes":[],"destaques":[{"alvo":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"]) h3"},"rotulo":"Nome do fluxo","tipo":"caixa"},{"alvo":{"texto":"publicada","exato":true,"dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Já foi publicado","tipo":"seta"},{"alvo":{"texto":"Pausar","exato":true,"dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Quando uma pessoa assume","tipo":"seta"},{"alvo":{"texto":"Atualizado em","dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Última alteração","tipo":"caixa"}]},{"id":"p3","titulo":"Ativo, Rascunho e Desativado","texto":"O selo no canto do cartão diz a situação do fluxo. \"Ativo\": publicado e pronto para receber pacientes. \"Rascunho\": ainda não foi publicado e não manda mensagem para ninguém. \"Desativado\": foi publicado, mas alguém o desligou. Ele não recebe pacientes novos, mas quem já estava dentro segue até o fim. Para parar alguém, cancele o fluxo dessa pessoa na Fila.","antes":[],"destaques":[{"alvo":{"css":"[aria-label=\"status: Ativo\"]"},"rotulo":"Ativo","tipo":"caixa"},{"alvo":{"css":"[aria-label=\"status: Rascunho\"]"},"rotulo":"Rascunho","tipo":"caixa"},{"alvo":{"css":"[aria-label=\"status: Desativado\"]"},"rotulo":"Desativado","tipo":"caixa"}]},{"id":"p4","titulo":"Os botões do cartão","texto":"\"Renomear\" troca o nome do fluxo. \"Duplicar\" cria uma cópia com \"(cópia)\" no nome, sempre como rascunho. \"Exportar\" baixa o fluxo num arquivo que o botão \"Importar fluxo\" aceita, aqui ou em outra conta. \"Excluir\" pede confirmação e apaga o fluxo junto com o histórico de quem passou por ele; não dá para desfazer. Para abrir o fluxo, clique no nome dele.","antes":[],"destaques":[{"alvo":{"testid":"rename-followup-flow","dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Trocar o nome","tipo":"caixa"},{"alvo":{"testid":"duplicate-followup-flow","dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Fazer uma cópia","tipo":"caixa"},{"alvo":{"testid":"export-followup-flow","dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Baixar o arquivo","tipo":"caixa"},{"alvo":{"testid":"delete-followup-flow","dentro":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"])"}},"rotulo":"Apagar de vez","tipo":"caixa"}],"clicar":{"css":"li:has(h3[title=\"Consulta · retomar quem sumiu na marcação\"]) h3"}}]},{"id":"instalar-um-modelo","titulo":"Começar por um modelo pronto","objetivo":"Instalar um fluxo de modelo, com os textos já escritos, sem mandar mensagem para ninguém.","papel":"admin","busca":["modelo pronto","começar de um modelo","instalar fluxo","follow-up pronto","exame","consulta","falta","cirurgia"],"passos":[{"id":"p1","titulo":"Os modelos prontos","texto":"Clique em \"Começar de um modelo\". Abre a lista de modelos prontos, com os textos já escritos para as quatro vezes em que um paciente costuma sumir: consulta, exame, cirurgia e falta. Instalar não manda mensagem para ninguém: o fluxo nasce como rascunho para você revisar. O selo \"Já instalado\" marca os modelos que a clínica já tem.","rota":"/app/ai/followups","antes":[{"acao":"click","alvo":{"role":"button","nome":"Começar de um modelo","exato":true}},{"acao":"aguardar","alvo":{"testid":"modelo-clinica-consulta-retomada"}}],"destaques":[{"alvo":{"role":"heading","nome":"Modelos prontos","exato":true},"rotulo":"Modelos prontos","tipo":"caixa"},{"alvo":{"texto":"Já instalado","exato":true,"dentro":{"testid":"modelo-clinica-consulta-retomada"}},"rotulo":"A clínica já tem este","tipo":"seta"}]},{"id":"p2","titulo":"O que cada modelo diz","texto":"Cada modelo mostra a etapa do paciente (aqui, \"Exame\"), o nome, para que serve, quantas mensagens o paciente recebe se nunca responder, por quanto tempo o fluxo acompanha e o que faz o fluxo começar (\"Dispara quando\"). Este começa quando o negócio do paciente entra numa etapa do funil, por isso pede que você escolha a etapa.","antes":[{"acao":"rolar","alvo":{"testid":"modelo-clinica-exame-marcar"}}],"destaques":[{"alvo":{"testid":"modelo-clinica-exame-marcar"},"rotulo":"Modelo do exame","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Etapa do funil que dispara","dentro":{"testid":"modelo-clinica-exame-marcar"}},"rotulo":"Escolha a etapa","tipo":"seta"}],"clicar":{"role":"combobox","nome":"Etapa do funil que dispara","dentro":{"testid":"modelo-clinica-exame-marcar"}}},{"id":"p3","titulo":"Escolher a etapa do funil","texto":"A lista mostra as etapas dos seus funis, com o nome do funil depois do ponto. Escolha a etapa em que o paciente fica quando o exame foi pedido. Aqui escolhemos \"Em tratamento\", do funil \"Pacientes\".","antes":[{"acao":"click","alvo":{"role":"combobox","nome":"Etapa do funil que dispara","dentro":{"testid":"modelo-clinica-exame-marcar"}}},{"acao":"aguardar","alvo":{"role":"option","nome":"Em tratamento · Pacientes","exato":true}},{"acao":"hover","alvo":{"role":"option","nome":"Em tratamento · Pacientes","exato":true}}],"destaques":[{"alvo":{"role":"option","nome":"Em tratamento · Pacientes","exato":true},"rotulo":"Etapa escolhida","tipo":"seta"}],"clicar":{"role":"option","nome":"Em tratamento · Pacientes","exato":true}},{"id":"p4","titulo":"Instalar","texto":"Com a etapa escolhida, o botão \"Instalar\" fica liberado. Sem a etapa, ele continua apagado. Ao clicar, o fluxo é criado como rascunho e o construtor abre em seguida.","dica":"No fim da lista há um lembrete: revisar os textos no construtor, clicar em \"Publicar\" e ligar o fluxo num agente. A lição \"Publicar e ligar no agente\" mostra quando ligar no agente é mesmo necessário.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Em tratamento · Pacientes","exato":true}},{"acao":"rolar","alvo":{"role":"button","nome":"Instalar","exato":true,"dentro":{"testid":"modelo-clinica-exame-marcar"}}}],"destaques":[{"alvo":{"role":"combobox","nome":"Etapa do funil que dispara","dentro":{"testid":"modelo-clinica-exame-marcar"}},"rotulo":"Etapa escolhida","tipo":"caixa"},{"alvo":{"role":"button","nome":"Instalar","exato":true,"dentro":{"testid":"modelo-clinica-exame-marcar"}},"rotulo":"Criar o rascunho","tipo":"seta"}],"clicar":{"role":"button","nome":"Instalar","exato":true,"dentro":{"testid":"modelo-clinica-exame-marcar"}}},{"id":"p5","titulo":"O rascunho no construtor","texto":"O fluxo foi criado com o nome do modelo e o selo \"Rascunho\", e o construtor já abriu nele. Ali você lê as mensagens, ajusta para o jeito da sua clínica e publica. Enquanto for rascunho, ele não manda mensagem para ninguém.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Instalar","exato":true,"dentro":{"testid":"modelo-clinica-exame-marcar"}}},{"acao":"aguardar","alvo":{"testid":"node-card-inicio"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"heading","nome":"Exame · marcar o exame que foi pedido","exato":true},"rotulo":"O fluxo instalado","tipo":"caixa"},{"alvo":{"css":"[aria-label=\"status: Rascunho\"]"},"rotulo":"Ainda não manda nada","tipo":"seta"}]}]},{"id":"o-construtor","titulo":"Lendo um fluxo no construtor","objetivo":"Entender o desenho de um fluxo: as peças, a ordem em que acontecem e onde fica o texto de cada mensagem.","papel":"admin","busca":["construtor","editar fluxo","desenho do fluxo","mensagem do follow-up","mudar texto","peças","aguardar resposta"],"passos":[{"id":"p1","titulo":"O construtor","texto":"Ao abrir um fluxo, aparece o construtor. À esquerda, em \"Adicionar nó\", ficam as peças que você pode pôr no fluxo, como \"Aguardar\", \"Ação\" (mandar uma mensagem) e \"Fim\". Clique numa peça para adicioná-la. No meio fica o desenho do fluxo, que começa no \"Início\" e segue pelas linhas.","rota":"/app/ai/followups/be300000-0000-4000-8000-000000000001","antes":[{"acao":"aguardar","alvo":{"testid":"node-card-inicio"}},{"acao":"esperar","ms":800},{"acao":"press","tecla":"Alt","alvo":{"css":".react-flow__node[data-id=\"inicio\"]"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"testid":"node-palette"},"rotulo":"Peças para adicionar","tipo":"caixa"},{"alvo":{"testid":"flow-canvas"},"rotulo":"O desenho do fluxo","tipo":"caixa"}]},{"id":"p2","titulo":"A ordem das mensagens","texto":"Este fluxo segue da esquerda para a direita. Do \"Início\" ele manda a primeira mensagem (\"Retoma a marcação\") e espera a resposta. Se o paciente não responde no prazo, ele aguarda mais um pouco e manda a próxima mensagem. O desenho continua para a direita, com mais esperas e mensagens; para ver o resto, arraste o fundo do desenho para o lado.","dica":"Use os botões de mais e menos, no canto de baixo do desenho, para aproximar ou afastar. O botão \"Organizar\", no alto, alinha as peças.","antes":[],"destaques":[{"alvo":{"testid":"node-card-inicio"},"rotulo":"Começa aqui","tipo":"numero"},{"alvo":{"testid":"node-card-msg-1"},"rotulo":"1ª mensagem","tipo":"numero"},{"alvo":{"testid":"node-card-resposta-1"},"rotulo":"Espera a resposta","tipo":"numero"},{"alvo":{"testid":"node-card-espera-2"},"rotulo":"Aguarda mais um pouco","tipo":"numero"}],"clicar":{"testid":"node-card-msg-1"}},{"id":"p3","titulo":"O texto da mensagem","texto":"Clique numa peça para abrir os detalhes dela à direita. Nesta, \"Como escrever a mensagem\" está em \"Texto fixo\": o paciente recebe exatamente o texto do campo \"Texto enviado ao contato\", sem IA. As outras opções são \"Mensagem escrita pela IA\" e \"Modelo de mensagem pronto\". O que você muda vale para o rascunho; para guardar, use \"Salvar\" na barra de cima.","dica":"No WhatsApp conectado por QR code, o texto fixo sai a qualquer hora. No WhatsApp oficial (API da Meta), depois de 24 horas sem o paciente escrever, só chega um \"Modelo de mensagem pronto\" aprovado.","antes":[{"acao":"click","alvo":{"testid":"node-card-msg-1"}},{"acao":"aguardar","alvo":{"testid":"node-config-panel"}}],"destaques":[{"alvo":{"role":"combobox","nome":"Como escrever a mensagem"},"rotulo":"Texto fixo, IA ou modelo","tipo":"caixa"},{"alvo":{"rotulo":"Texto enviado ao contato","exato":true},"rotulo":"O que o paciente lê","tipo":"caixa"}],"clicar":{"testid":"node-card-resposta-1"}},{"id":"p4","titulo":"Esperar a resposta","texto":"A peça \"Espera a resposta\" segura o fluxo até o paciente responder ou o prazo acabar. Em \"Esperar a resposta por (minutos)\" fica o prazo: aqui, 2880 minutos, ou dois dias. Se o prazo acaba sem resposta, o fluxo segue pelo caminho \"Sem resposta\", até a próxima mensagem. Em \"Regras de texto\" fica uma palavra (aqui, \"quero\") que leva a um caminho próprio, mas ela só é usada quando \"Cancelar se o lead responder\", no gatilho do fluxo, está desligado.","dica":"Nos modelos prontos, \"Cancelar se o lead responder\" vem ligado: qualquer resposta do paciente encerra o fluxo dele, e quem continua a conversa é o atendimento.","antes":[{"acao":"click","alvo":{"testid":"node-card-resposta-1"}},{"acao":"aguardar","alvo":{"css":"#match-reply-grace"}}],"destaques":[{"alvo":{"css":"#match-reply-grace"},"rotulo":"O prazo para responder","tipo":"caixa"},{"alvo":{"texto":"Regras de texto","exato":true},"rotulo":"Palavra com caminho próprio","tipo":"seta"}]}]},{"id":"quando-comeca","titulo":"Quando o fluxo começa e quando ele pausa","objetivo":"Ler e ajustar o gatilho que coloca o paciente no fluxo, e escolher o que acontece quando uma pessoa da equipe assume a conversa.","papel":"admin","busca":["gatilho","quando começa","silêncio","minutos sem responder","etapa do funil","cancelar se responder","pausar handoff"],"passos":[{"id":"p1","titulo":"A barra do fluxo","texto":"No alto do construtor ficam o nome do fluxo, a situação e os botões. O botão do gatilho diz o que coloca o paciente no fluxo. Aqui é \"Gatilho: Silêncio (1440 min)\": o paciente entra 1440 minutos (um dia inteiro) depois da última mensagem que ele mandou, mesmo que a clínica não tenha respondido. Ao lado fica a escolha do que fazer quando uma pessoa assume a conversa.","rota":"/app/ai/followups/be300000-0000-4000-8000-000000000001","antes":[{"acao":"aguardar","alvo":{"testid":"trigger-config-button"}}],"destaques":[{"alvo":{"testid":"trigger-config-button"},"rotulo":"O que faz o fluxo começar","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Política de handoff","exato":true},"rotulo":"Quando uma pessoa assume","tipo":"caixa"}],"clicar":{"testid":"trigger-config-button"}},{"id":"p2","titulo":"Ajustar o gatilho","texto":"Clique no botão do gatilho para ver os detalhes. \"Tipo de gatilho\" escolhe o que faz o fluxo começar. Em \"Minutos de silêncio\" fica quanto tempo depois da última mensagem do paciente conta como sumiço (aqui, 1440). Os campos de baixo limitam quem entra e quantas vezes. Preencha \"Silêncio máximo\" e \"Quantas vezes no máximo, por contato\", e ligue \"Só começar se a equipe já respondeu a última mensagem do cliente\". Sem isso, o fluxo pode chegar a pacientes sumidos há meses e se repetir sem fim.","antes":[{"acao":"click","alvo":{"testid":"trigger-config-button"}},{"acao":"aguardar","alvo":{"testid":"trigger-config-panel"}}],"destaques":[{"alvo":{"role":"combobox","nome":"Tipo de gatilho","exato":true},"rotulo":"O que faz começar","tipo":"caixa"},{"alvo":{"rotulo":"Minutos de silêncio","exato":true},"rotulo":"Tempo desde a última mensagem","tipo":"caixa"},{"alvo":{"css":"#trigger-max-silence"},"rotulo":"Silêncio máximo","tipo":"caixa"},{"alvo":{"css":"#trigger-max-enrollments"},"rotulo":"Quantas vezes, no máximo","tipo":"caixa"}],"clicar":{"role":"combobox","nome":"Tipo de gatilho","exato":true}},{"id":"p3","titulo":"Os tipos de gatilho","texto":"Além de \"Silêncio\", o fluxo pode começar por \"Etapa do funil\" (o negócio entra numa etapa), \"Falta confirmada pela equipe\" (a equipe marca na agenda que o paciente faltou), \"Agente pediu ajuda\", \"Cliente voltou\" (volta a falar depois de um tempo), \"Lead criado\" (um negócio novo é criado), \"Automação (Webhooks)\" ou só à mão (\"Manual\").","antes":[{"acao":"click","alvo":{"role":"combobox","nome":"Tipo de gatilho","exato":true}},{"acao":"aguardar","alvo":{"role":"listbox"}}],"destaques":[{"alvo":{"role":"listbox"},"rotulo":"Os tipos de gatilho","tipo":"caixa"}]},{"id":"p4","titulo":"Quem entra, quem sai e salvar","texto":"Mais abaixo, com \"Só começar se a equipe já respondeu a última mensagem do cliente\" ligado, quem está esperando a clínica não entra no fluxo. Com \"Cancelar se o lead responder\" ligado, qualquer resposta do paciente tira ele do fluxo. Mudou algo no gatilho? Clique em \"Salvar gatilho\". O botão só fica liberado quando há alguma mudança.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"rolar","alvo":{"testid":"trigger-config-save"}}],"destaques":[{"alvo":{"testid":"trigger-exige-resposta"},"rotulo":"Só quem já foi atendido","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Cancelar se o lead responder","exato":true},"rotulo":"Resposta tira do fluxo","tipo":"caixa"},{"alvo":{"testid":"trigger-config-save"},"rotulo":"Guardar o gatilho","tipo":"caixa"}]},{"id":"p5","titulo":"Quando uma pessoa assume a conversa","texto":"Esta lista escolhe o que o fluxo faz quando alguém da equipe assume a conversa do paciente. \"Pausar durante handoff\" para o fluxo enquanto a pessoa atende. \"Cancelar durante handoff\" encerra o fluxo. \"Permitir durante handoff\" deixa as mensagens continuarem. A escolha vale assim que você clica, sem precisar salvar.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"click","alvo":{"role":"combobox","nome":"Política de handoff","exato":true}},{"acao":"aguardar","alvo":{"role":"listbox"}}],"destaques":[{"alvo":{"role":"listbox"},"rotulo":"Pausar, cancelar ou continuar","tipo":"caixa"}]}]},{"id":"publicar","titulo":"Publicar e ligar no agente","objetivo":"Publicar um rascunho, saber para que servem Desativar e Rollback, e ligar o fluxo no agente para as mensagens saírem sozinhas.","papel":"admin","busca":["publicar fluxo","ativar follow-up","desativar","rollback","voltar versão","ligar no agente","fluxo não dispara"],"passos":[{"id":"p1","titulo":"Um rascunho pronto para publicar","texto":"Este fluxo, \"Falta · remarcar quem não veio\", está como \"Rascunho\". Depois de revisar as mensagens, clique em \"Publicar\". O \"Salvar\" só guarda o rascunho, e fica liberado quando há alterações não salvas.","rota":"/app/ai/followups/be300000-0000-4000-8000-000000000002","antes":[{"acao":"aguardar","alvo":{"testid":"publish-button"}}],"destaques":[{"alvo":{"css":"[aria-label=\"status: Rascunho\"]"},"rotulo":"Ainda é rascunho","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Guardar o rascunho","tipo":"caixa"},{"alvo":{"testid":"publish-button"},"rotulo":"Colocar no ar","tipo":"seta"}],"clicar":{"testid":"publish-button"}},{"id":"p2","titulo":"Publicado","texto":"Ao publicar, o sistema confere o fluxo inteiro. Se faltar algo, a peça com problema fica com borda vermelha e o fluxo não é publicado. Deu certo: o selo vira \"Ativo\". Num fluxo de silêncio, podem aparecer avisos amarelos sobre limites que faltam preencher no gatilho. Leia e ajuste. \"Desativar\" para de receber pacientes novos, e quem já estava dentro segue até o fim. \"Rollback\" volta para a versão publicada anterior; por isso só fica liberado depois da segunda publicação.","antes":[{"acao":"click","alvo":{"testid":"publish-button"}},{"acao":"aguardar","alvo":{"css":"[aria-label=\"status: Ativo\"]"}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"css":"[aria-label=\"status: Ativo\"]"},"rotulo":"Agora está no ar","tipo":"caixa"},{"alvo":{"role":"button","nome":"Desativar","exato":true},"rotulo":"Desligar","tipo":"caixa"},{"alvo":{"testid":"rollback-button"},"rotulo":"Voltar à versão anterior","tipo":"caixa"}]},{"id":"p3","titulo":"Quando é preciso ligar no agente","texto":"Alguns fluxos só colocam pacientes sozinhos se estiverem ligados num agente publicado: os que usam a IA (\"Mensagem escrita pela IA\", \"Classificar (IA)\" ou uma espera em que a IA escolhe a hora) e os que começam por \"Falta confirmada pela equipe\", como o \"Falta · remarcar quem não veio\". Para ligar, abra Agentes, clique em \"Editar\" e role até o bloco \"Follow-up\". Ligue \"Habilitar gatilhos automáticos de follow-up\" e marque o fluxo em \"Fluxos publicados\".","dica":"Fluxos só com texto fixo e outros gatilhos, como o de silêncio, começam sozinhos mesmo sem agente. Só fluxos com o selo \"Ativo\" aparecem na lista do agente.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}},{"acao":"esperar","ms":2000},{"acao":"rolar","alvo":{"role":"switch","nome":"Habilitar gatilhos automáticos de follow-up","exato":true}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"switch","nome":"Habilitar gatilhos automáticos de follow-up","exato":true},"rotulo":"Ligar os gatilhos","tipo":"caixa"},{"alvo":{"role":"group","nome":"Fluxos publicados"},"rotulo":"Marque o fluxo","tipo":"caixa"}]},{"id":"p4","titulo":"Salvar e publicar o agente","texto":"Ligou e marcou? Volte ao alto da tela do agente. Enquanto a mudança não for salva, aparece \"Sem rascunho para publicar.\" e o \"Publicar\" fica apagado. Clique em \"Salvar rascunho\" e depois em \"Publicar\". Enquanto o agente não for publicado de novo, a mudança não vale para os pacientes.","antes":[{"acao":"click","alvo":{"role":"switch","nome":"Habilitar gatilhos automáticos de follow-up","exato":true}},{"acao":"click","alvo":{"role":"checkbox","nome":"Falta · remarcar quem não veio","exato":true}},{"acao":"rolar","alvo":{"role":"button","nome":"Salvar rascunho","exato":true}},{"acao":"esperar","ms":600}],"destaques":[{"alvo":{"role":"button","nome":"Salvar rascunho","exato":true},"rotulo":"Guardar a mudança","tipo":"caixa"},{"alvo":{"role":"button","nome":"^Publicar","regex":true},"rotulo":"Colocar no ar","tipo":"seta"},{"alvo":{"texto":"Sem rascunho para publicar.","exato":true},"rotulo":"Falta salvar","tipo":"seta"}]}]},{"id":"a-fila","titulo":"A Fila: quem está sendo acompanhado","objetivo":"Ler a Fila, entender cada situação, achar um paciente e cancelar um retorno quando ele não faz mais sentido.","papel":"admin","busca":["fila de follow-up","quem vai receber mensagem","próximo disparo","retorno agendado","promessa da IA","cancelar follow-up","pausado"],"passos":[{"id":"p1","titulo":"Quem está ou passou por um fluxo","texto":"A aba \"Fila\" lista cada paciente que está ou passou por um fluxo, e os retornos que a IA combinou. Cada linha mostra o paciente, o fluxo (e o agente que cuida dele), o passo em que ele está (ou o motivo do retorno), quando sai a próxima mensagem e a situação. O passo aparece como um código curto, como \"resposta-2\"; o nome completo aparece quando você abre o histórico do paciente. Quem tem a próxima mensagem mais cedo aparece primeiro.","rota":"/app/ai/followups","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Fila","exato":true}},{"acao":"aguardar","alvo":{"testid":"queue-row","n":0}}],"destaques":[{"alvo":{"role":"row","nome":"Antônio Ferreira","regex":true},"rotulo":"Um paciente no fluxo","tipo":"caixa"},{"alvo":{"role":"columnheader","nome":"Próximo disparo","exato":true},"rotulo":"Quando sai a próxima","tipo":"seta"}]},{"id":"p2","titulo":"As situações","texto":"\"Aguardando resposta\": a mensagem já saiu e o fluxo espera o paciente. \"Pausado (atendimento humano)\": alguém da equipe assumiu a conversa. \"Pausado por uma pessoa\": alguém segurou o fluxo de propósito. \"Cancelado\": o fluxo terminou antes do fim, por exemplo, quando o paciente responde. Na linha do Pedro aparece \"Promessa\" e \"Agendada\": é um retorno que a IA combinou com ele na conversa.","antes":[],"destaques":[{"alvo":{"css":"[aria-label=\"status: Aguardando resposta\"]"},"rotulo":"Esperando o paciente","tipo":"seta"},{"alvo":{"css":"[aria-label=\"status: Pausado (atendimento humano)\"]"},"rotulo":"Uma pessoa assumiu","tipo":"seta"},{"alvo":{"css":"[aria-label=\"status: Pausado por uma pessoa\"]"},"rotulo":"Segurado de propósito","tipo":"seta"},{"alvo":{"css":"[aria-label=\"status: Cancelado\"]"},"rotulo":"Saiu do fluxo","tipo":"seta"},{"alvo":{"css":"[aria-label=\"status: Agendada\"]"},"rotulo":"Retorno combinado pela IA","tipo":"seta"}]},{"id":"p3","titulo":"Achar um paciente","texto":"Digite o nome ou o telefone em \"Buscar contato…\" para achar alguém na Fila. Aqui digitamos \"Lucas\". Os dois filtros ao lado mostram só uma situação (\"Todos os status\") ou só um fluxo (\"Todos os fluxos\").","dica":"Com um filtro de situação ou de fluxo escolhido, os retornos combinados pela IA saem da lista, porque eles não pertencem a nenhum fluxo.","antes":[{"acao":"fill","alvo":{"role":"textbox","nome":"Buscar contato","exato":true},"valor":"Lucas"},{"acao":"esperar","ms":1200}],"destaques":[{"alvo":{"role":"textbox","nome":"Buscar contato","exato":true},"rotulo":"Nome ou telefone","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Filtrar por status","exato":true},"rotulo":"Só uma situação","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Filtrar por fluxo","exato":true},"rotulo":"Só um fluxo","tipo":"caixa"}]},{"id":"p4","titulo":"Cancelar um retorno","texto":"O botão \"Cancelar\" aparece, para gerente e administrador, nas linhas que ainda não terminaram, inclusive as pausadas. Ele sempre pede confirmação. Num retorno combinado pela IA, a pergunta é \"Cancelar este retorno?\": o agente não volta a falar com a pessoa no horário combinado. Num fluxo, a pergunta é \"Cancelar este follow-up?\" e não dá para desfazer. \"Voltar\" fecha a pergunta sem cancelar nada.","antes":[{"acao":"fill","alvo":{"role":"textbox","nome":"Buscar contato","exato":true},"valor":""},{"acao":"aguardar","alvo":{"role":"button","nome":"Cancelar retorno","exato":true}},{"acao":"click","alvo":{"role":"button","nome":"Cancelar retorno","exato":true}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Pede confirmação","tipo":"caixa"},{"alvo":{"role":"button","nome":"Voltar","exato":true},"rotulo":"Desistir","tipo":"seta"}]}]},{"id":"o-dossie","titulo":"O histórico de um paciente no fluxo","objetivo":"Abrir o histórico de um paciente no fluxo, ver onde ele está e o que já aconteceu, e pausar, adiar ou pular um passo.","papel":"admin","busca":["histórico do follow-up","o que aconteceu","pausar follow-up","adiar mensagem","pular passo","onde está o paciente","dossiê"],"passos":[{"id":"p1","titulo":"Abrir pelo nome","texto":"Na Fila, o nome do paciente é um link. Clique nele para abrir o histórico daquele paciente no fluxo. Os retornos combinados pela IA não têm link, porque são um aviso só, com dia e motivo.","rota":"/app/ai/followups","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Fila","exato":true}},{"acao":"aguardar","alvo":{"role":"link","nome":"Antônio Ferreira","exato":true}}],"destaques":[{"alvo":{"role":"link","nome":"Antônio Ferreira","exato":true},"rotulo":"Abre o histórico","tipo":"seta"}],"clicar":{"role":"link","nome":"Antônio Ferreira","exato":true}},{"id":"p2","titulo":"Onde ele está agora","texto":"No alto aparecem o nome, a situação, o fluxo, o agente, quando começou e quantos passos já deu. O quadro \"Onde está agora\" diz o passo atual e quando o fluxo volta a andar. O Antônio já recebeu duas mensagens e o fluxo espera a resposta da segunda.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Antônio Ferreira","exato":true}},{"acao":"aguardar","alvo":{"testid":"dossie-status"}}],"destaques":[{"alvo":{"testid":"dossie-status"},"rotulo":"Situação","tipo":"caixa"},{"alvo":{"testid":"dossie-onde-esta"},"rotulo":"Passo atual","tipo":"caixa"},{"alvo":{"testid":"dossie-proximo-passo"},"rotulo":"Quando volta a andar","tipo":"seta"}]},{"id":"p3","titulo":"Mexer no fluxo de um paciente","texto":"\"Pausar\" segura o fluxo até alguém clicar em \"Retomar\". \"Adiar\" escolhe um novo dia e hora para o próximo passo. \"Pular este passo\" segue em frente sem esperar. \"Cancelar follow-up\" tira o paciente do fluxo de vez e não dá para desfazer.","antes":[],"destaques":[{"alvo":{"testid":"dossie-pausar"},"rotulo":"Segurar","tipo":"caixa"},{"alvo":{"testid":"dossie-adiar"},"rotulo":"Mudar o dia","tipo":"caixa"},{"alvo":{"testid":"dossie-pular"},"rotulo":"Seguir em frente","tipo":"caixa"},{"alvo":{"testid":"dossie-cancelar"},"rotulo":"Tirar do fluxo","tipo":"caixa"}],"clicar":{"testid":"dossie-pular"}},{"id":"p4","titulo":"Pular para qual caminho","texto":"Quando o passo tem mais de um caminho, o sistema pergunta \"Por onde seguir?\" em vez de escolher sozinho. Cada opção mostra para onde o fluxo vai e em que caso esse caminho é usado. Para desistir sem mudar nada, feche no X.","antes":[{"acao":"click","alvo":{"testid":"dossie-pular"}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"role":"dialog"},"rotulo":"Escolha o caminho","tipo":"caixa"}]},{"id":"p5","titulo":"O que já aconteceu","texto":"Mais abaixo, \"O que já aconteceu\" conta, em ordem, cada passo do fluxo: as mensagens enviadas, as esperas e quando o paciente não respondeu no prazo. Cada linha mostra também o passo e a hora.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"aguardar","alvo":{"testid":"dossie-timeline"}}],"destaques":[{"alvo":{"testid":"dossie-timeline"},"rotulo":"Linha do tempo","tipo":"caixa"}]}]}]},{"id":"casos","titulo":"Casos","tela":"/app/ai/cases","resumo":"Os pedidos que a IA não consegue resolver sozinha e deixa para a equipe decidir, enquanto continua falando com o cliente.","licoes":[{"id":"conhecendo-a-tela","titulo":"Conhecendo a tela de Casos","objetivo":"Entender o que é um caso, onde fica a lista e como ler cada linha.","papel":"admin","busca":["casos","o que é um caso","IA travou","IA pediu ajuda","pendências da IA","fila de casos"],"passos":[{"id":"p1","titulo":"O que aparece aqui","texto":"Às vezes a IA recebe um pedido que só alguém da equipe resolve: um desconto, um horário fora da agenda, uma dúvida do convênio. Nesses momentos ela abre um caso nesta tela e continua conversando com o cliente enquanto espera a sua resposta. À esquerda fica a lista de casos. À direita aparecem os detalhes do caso que você abrir.","dica":"A lista se atualiza sozinha a cada minuto. O número ao lado de \"Casos\" no menu conta só os casos que estão esperando a equipe. Quem é atendente só vê os casos das conversas a que tem acesso.","rota":"/app/ai/cases","antes":[],"destaques":[{"alvo":{"css":"[data-testid='case-list'] ul"},"rotulo":"Lista de casos","tipo":"caixa"},{"alvo":{"texto":"Selecione um caso à esquerda","exato":true},"rotulo":"Aqui aparecem os detalhes","tipo":"caixa"}]},{"id":"p2","titulo":"Lendo uma linha da lista","texto":"Cada linha mostra o assunto do caso, escrito pela IA, e um selo com a situação. \"Aguardando você\" quer dizer que a IA está esperando uma decisão da equipe. \"Aguardando o cliente\" quer dizer que a equipe já pediu uma informação e agora é o cliente que precisa responder. Embaixo vêm o tipo do pedido (como \"Pagamento\" ou \"Horário\"), o nome do cliente e há quanto tempo o caso foi aberto. Os casos mais novos ficam no alto.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Desconto no Pix"},"rotulo":"Caso esperando a equipe","tipo":"caixa"},{"alvo":{"role":"button","nome":"Sábado de manhã"},"rotulo":"Caso esperando o cliente","tipo":"caixa"}],"clicar":{"role":"tab","nome":"Concluídos","exato":true}},{"id":"p3","titulo":"Abertos e Concluídos","texto":"A aba \"Abertos\" mostra os casos que ainda não terminaram, e o número entre parênteses diz quantos são. A aba \"Concluídos\" guarda os que já acabaram, com três desfechos possíveis: \"Concluído\" (a equipe ou a IA resolveu), \"Virou atendimento humano\" (a conversa passou para uma pessoa da equipe) e \"Cancelado\" (o pedido deixou de existir).","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Concluídos","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Trocar sessão"}}],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"Abertos e Concluídos","tipo":"caixa"},{"alvo":{"role":"button","nome":"Trocar sessão"},"rotulo":"Concluído","tipo":"caixa"},{"alvo":{"role":"button","nome":"Curativo"},"rotulo":"Virou atendimento humano","tipo":"caixa"},{"alvo":{"role":"button","nome":"Recibo do plano"},"rotulo":"Cancelado","tipo":"caixa"}]}]},{"id":"abrindo-um-caso","titulo":"Abrindo um caso","objetivo":"Abrir um caso e entender o que o cliente pediu, por que a IA travou e o que já aconteceu.","papel":"admin","busca":["abrir caso","detalhes do caso","por que a IA travou","o que o cliente precisa","linha do tempo","ver conversa do caso"],"passos":[{"id":"p1","titulo":"Quem é o cliente","texto":"Clique numa linha da lista para ver o caso à direita. No alto aparecem o nome e o telefone do cliente e o selo com a situação do caso. O link \"Ver conversa\" abre a conversa desse cliente na Inbox, para você ler tudo o que ele e a IA já falaram.","rota":"/app/ai/cases","antes":[{"acao":"click","alvo":{"role":"button","nome":"Desconto no Pix"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Pedro Henrique Lima","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Desconto no Pix"},"rotulo":"Caso aberto","tipo":"caixa"},{"alvo":{"css":"[data-testid='case-detail'] header > div:first-child"},"rotulo":"Cliente e link da conversa","tipo":"caixa"},{"alvo":{"texto":"Aguardando você","exato":true,"dentro":{"testid":"case-detail"}},"rotulo":"Situação do caso","tipo":"caixa"}]},{"id":"p2","titulo":"O pedido e o motivo","texto":"Dois quadros resumem o caso. \"O que o cliente precisa\" conta o pedido com as palavras da IA. \"Por que a IA travou\" explica o que impediu a IA de resolver sozinha. Aqui, o Pedro quer desconto no Pix, e a IA não pode prometer um preço diferente sem a equipe confirmar.","antes":[],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] div.grid > div:nth-child(1)"},"rotulo":"O pedido","tipo":"caixa"},{"alvo":{"css":"[data-testid='case-detail'] div.grid > div:nth-child(2)"},"rotulo":"Por que a IA travou","tipo":"caixa"}]},{"id":"p3","titulo":"A linha do tempo","texto":"No fim do caso fica a \"Linha do tempo\": tudo o que aconteceu, do mais antigo para o mais novo, com há quanto tempo foi. Aqui ela mostra que a IA abriu o caso e depois registrou que avisou o Pedro de que a recepção confirma o valor. Quando alguém da equipe responde, a resposta também entra nesta lista.","antes":[{"acao":"rolar","alvo":{"role":"heading","nome":"Linha do tempo","exato":true}}],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] > div > div:last-child"},"rotulo":"Tudo o que já aconteceu","tipo":"caixa"}]}]},{"id":"respondendo-um-caso","titulo":"Respondendo um caso","objetivo":"Escolher o que fazer com um caso que espera a equipe e mandar a decisão para a IA.","papel":"admin","busca":["responder caso","resolver caso","concluir caso","passar para humano","pedir informação ao cliente","decisão da equipe"],"passos":[{"id":"p1","titulo":"Três caminhos","texto":"No quadro \"O que você quer fazer?\" você escolhe o que acontece com o caso. \"Concluí\": você resolveu, e a IA avisa o cliente e encerra o assunto. \"Preciso de info do cliente\": a IA pergunta ao cliente o que faltou, e o caso volta para você quando ele responder. \"Não consigo — passar pra humano\": a IA sai da conversa e o cliente passa a ser atendido por uma pessoa da equipe.","dica":"Nenhuma opção vem marcada, de propósito: \"Concluí\" e \"Não consigo\" encerram o caso, e não dá para desfazer.","rota":"/app/ai/cases","antes":[{"acao":"click","alvo":{"role":"button","nome":"Desconto no Pix"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Pedro Henrique Lima","exato":true}},{"acao":"rolar","alvo":{"role":"radiogroup","nome":"O que você quer fazer?"}}],"destaques":[{"alvo":{"role":"radio","nome":"Concluí"},"rotulo":"Resolvi","tipo":"numero"},{"alvo":{"role":"radio","nome":"Preciso de info do cliente"},"rotulo":"Falta uma informação","tipo":"numero"},{"alvo":{"role":"radio","nome":"Não consigo — passar pra humano"},"rotulo":"Passar para a equipe","tipo":"numero"}],"clicar":{"role":"radio","nome":"Concluí"}},{"id":"p2","titulo":"Escolha e escreva","texto":"Clique na opção e escreva no campo abaixo o que foi decidido. Com \"Concluí\" ou \"Preciso de info do cliente\", quem lê o que você escreve é a IA, e é com isso que ela responde o cliente. Então escreva a decisão de forma clara, com valores e horários. Com \"Não consigo — passar pra humano\", o texto vira um recado para a pessoa da equipe que vai assumir a conversa. Aqui, a recepção liberou 5% de desconto no Pix.","antes":[{"acao":"click","alvo":{"role":"radio","nome":"Concluí"}},{"acao":"fill","alvo":{"placeholder":"Escreva sua resposta para a IA..."},"valor":"Pode dar 5% de desconto no Pix: a consulta fica R$ 266,00."}],"destaques":[{"alvo":{"role":"radio","nome":"Concluí"},"rotulo":"Opção escolhida","tipo":"caixa"},{"alvo":{"placeholder":"Escreva sua resposta para a IA..."},"rotulo":"Sua decisão para a IA","tipo":"caixa"}],"clicar":{"role":"button","nome":"Enviar","exato":true}},{"id":"p3","titulo":"Enviar a decisão","texto":"O botão \"Enviar\" só funciona com uma opção marcada e o campo preenchido. Ao enviar, aparece o aviso \"Resposta registrada para processamento.\". Com \"Concluí\", o caso vai para a aba \"Concluídos\" e a IA escreve para o cliente (para isso, a IA e o WhatsApp precisam estar ligados). Com \"Não consigo — passar pra humano\", ele também vai para \"Concluídos\" e a conversa passa para a equipe. Com \"Preciso de info do cliente\", ele continua em \"Abertos\", agora como \"Aguardando o cliente\".","dica":"Se outra pessoa da equipe já respondeu o mesmo caso, aparece o aviso \"Este caso já foi respondido ou fechado.\" e nada muda.","antes":[{"acao":"click","alvo":{"role":"radio","nome":"Concluí"}},{"acao":"fill","alvo":{"placeholder":"Escreva sua resposta para a IA..."},"valor":"Pode dar 5% de desconto no Pix: a consulta fica R$ 266,00."}],"destaques":[{"alvo":{"role":"button","nome":"Enviar","exato":true},"rotulo":"Manda a decisão para a IA","tipo":"seta"}]}]},{"id":"conversar-sobre-o-caso","titulo":"Tirando dúvidas com a IA antes de decidir","objetivo":"Conhecer a conversa interna com a IA sobre um caso e saber o que fazer quando ela ainda não está ligada.","papel":"admin","busca":["perguntar para a IA sobre o caso","conversar sobre o caso","conversa interna","nenhum provedor de IA configurado","IA não responde no caso","configurar provedor de IA"],"passos":[{"id":"p1","titulo":"Conversar sobre o caso","texto":"Abaixo do quadro de resposta fica \"Conversar sobre o caso\". Ali a equipe faz perguntas à IA que abriu o caso antes de decidir, como \"Por que a IA não resolveu sozinha?\" ou \"O que o cliente já tentou?\". É uma conversa interna: o cliente não vê nada, e a IA ali não manda mensagem nem muda o caso. As perguntas dos colegas também aparecem nesse quadro, em alguns segundos. Enquanto a IA não estiver ligada, esse quadro mostra um aviso no lugar do campo de pergunta, e o próximo passo explica o porquê.","rota":"/app/ai/cases","antes":[{"acao":"click","alvo":{"role":"button","nome":"Desconto no Pix"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Pedro Henrique Lima","exato":true}},{"acao":"rolar","alvo":{"testid":"case-chat"}}],"destaques":[{"alvo":{"testid":"case-chat"},"rotulo":"Conversa interna com a IA","tipo":"caixa"}]},{"id":"p2","titulo":"Quando a IA ainda não está ligada","texto":"Enquanto nenhuma chave de IA estiver cadastrada, no lugar do campo de pergunta aparece o aviso \"Nenhum provedor de IA está configurado\" e o link \"Abrir IA › Provedores\", que leva para a tela onde quem administra liga a IA.","dica":"Com a IA ligada, aparecem o campo \"Sua pergunta para a IA\" e o botão \"Perguntar\", e, enquanto ninguém perguntou nada, algumas sugestões de pergunta. Clicar numa sugestão só preenche o campo. Ctrl + Enter (Cmd + Enter no Mac) também envia. Cada pergunta é cobrada na conta da sua chave de IA.","antes":[{"acao":"rolar","alvo":{"testid":"case-chat"}}],"destaques":[{"alvo":{"texto":"Nenhum provedor de IA está configurado","exato":false},"rotulo":"A IA ainda não está ligada","tipo":"caixa"},{"alvo":{"role":"link","nome":"Abrir IA › Provedores","exato":true},"rotulo":"Onde ligar a IA","tipo":"seta"}],"clicar":{"role":"link","nome":"Abrir IA › Provedores","exato":true}},{"id":"p3","titulo":"A tela de provedores","texto":"O link abre a tela \"Provedores de IA\", onde quem administra escolhe qual IA atende cada parte do sistema. Enquanto falta a chave, ela avisa que você ainda não cadastrou a chave da IA principal, e o link \"Cadastrar uma chave\" leva para onde se cadastra. Só gerentes e administradores entram nela. Depois que a IA estiver ligada, volte em \"Casos\" e o campo de pergunta aparece no lugar do aviso.","dica":"O resto da tela (\"Modelo padrão\" e os quadros abaixo dele) pode ficar como está por enquanto: o primeiro passo é só cadastrar a chave.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Abrir IA › Provedores","exato":true}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Provedores de IA","exato":true}}],"destaques":[{"alvo":{"role":"heading","nome":"Provedores de IA","exato":true},"rotulo":"Tela de provedores","tipo":"caixa"},{"alvo":{"texto":"Você ainda não cadastrou a chave da sua IA principal"},"rotulo":"Falta cadastrar a chave","tipo":"caixa"},{"alvo":{"role":"link","nome":"Cadastrar uma chave","exato":true},"rotulo":"Comece por aqui","tipo":"seta"}]}]},{"id":"outras-situacoes","titulo":"Casos esperando o cliente ou abertos pelo sistema","objetivo":"Reconhecer um caso que espera o cliente e um caso que o sistema abriu sozinho.","papel":"admin","busca":["aguardando o cliente","caso parado","aberto automaticamente","sistema abriu caso","não consigo responder caso","botões desativados no caso"],"passos":[{"id":"p1","titulo":"Caso aguardando o cliente","texto":"Quando a equipe escolhe \"Preciso de info do cliente\", o caso fica com o selo \"Aguardando o cliente\". Nessa situação as opções ficam apagadas e não dá para responder: a vez é do cliente. Quando ele responder, a IA leva a resposta para o caso e ele volta a ficar \"Aguardando você\".","rota":"/app/ai/cases","antes":[{"acao":"click","alvo":{"role":"button","nome":"Sábado de manhã"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Camila Rocha","exato":true}}],"destaques":[{"alvo":{"texto":"Aguardando o cliente","exato":true,"dentro":{"testid":"case-detail"}},"rotulo":"A vez é do cliente","tipo":"caixa"},{"alvo":{"texto":"Aguardando o cliente responder — a IA avisa você quando tiver a informação.","exato":true},"rotulo":"Por que não dá para responder","tipo":"caixa"}]},{"id":"p2","titulo":"O que a equipe pediu","texto":"A linha do tempo mostra o pedido da equipe (\"Você pediu uma informação ao cliente\") com o texto que foi escrito, e logo depois \"A IA perguntou ao cliente\". Assim qualquer pessoa da equipe sabe em que pé está o caso sem precisar perguntar. Atenção: a tela escreve \"Você\" para qualquer pessoa da equipe que decidiu, mesmo que não tenha sido você.","antes":[{"acao":"rolar","alvo":{"role":"heading","nome":"Linha do tempo","exato":true}}],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] > div > div:last-child"},"rotulo":"O pedido e a pergunta ao cliente","tipo":"caixa"}],"clicar":{"role":"button","nome":"Convênio Unimed"}},{"id":"p3","titulo":"Caso aberto automaticamente","texto":"Alguns casos trazem o selo \"Aberto automaticamente\". Isso acontece quando a IA disse ao cliente que ia chamar alguém da equipe, mas não abriu o caso. O sistema percebe e abre o caso por ela, para o cliente não ficar esperando à toa. Você responde esse caso do mesmo jeito que os outros.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Convênio Unimed"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Juliana Castro","exato":true}}],"destaques":[{"alvo":{"texto":"Aberto automaticamente","exato":true},"rotulo":"O sistema abriu pela IA","tipo":"caixa"},{"alvo":{"role":"button","nome":"Convênio Unimed"},"rotulo":"Caso aberto","tipo":"caixa"}]}]},{"id":"historico","titulo":"Consultando casos encerrados","objetivo":"Ver como cada caso terminou e o que a equipe decidiu.","papel":"admin","busca":["casos concluídos","histórico de casos","caso cancelado","virou atendimento humano","como o caso foi resolvido","casos antigos"],"passos":[{"id":"p1","titulo":"Abrindo um caso encerrado","texto":"Na aba \"Concluídos\", clique num caso para ver como ele terminou. O selo no alto diz o desfecho, e o quadro \"O que você quer fazer?\" explica por que não aceita mais resposta. Neste caso, que foi concluído, aparece \"Este caso já foi concluído.\". As opções ficam apagadas, porque não há mais o que decidir.","rota":"/app/ai/cases","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Concluídos","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Trocar sessão"}},{"acao":"click","alvo":{"role":"button","nome":"Trocar sessão"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Lucas Martins","exato":true}},{"acao":"rolar","alvo":{"role":"radiogroup","nome":"O que você quer fazer?"}}],"destaques":[{"alvo":{"role":"button","nome":"Trocar sessão"},"rotulo":"Caso encerrado","tipo":"caixa"},{"alvo":{"texto":"Concluído","exato":true,"dentro":{"css":"[data-testid='case-detail'] header"}},"rotulo":"Como terminou","tipo":"caixa"},{"alvo":{"texto":"Este caso já foi concluído.","exato":true},"rotulo":"Não aceita mais resposta","tipo":"caixa"}]},{"id":"p2","titulo":"Como o caso foi resolvido","texto":"A linha do tempo conta a história do caso. Aqui a IA abriu o caso, a equipe resolveu (\"Você concluiu o caso\", com o que foi escrito para a IA) e o caso ficou \"Concluído\". O texto da equipe é o que a IA recebe para responder o Lucas. A tela escreve \"Você\" para qualquer pessoa da equipe que decidiu.","antes":[{"acao":"rolar","alvo":{"role":"heading","nome":"Linha do tempo","exato":true}}],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] > div > div:last-child"},"rotulo":"A decisão da equipe","tipo":"caixa"}],"clicar":{"role":"button","nome":"Curativo"}},{"id":"p3","titulo":"Um caso que virou atendimento humano","texto":"Este caso terminou com \"Não consigo — passar pra humano\". A linha do tempo mostra \"Você decidiu passar para atendimento humano\" (a tela diz \"Você\" para quem da equipe tomou a decisão) com o motivo, e depois \"Virou atendimento humano\". A partir daí a conversa com a Fernanda segue na Inbox, com uma pessoa da equipe.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Concluídos","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Trocar sessão"}},{"acao":"click","alvo":{"role":"button","nome":"Curativo"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Fernanda Oliveira","exato":true}},{"acao":"rolar","alvo":{"role":"heading","nome":"Linha do tempo","exato":true}}],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] > div > div:last-child"},"rotulo":"Passou para a equipe","tipo":"caixa"}],"clicar":{"role":"button","nome":"Recibo do plano"}},{"id":"p4","titulo":"Um caso cancelado pela IA","texto":"A própria IA também encerra um caso quando o pedido deixa de existir. Aqui o Roberto achou o recibo sozinho: a IA anotou o motivo (\"A IA registrou o que aconteceu\") e o caso ficou \"Cancelado\", sem ninguém da equipe precisar mexer.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Concluídos","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Trocar sessão"}},{"acao":"click","alvo":{"role":"button","nome":"Recibo do plano"}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Roberto Almeida","exato":true}},{"acao":"rolar","alvo":{"role":"heading","nome":"Linha do tempo","exato":true}}],"destaques":[{"alvo":{"css":"[data-testid='case-detail'] > div > div:last-child"},"rotulo":"A IA encerrou sozinha","tipo":"caixa"}]}]}]},{"id":"conexoes","titulo":"Conexões","tela":"/app/connections","resumo":"Onde você liga e acompanha os números de WhatsApp e os outros canais da empresa: se cada um está funcionando, para quem a IA responde, pausas e proteção contra bloqueio.","licoes":[{"id":"conhecendo-a-tela","titulo":"Conhecendo a tela de Conexões","objetivo":"Saber onde ficam os seus números de WhatsApp e ler, em cada um, se ele está funcionando.","papel":"admin","busca":["conexões","meu whatsapp","números conectados","ver se o whatsapp está conectado","canais","whatsapp caiu","status do número"],"passos":[{"id":"p1","titulo":"Onde ficam os seus canais","texto":"Conexões é a tela dos canais por onde a clínica fala com os clientes. Só quem é administrador abre esta tela. No alto ficam as abas, uma por tipo de canal. A tela abre em \"Números por QR\", que são os números de WhatsApp conectados lendo um QR Code com o celular. As outras abas (\"API Oficial (Meta)\", \"Provedor parceiro\", \"Telefone\", \"Redes sociais\" e \"Chamada de voz\") aparecem na última lição. A faixa vermelha no alto aparece quando algum número cai. Ela é explicada no passo 5.","rota":"/app/connections","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"role":"tab","nome":"Números por QR"},"rotulo":"Aberta agora","tipo":"seta"},{"alvo":{"role":"tablist"},"rotulo":"Um tipo de canal por aba","tipo":"caixa"}]},{"id":"p2","titulo":"A barra de cima","texto":"A frase da esquerda diz quantos números estão na lista. Ela conta todos, inclusive os que estão desconectados. À direita ficam os botões que valem para todos os números de uma vez. \"Atualizar saúde\" confere de novo se cada número está funcionando. \"Pausar todas\" e \"Agendar pausa\" você aprende na lição sobre pausas. \"Conectar novo WhatsApp\" abre a janela para ligar mais um número. O quadro \"Para integrar\" só interessa a quem liga outro sistema ao mesmo número. Se não for o seu caso, pode ignorar.","dica":"Ao abrir a tela, o sistema já confere cada número uma vez, sem você clicar em nada.","antes":[],"destaques":[{"alvo":{"texto":"números conectados","regex":false},"rotulo":"Quantos números há na lista","tipo":"caixa"},{"alvo":{"role":"button","nome":"Atualizar saúde","exato":true},"rotulo":"Conferir todos agora","tipo":"caixa"},{"alvo":{"role":"button","nome":"Conectar novo WhatsApp","exato":true},"rotulo":"Ligar mais um número","tipo":"caixa"}]},{"id":"p3","titulo":"Conectar um número novo","texto":"Ao clicar em \"Conectar novo WhatsApp\", abre uma janela com duas formas de ligar o número. Em \"QR Code\", você abre o WhatsApp do celular, vai em Aparelhos conectados → Conectar um aparelho e lê o código da tela. Em \"Conectar por código\", você digita o telefone com código do país e DDD, clica em \"Gerar código\" e digita no celular o código que aparece. Quando o celular confirma, aparece o aviso \"WhatsApp conectado!\" e o selo do cartão do número fica verde, em \"Conectado\". Todo número novo começa em modo de teste: a IA não responde ninguém até você autorizar.","dica":"O QR Code muda sozinho a cada 15 segundos. Se ele vencer antes de você ler, é só esperar o próximo. Se fechar a janela sem conectar, o número fica na lista como \"Escaneie o QR\": use \"Reconectar\" para tentar de novo ou a lixeira para tirá-lo.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Conectar novo WhatsApp","exato":true},"rotulo":"Abre a janela do QR Code","tipo":"caixa"},{"alvo":{"texto":"Novos canais começam em modo de teste","regex":false},"rotulo":"Número novo começa em teste","tipo":"caixa"}]},{"id":"p4","titulo":"O cartão de um número","texto":"Cada número tem um cartão. No alto aparecem o nome que a equipe deu ao número e o telefone. O selo verde \"Conectado\" diz que ele está recebendo e enviando mensagens. Logo abaixo, depois de \"Verificado\", fica a data e a hora da última vez que o sistema conferiu o número. \"Ainda não verificado\" quer dizer que o sistema ainda não conseguiu conferir este número nenhuma vez. Mais embaixo, o cartão diz quem da equipe recebe as conversas deste número. Para escolher essas pessoas, use o link \"Configurar responsáveis por número\". A chave \"Guardar o histórico anterior à vinculação\" vem desligada, e assim só entram as mensagens novas. Mexer nela reinicia o número por alguns segundos, e desligá-la num número já conectado pode apagar o que ele já guardou.","antes":[],"destaques":[{"alvo":{"texto":"Conectado","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Recepção Bem Viver'])"}},"rotulo":"Situação do número","tipo":"caixa"},{"alvo":{"texto":"Ainda não verificado","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Recepção Bem Viver'])"}},"rotulo":"Última conferência","tipo":"caixa"},{"alvo":{"texto":"Usa todos os atendentes elegíveis da organização.","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Recepção Bem Viver'])"}},"rotulo":"Quem recebe as conversas","tipo":"caixa"},{"alvo":{"role":"link","nome":"Configurar responsáveis por número"},"rotulo":"Escolher responsáveis","tipo":"seta"}]},{"id":"p5","titulo":"Quando um número cai","texto":"Quando um número cai, o selo do cartão muda. Em vermelho, \"Caiu\" e \"Parado\" querem dizer que o número não está funcionando. Em amarelo, \"Escaneie o QR\" pede que você leia o código de novo, e \"Conectando…\" aparece enquanto ele volta. Uma faixa vermelha também aparece no alto de todas as telas do sistema, avisando que nenhuma mensagem entra nem sai por ele. O botão \"Reconectar\", que existe em todo cartão, tenta religar o número sem você pegar o celular. Se não der, a janela que abre mostra um QR para ler ou, se o número foi desvinculado do celular, o botão \"Gerar novo QR\".","dica":"Depois que o número volta a funcionar, a faixa vermelha some na próxima vez que a página carregar.","antes":[{"acao":"rolar","alvo":{"role":"button","nome":"Grupos","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}}}],"destaques":[{"alvo":{"css":"div[role=alert]:has-text('está desconectado')"},"rotulo":"Aviso em todas as telas","tipo":"seta"},{"alvo":{"texto":"Caiu","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}},"rotulo":"Número caído","tipo":"caixa"},{"alvo":{"role":"button","nome":"Reconectar","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}},"rotulo":"Tentar religar","tipo":"caixa"}]}]},{"id":"acesso-da-ia","titulo":"Liberar a IA aos poucos","objetivo":"Testar o atendimento automático com números de confiança antes de liberar a IA para todos os clientes.","papel":"admin","busca":["ia não responde","liberar ia para clientes","modo de teste","testar robô com meu número","ia aberta ao público","números autorizados"],"passos":[{"id":"p1","titulo":"Os dois jeitos da IA","texto":"Cada número diz, no próprio cartão, para quem a IA responde. Na Recepção aparece \"IA aberta ao público\": a IA pode atender qualquer pessoa que escrever. Na Fisioterapia aparece \"IA em modo de teste\": ela só responde aos números de teste que você autorizar. Como a lista ainda está vazia, o cartão avisa que a IA não responde ninguém neste número.","rota":"/app/connections","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"texto":"IA aberta ao público","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Recepção Bem Viver'])"}},"rotulo":"Responde a todos","tipo":"caixa"},{"alvo":{"texto":"IA em modo de teste","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}},"rotulo":"Responde só aos de teste","tipo":"caixa"},{"alvo":{"texto":"Nenhum número autorizado","regex":false,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}},"rotulo":"Lista vazia","tipo":"caixa"}]},{"id":"p2","titulo":"Abrir o acesso da IA","texto":"Clique em \"Configurar acesso da IA\", no cartão da Fisioterapia. Abre um painel do lado direito. Na caixa \"Números autorizados para teste\" você escreve os telefones que vão poder conversar com a IA, um por linha, com o código do país (+55) e o DDD. Use números da sua equipe ou de pessoas de confiança. O número cinza que aparece na caixa vazia é só um exemplo.","dica":"Para a IA responder, o agente também precisa estar publicado e ligado a este número. As mensagens continuam chegando à Inbox, e os testes são mensagens de verdade no WhatsApp.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Configurar acesso da IA","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}}},{"acao":"aguardar","alvo":{"rotulo":"Números autorizados para teste"}}],"destaques":[{"alvo":{"rotulo":"Números autorizados para teste"},"rotulo":"Um telefone por linha","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar lista de teste","exato":true},"rotulo":"Guardar a lista","tipo":"seta"}]},{"id":"p3","titulo":"Autorizar um número de teste","texto":"Escreva o telefone e clique em \"Salvar lista de teste\". O painel fecha e o cartão passa a mostrar quantos números estão autorizados. A partir daí, só esses números recebem respostas automáticas neste número da clínica, desde que um agente de IA esteja publicado e ligado a este número. Para os outros clientes, a conversa chega à Inbox e a equipe responde.","antes":[{"acao":"fill","alvo":{"rotulo":"Números autorizados para teste"},"valor":"+5511912345678"},{"acao":"click","alvo":{"role":"button","nome":"Salvar lista de teste","exato":true}},{"acao":"aguardar","alvo":{"texto":"1 número de teste autorizado","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}}}],"destaques":[{"alvo":{"texto":"1 número de teste autorizado","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}},"rotulo":"Lista salva","tipo":"caixa"}]},{"id":"p4","titulo":"Liberar para todos os clientes","texto":"Quando os testes derem certo, abra o painel de novo e clique em \"Liberar atendimento ao público\". O sistema pede confirmação: a lista de teste deixa de limitar as respostas e a IA, com o agente ligado a este número, pode atender qualquer pessoa que escrever. \"Confirmar liberação\" libera. \"Continuar em teste\" fecha a pergunta sem mudar nada.","dica":"Contatos bloqueados e conversas que estão com uma pessoa da equipe continuam sem resposta automática, mesmo com a IA liberada.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Configurar acesso da IA","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}}},{"acao":"aguardar","alvo":{"role":"button","nome":"Liberar atendimento ao público","exato":true}},{"acao":"click","alvo":{"role":"button","nome":"Liberar atendimento ao público","exato":true}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Pede confirmação","tipo":"caixa"},{"alvo":{"role":"button","nome":"Confirmar liberação","exato":true},"rotulo":"Libera a IA","tipo":"seta"}]}]},{"id":"renomear-pausar-excluir","titulo":"Renomear, pausar e excluir um número","objetivo":"Dar um nome fácil a cada número, pausar um número por um tempo e saber o que acontece ao excluí-lo.","papel":"admin","busca":["renomear número whatsapp","mudar nome da conexão","pausar número","desligar whatsapp por um tempo","excluir número","grupos do whatsapp"],"passos":[{"id":"p1","titulo":"Dar um nome ao número","texto":"Clique em \"Renomear\" no cartão do número. Abre a janela \"Nome interno da conexão\". Esse nome é o que a equipe vê no sistema, por exemplo na Inbox, para saber por qual número o cliente chegou. O cliente não vê este nome, e o nome do perfil no WhatsApp não muda.","rota":"/app/connections","antes":[{"acao":"esperar","ms":1500},{"acao":"click","alvo":{"role":"button","nome":"Renomear","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia Bem Viver'])"}}},{"acao":"aguardar","alvo":{"rotulo":"Nome interno","exato":true}}],"destaques":[{"alvo":{"rotulo":"Nome interno","exato":true},"rotulo":"Nome que a equipe vê","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Guardar","tipo":"caixa"}]},{"id":"p2","titulo":"Nome salvo","texto":"Escreva o novo nome e clique em \"Salvar\". O cartão já aparece com o nome novo. Use nomes que digam para que serve cada número, como a unidade ou o setor.","antes":[{"acao":"fill","alvo":{"rotulo":"Nome interno","exato":true},"valor":"Fisioterapia — Unidade Centro"},{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"texto":"Fisioterapia — Unidade Centro","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}}}],"destaques":[{"alvo":{"texto":"Fisioterapia — Unidade Centro","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}},"rotulo":"Nome novo","tipo":"caixa"}]},{"id":"p3","titulo":"Pausar um número","texto":"O botão \"Pausar\" desliga o número sem desconectá-lo. Enquanto ele está pausado, as mensagens que chegam ficam guardadas, mas não aparecem na Inbox, a IA não responde e nada é enviado por ele. O cartão ganha o selo \"Pausado\", e o botão vira \"Retomar\". Pausar não religa o número: este continua com o selo \"Caiu\". Ao retomar, as mensagens guardadas aparecem na Inbox, sem perder nenhuma.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Pausar Fisioterapia — Unidade Centro","exato":true}},{"acao":"aguardar","alvo":{"texto":"Pausado","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}}}],"destaques":[{"alvo":{"css":"div.justify-between:has(> div.min-w-0)","dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}},"rotulo":"\"Caiu\" e \"Pausado\"","tipo":"caixa"},{"alvo":{"role":"button","nome":"Retomar Fisioterapia — Unidade Centro","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}},"rotulo":"Tirar da pausa","tipo":"caixa"}]},{"id":"p4","titulo":"Pausar ou retomar todos de uma vez","texto":"Na barra de cima, \"Pausar todas\" pausa todos os números que ainda não estão pausados, inclusive os que caíram, e \"Retomar todas\" tira da pausa todos os pausados. O número entre parênteses diz quantos números o clique vai mudar. Cada botão só aparece quando tem algum número para mudar.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Pausar todas \\(\\d+\\)","exato":false,"regex":true},"rotulo":"Pausa os que não estão pausados","tipo":"caixa"},{"alvo":{"role":"button","nome":"Retomar todas \\(\\d+\\)","exato":false,"regex":true},"rotulo":"Tira todos da pausa","tipo":"caixa"}]},{"id":"p5","titulo":"Grupos do número","texto":"O botão \"Grupos\" abre a lista dos grupos de WhatsApp de que o número participa. Cada grupo tem uma chave: grupo ligado aparece na Inbox para a equipe responder. A IA nunca responde em grupo. Como este número caiu, a lista não carrega e aparece o aviso para conferir a conexão.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Grupos","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Fisioterapia — Unidade Centro'])"}}},{"acao":"aguardar","alvo":{"texto":"O WhatsApp deste número não respondeu","regex":false}}],"destaques":[{"alvo":{"role":"heading","nome":"Grupos","exato":true},"rotulo":"Grupos do número","tipo":"caixa"},{"alvo":{"texto":"O WhatsApp deste número não respondeu","regex":false},"rotulo":"Aparece quando o número caiu","tipo":"caixa"},{"alvo":{"role":"button","nome":"Atualizar lista","exato":true},"rotulo":"Tentar de novo","tipo":"seta"}]},{"id":"p6","titulo":"Excluir um número","texto":"A lixeira, no fim do cartão, exclui o número. Antes, uma janela pede confirmação. Ao confirmar, o número é desconectado do WhatsApp e sai desta lista, e as conversas que ele já teve continuam na Inbox. Para usar o mesmo número de novo, é preciso conectá-lo outra vez. Se você só quer parar por um tempo, use \"Pausar\".","antes":[{"acao":"press","tecla":"Escape"},{"acao":"esperar","ms":500},{"acao":"click","alvo":{"role":"button","nome":"Retomar Fisioterapia — Unidade Centro","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Pausar Fisioterapia — Unidade Centro","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Excluir Fisioterapia — Unidade Centro","exato":true},"rotulo":"Excluir o número","tipo":"caixa"}]}]},{"id":"protecao-de-envio","titulo":"Proteger o número contra bloqueio","objetivo":"Entender e ajustar os limites que evitam que o WhatsApp bloqueie o número por excesso de mensagens.","papel":"admin","busca":["evitar bloqueio do whatsapp","número bloqueado","limite de mensagens por dia","horário de envio","aquecimento do número","enviar no domingo"],"passos":[{"id":"p1","titulo":"Abrir a proteção de envio","texto":"Clique em \"Proteção de envio\" no cartão do número. Abre um painel com os limites que protegem o número contra bloqueio do WhatsApp. Campo vazio usa o padrão seguro do sistema, que aparece escrito em cinza dentro do campo. No começo vem a idade do número: preencha \"Este número é usado desde\" com o dia em que o número começou a ser usado. Número novo começa enviando pouco por dia e vai subindo aos poucos, e é isso que o texto logo abaixo explica.","dica":"Só ligue \"pular o aquecimento\" se o número já envia mensagens há semanas. Num número novo, é o caminho mais rápido para o bloqueio.","rota":"/app/connections","antes":[{"acao":"esperar","ms":1500},{"acao":"click","alvo":{"role":"button","nome":"Proteção de envio","exato":true,"dentro":{"css":"div:has(> div.mt-auto button[aria-label='Excluir Recepção Bem Viver'])"}}},{"acao":"aguardar","alvo":{"rotulo":"Este número é usado desde"}}],"destaques":[{"alvo":{"rotulo":"Este número é usado desde"},"rotulo":"Idade do número","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Este número já está aquecido — pular o aquecimento"},"rotulo":"Pular o aquecimento","tipo":"caixa"}]},{"id":"p2","titulo":"Os horários","texto":"\"Janela de resposta\" é o horário em que a IA responde a quem escreveu. \"Janela de disparo\" é o horário dos envios em massa e das mensagens que retomam uma conversa parada. Fora da janela, o envio fica guardado para o próximo horário permitido. Os horários seguem o fuso escolhido mais abaixo no painel.","dica":"Para a IA responder a qualquer hora, use 0 e 24 na janela de resposta.","antes":[],"destaques":[{"alvo":{"role":"spinbutton","nome":"Hora de início da janela de resposta"},"rotulo":"Janela de resposta: de … até","tipo":"caixa"},{"alvo":{"role":"spinbutton","nome":"Hora de início da janela","exato":true},"rotulo":"Janela de disparo: de … até","tipo":"caixa"}]},{"id":"p3","titulo":"Dias e domingo","texto":"Em \"Dias da prospecção\" você marca os dias em que sai a primeira mensagem da prospecção, quando é a clínica que procura o cliente. A chave \"Enviar aos domingos\" vem ligada: quem escreve no domingo recebe resposta no domingo. Desligada, o número não responde nem faz envios em massa no domingo.","antes":[{"acao":"rolar","alvo":{"role":"switch","nome":"Enviar aos domingos"}}],"destaques":[{"alvo":{"role":"checkbox","nome":"Prospecção no dia Dom"},"rotulo":"Domingo marcado: prospecção sai no domingo","tipo":"seta"},{"alvo":{"role":"switch","nome":"Enviar aos domingos"},"rotulo":"Ligada: funciona no domingo","tipo":"caixa"}]},{"id":"p4","titulo":"Ritmo e teto do dia","texto":"\"Ritmo entre envios\" é o tempo mínimo entre uma mensagem e outra do mesmo número, mais uma variação que muda a cada envio, porque um ritmo sempre igual parece robô. O \"Atraso humano\" é quanto a IA espera antes da primeira resposta, como alguém que viu a notificação e digitou. Ele é contado em milésimos de segundo: 3000 são 3 segundos. O \"Teto diário de envios\" é o máximo de mensagens que o número manda por dia. Ele vem em 300. Num número novo, vale o que for menor: o teto ou o limite do aquecimento.","antes":[{"acao":"rolar","alvo":{"role":"spinbutton","nome":"Teto diário de mensagens"}}],"destaques":[{"alvo":{"role":"spinbutton","nome":"Intervalo mínimo entre envios em segundos"},"rotulo":"Intervalo","tipo":"caixa"},{"alvo":{"role":"spinbutton","nome":"Tempo para ver a notificação em ms"},"rotulo":"Atraso humano","tipo":"caixa"},{"alvo":{"role":"spinbutton","nome":"Teto diário de mensagens"},"rotulo":"Máximo por dia","tipo":"caixa"}]},{"id":"p5","titulo":"Fuso, aquecimento e salvar","texto":"Em \"Fuso horário da janela\" você escolhe o fuso dos horários acima. O quadro \"Aquecimento automático de número novo\" mostra quantas mensagens por dia um número pode mandar conforme a idade dele. Para guardar o que mudou, clique em \"Salvar proteção\". \"Cancelar\" fecha sem salvar.","antes":[{"acao":"rolar","alvo":{"testid":"anti-ban-save"}}],"destaques":[{"alvo":{"role":"combobox","nome":"Fuso horário IANA"},"rotulo":"Fuso dos horários","tipo":"caixa"},{"alvo":{"css":"div:has(> p:text-is('Aquecimento automático de número novo'))"},"rotulo":"Limite pela idade","tipo":"caixa"},{"alvo":{"testid":"anti-ban-save"},"rotulo":"Guardar","tipo":"caixa"}]}]},{"id":"janela-de-manutencao","titulo":"Agendar uma pausa","objetivo":"Marcar um horário para os números pausarem e voltarem sozinhos, como numa troca de aparelho ou numa folga.","papel":"admin","busca":["agendar pausa","pausar whatsapp à noite","janela de manutenção","desligar número no feriado","pausa automática","retomar sozinho"],"passos":[{"id":"p1","titulo":"Abrir o agendamento","texto":"Clique em \"Agendar pausa\", na barra de cima. Abre a janela \"Janela de manutenção\". Nela você marca quando a pausa começa e quando termina. No horário marcado, o sistema pausa os números e depois os tira da pausa sozinho. As mensagens que chegarem durante a pausa ficam guardadas e aparecem na Inbox na volta.","dica":"Os horários seguem o fuso da organização, mostrado logo abaixo dos campos, e não o do seu computador.","rota":"/app/connections","antes":[{"acao":"esperar","ms":1500},{"acao":"click","alvo":{"role":"button","nome":"Agendar pausa","exato":true}},{"acao":"aguardar","alvo":{"rotulo":"A pausa começa (hora local)"}}],"destaques":[{"alvo":{"rotulo":"A pausa começa (hora local)"},"rotulo":"Início","tipo":"caixa"},{"alvo":{"rotulo":"A pausa termina (hora local)"},"rotulo":"Fim","tipo":"caixa"},{"alvo":{"texto":"Fuso da organização","regex":false},"rotulo":"Horário da clínica","tipo":"caixa"}]},{"id":"p2","titulo":"Escolher os números","texto":"Em \"Escopo\" você escolhe se a pausa vale para todas as conexões ou para um número só. Depois é só clicar em \"Agendar\".","antes":[{"acao":"click","alvo":{"role":"combobox","dentro":{"role":"dialog"}}},{"acao":"aguardar","alvo":{"role":"listbox"}}],"destaques":[{"alvo":{"role":"option","nome":"Para todas as conexões"},"rotulo":"Todos os números","tipo":"caixa"},{"alvo":{"role":"option","nome":"Fisioterapia Bem Viver"},"rotulo":"Só um número","tipo":"caixa"}]},{"id":"p3","titulo":"Pausas já agendadas","texto":"Abaixo dos campos aparece \"Janelas agendadas\", com o começo, o fim e o número de cada pausa marcada. Aqui há uma pausa da Fisioterapia, de noite. \"Cancelar janela\" desmarca a pausa. Se ela já tiver começado, o que foi pausado continua pausado até você retomar.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"esperar","ms":400}],"destaques":[{"alvo":{"css":"li:has(button:text-is('Cancelar janela'))"},"rotulo":"Pausa marcada","tipo":"caixa"},{"alvo":{"role":"button","nome":"Cancelar janela","exato":true},"rotulo":"Desmarcar","tipo":"seta"}]}]},{"id":"outros-canais","titulo":"Os outros tipos de canal","objetivo":"Conhecer as abas da API Oficial da Meta, do provedor parceiro, do telefone, das redes sociais e da chamada de voz, e o que cada uma pede para funcionar.","papel":"admin","busca":["api oficial do whatsapp","conectar meta business","templates da meta","instagram e facebook no atendimento","número de telefone para ligações","chamada de voz"],"passos":[{"id":"p1","titulo":"API Oficial (Meta)","texto":"A aba \"API Oficial (Meta)\" liga o número oficial do WhatsApp Business, sem QR Code. Para isso você precisa ter um app criado

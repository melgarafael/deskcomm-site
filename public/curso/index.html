luir\" apaga. \"Cancelar\", ou a tecla Esc, desmarca tudo.","dica":"\"Responsável…\" só aparece para gerentes e administradores.","antes":[],"destaques":[{"alvo":{"css":"[data-lote-selecionados]"},"rotulo":"Ações para os marcados","tipo":"caixa"}]}]},{"id":"ficha-do-negocio","titulo":"A ficha do negócio","objetivo":"Abrir um cartão e usar a ficha: conversa, contato, dados do negócio, tarefas e histórico.","papel":"admin","busca":["abrir cartão","detalhes do negócio","ficha do lead","histórico do negócio","editar valor","tarefas do cliente"],"passos":[{"id":"p1","titulo":"Clique no cartão","texto":"Clique no título do cartão para abrir a ficha do negócio, que desliza pela direita. Vamos abrir a avaliação do Roberto.","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"css":"a[data-testid^='abrir-']:has-text('Pacientes')"}},{"acao":"aguardar","alvo":{"role":"group","nome":"Lead: Avaliação de fisioterapia — Roberto Almeida","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Avaliação de fisioterapia — Roberto Almeida","exato":true},"rotulo":"Clique no título","tipo":"seta"}],"clicar":{"role":"button","nome":"Avaliação de fisioterapia — Roberto Almeida","exato":true}},{"id":"p2","titulo":"O topo da ficha","texto":"No topo ficam o título, o valor, a etapa e o responsável. Logo abaixo, \"Abrir conversa no Inbox\" leva direto para a conversa com esse cliente, com a última mensagem à mostra. \"Editar campos\" pula para os dados do negócio.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Avaliação de fisioterapia — Roberto Almeida","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"heading","nome":"Avaliação de fisioterapia — Roberto Almeida","exato":true,"dentro":{"role":"dialog"}},"rotulo":"O negócio","tipo":"caixa"},{"alvo":{"role":"link","nome":"Abrir conversa no Inbox","regex":true},"rotulo":"Ir para a conversa","tipo":"caixa"},{"alvo":{"role":"button","nome":"Editar campos","exato":true},"rotulo":"Ir para os dados","tipo":"seta"}]},{"id":"p3","titulo":"Os dados do contato","texto":"A parte \"Contato\" mostra telefone e e-mail de quem está negociando; a aba \"Links\" guarda Instagram, site e outros endereços. \"Abrir no WhatsApp\" abre o WhatsApp do seu computador ou celular, fora do sistema: para a conversa ficar guardada aqui, prefira \"Abrir conversa no Inbox\". \"Ver ficha completa do contato\" leva para a tela do contato. Em \"Pessoas relacionadas\", \"Adicionar participante\" liga outras pessoas ao negócio, como quem paga.","antes":[],"destaques":[{"alvo":{"css":"[role=dialog] section[data-secao='contato']"},"rotulo":"Quem é o cliente","tipo":"caixa"}]},{"id":"p4","titulo":"Editar os dados do negócio","texto":"Em \"Dados do negócio\" você corrige título, descrição, valor, data de fechamento prevista e etiquetas. Troque o valor e clique em \"Salvar\". A ficha continua aberta, para você ver a mudança entrar no histórico.","antes":[{"acao":"fill","alvo":{"rotulo":"Valor (R$)","exato":true},"valor":"220,00"},{"acao":"rolar","alvo":{"role":"button","nome":"Salvar","exato":true,"dentro":{"role":"dialog"}}}],"destaques":[{"alvo":{"rotulo":"Valor (R$)","exato":true},"rotulo":"Novo valor","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Salvar","tipo":"seta"}],"clicar":{"role":"button","nome":"Salvar","exato":true,"dentro":{"role":"dialog"}}},{"id":"p5","titulo":"Tarefas e histórico","texto":"Em \"Tarefas\", \"Nova tarefa\" anota o próximo passo combinado com o cliente, com prazo e responsável. A \"Linha do tempo\", no fim da ficha, registra tudo o que aconteceu com o negócio: aqui já aparece \"Dados do negócio alterados\", avisando que o valor mudou agora há pouco.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true,"dentro":{"role":"dialog"}}},{"acao":"esperar","ms":2500},{"acao":"rolar","alvo":{"css":"[role=dialog] section[data-secao='linha-do-tempo']"}}],"destaques":[{"alvo":{"role":"button","nome":"Nova tarefa","exato":true},"rotulo":"Anotar o próximo passo","tipo":"seta"},{"alvo":{"css":"[role=dialog] section[data-secao='linha-do-tempo']"},"rotulo":"O que aconteceu","tipo":"caixa"}]}]},{"id":"organizar-funis","titulo":"Criar, renomear e arquivar funis","objetivo":"Criar um funil novo, mudar o nome dele, arquivar e excluir um funil que não serve mais.","papel":"admin","busca":["criar funil","novo funil","renomear funil","arquivar funil","excluir funil","funis arquivados"],"passos":[{"id":"p1","titulo":"Dê um nome ao funil","texto":"Clique em \"Novo funil\" e escreva o nome, por exemplo \"Pilates\". Depois clique em \"Criar funil\". O funil novo já nasce com quatro etapas: \"Novo\", \"Em andamento\", \"Ganho\" e \"Perdido\". Você troca os nomes delas na tela \"Etapas do funil\".","rota":"/app/kanban","antes":[{"acao":"click","alvo":{"testid":"novo-funil"}},{"acao":"fill","alvo":{"testid":"nome-do-novo-funil"},"valor":"Pilates"}],"destaques":[{"alvo":{"testid":"nome-do-novo-funil"},"rotulo":"Nome do funil","tipo":"caixa"},{"alvo":{"testid":"confirmar-novo-funil"},"rotulo":"Criar","tipo":"seta"}],"clicar":{"testid":"confirmar-novo-funil"}},{"id":"p2","titulo":"O funil novo na lista","texto":"O funil aparece no fim da lista. As setinhas à esquerda mudam a ordem dos funis. \"Tornar padrão\" faz quem escreve pela primeira vez no WhatsApp da clínica entrar por este funil, no lugar do atual; só use quando quiser mesmo trocar.","antes":[{"acao":"click","alvo":{"testid":"confirmar-novo-funil"}},{"acao":"aguardar","alvo":{"css":"li[data-testid^='funil-']:has-text('Pilates')"}}],"destaques":[{"alvo":{"css":"li[data-testid^='funil-']:has-text('Pilates')"},"rotulo":"Funil criado","tipo":"caixa"},{"alvo":{"role":"button","nome":"Tornar padrão","exato":true},"rotulo":"Trocar o funil padrão","tipo":"seta"}]},{"id":"p3","titulo":"Renomear","texto":"Clique em \"Renomear\" na linha do funil, mude o nome e aperte Enter (ou clique em \"Salvar\"). O nome muda na lista e no quadro.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Renomear","exato":true,"dentro":{"css":"li[data-testid^='funil-']:has-text('Pilates')"}}},{"acao":"fill","alvo":{"role":"textbox","nome":"Novo nome de «Pilates»","exato":true},"valor":"Pilates em grupo"}],"destaques":[{"alvo":{"role":"textbox","nome":"Novo nome de «Pilates»","exato":true},"rotulo":"Nome novo","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Salvar","tipo":"seta"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p4","titulo":"Arquivar","texto":"\"Arquivar\" tira o funil da lista e ele para de receber negócios novos, mas nada é apagado. A pergunta aparece logo abaixo do funil. \"Excluir de vez\" só funciona em funil que não tem nenhum negócio, nem aberto nem encerrado; se tiver, o sistema recusa e explica por quê.","dica":"Não dá para arquivar o funil padrão, nem um funil que é o único da lista. Para arquivar o padrão, antes torne outro funil padrão.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"css":"li[data-testid^='funil-']:has-text('Pilates em grupo')"}},{"acao":"click","alvo":{"role":"button","nome":"Arquivar","exato":true,"dentro":{"css":"li[data-testid^='funil-']:has-text('Pilates em grupo')"}}},{"acao":"aguardar","alvo":{"css":"[data-testid^='arquivar-painel-']"}}],"destaques":[{"alvo":{"css":"[data-testid^='arquivar-painel-']"},"rotulo":"Confirmar o arquivamento","tipo":"caixa"}],"clicar":{"role":"button","nome":"Arquivar","exato":true,"dentro":{"css":"[data-testid^='arquivar-painel-']"}}},{"id":"p5","titulo":"A gaveta dos arquivados","texto":"O funil arquivado vai para \"Funis arquivados\", embaixo da lista. Clique para abrir a gaveta. \"Tirar do arquivo\" traz o funil de volta para a lista; \"Excluir de vez\" apaga e libera o nome.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Arquivar","exato":true,"dentro":{"css":"[data-testid^='arquivar-painel-']"}}},{"acao":"aguardar","alvo":{"testid":"arquivados-abrir"}},{"acao":"click","alvo":{"testid":"arquivados-abrir"}},{"acao":"aguardar","alvo":{"testid":"arquivados-explicacao"}}],"destaques":[{"alvo":{"testid":"arquivados"},"rotulo":"Funis arquivados","tipo":"caixa"},{"alvo":{"role":"button","nome":"Excluir de vez","exato":true,"dentro":{"testid":"arquivados"}},"rotulo":"Apagar de vez","tipo":"seta"}],"clicar":{"role":"button","nome":"Excluir de vez","exato":true,"dentro":{"testid":"arquivados"}}},{"id":"p6","titulo":"Excluir de vez","texto":"Antes de apagar, o sistema pergunta de novo, porque não tem volta: o funil e as etapas dele somem. Clique em \"Excluir de vez\" para confirmar, ou \"Cancelar\" para desistir.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Excluir de vez","exato":true,"dentro":{"testid":"arquivados"}}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Confirmar a exclusão","tipo":"caixa"}],"clicar":{"role":"button","nome":"Excluir de vez","exato":true,"dentro":{"role":"alertdialog"}}},{"id":"p7","titulo":"De volta ao começo","texto":"Pronto: o funil de teste sumiu e a lista voltou a ter só \"Pacientes\". Quando não sobra nenhum funil arquivado, a gaveta \"Funis arquivados\" também some.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Excluir de vez","exato":true,"dentro":{"role":"alertdialog"}}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"li[data-testid^='funil-']:has-text('Pacientes')"},"rotulo":"Só o funil em uso","tipo":"caixa"}]}]}]},{"id":"contatos","titulo":"Contatos","tela":"/app/contacts","resumo":"A lista de todos os clientes da empresa: achar, cadastrar, corrigir, juntar repetidos e trazer contatos de planilha ou do celular.","licoes":[{"id":"conhecendo-a-lista","titulo":"Conhecendo a lista de contatos","objetivo":"Reconhecer as partes da tela de Contatos e ler o que cada linha da lista conta sobre o cliente.","papel":"admin","busca":["contatos","lista de clientes","cadastro de clientes","pacientes","telefone do cliente","status do contato","bloqueado","última atividade"],"passos":[{"id":"p1","titulo":"As três partes da tela","texto":"Em Contatos ficam todas as pessoas que a sua empresa atende, mesmo as que ainda não mandaram mensagem. No alto ficam os botões para cadastrar, juntar repetidos, trazer e levar contatos. Logo abaixo fica a barra de busca e filtros. Embaixo fica a lista, com um cliente por linha.","dica":"Quem escreve para o número de WhatsApp conectado em \"Conexões\" entra aqui sozinho. Você só cadastra à mão quem ainda não falou com a empresa.","rota":"/app/contacts","antes":[],"destaques":[{"alvo":{"css":"header:has(h1) > div:last-child"},"rotulo":"Botões da tela","tipo":"caixa"},{"alvo":{"css":"div.rounded-lg.p-2:has(input[type='search'])"},"rotulo":"Busca e filtros","tipo":"caixa"},{"alvo":{"role":"table"},"rotulo":"Lista de contatos","tipo":"caixa"}]},{"id":"p2","titulo":"O que cada coluna mostra","texto":"Cada linha mostra o nome, o e-mail, o telefone e as etiquetas do cliente (aqui chamadas de \"Tags\"). \"Última atividade\" diz quando houve o último movimento com ele, como uma mensagem: hoje e ontem aparecem com a hora, os dias mais antigos com a data. A coluna \"Status\" usa selos: \"Ativo\" é o cliente normal e \"Bloqueado\" é quem pediu para não receber mais mensagens.","dica":"Outros selos que podem aparecer: \"Anonimizado\" (dados apagados a pedido do cliente, pela LGPD), \"Cliente\" (quando a empresa usa a regra de clientes pela agenda) e \"Pessoal\" (contato da vida pessoal, que só aparece com o filtro \"Pessoais\" ligado).","antes":[],"destaques":[{"alvo":{"css":"table thead"},"rotulo":"Colunas","tipo":"caixa"},{"alvo":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000005']) td:nth-child(5)"},"rotulo":"Etiquetas do cliente","tipo":"caixa"},{"alvo":{"texto":"Ativo","exato":true,"dentro":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000001'])"}},"rotulo":"Cliente normal","tipo":"caixa"},{"alvo":{"texto":"Bloqueado","exato":true},"rotulo":"Pediu para não receber mensagens","tipo":"caixa"}]},{"id":"p3","titulo":"Os atalhos no fim da linha","texto":"No fim de cada linha ficam até três atalhos. O balão abre a conversa desse cliente na Inbox. Quando o cliente tem telefone mas nunca conversou, o balão começa uma conversa nova na Inbox, para você escrever primeiro. Isso precisa de um número de WhatsApp conectado em \"Conexões\". Sem telefone e sem conversa, o balão não aparece. O lápis edita o cadastro sem sair da lista, e a lixeira exclui o contato. Clicar no nome abre a ficha completa do cliente.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Iniciar conversa com Gabriela Duarte no Inbox","exato":true},"rotulo":"Começar uma conversa","tipo":"caixa"},{"alvo":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000001']) td:last-child"},"rotulo":"Conversa, editar e excluir","tipo":"caixa"}]},{"id":"p4","titulo":"Quantos contatos há","texto":"No pé da lista aparece quantos contatos estão na tela. A lista mostra 25 de cada vez. Quando há mais, aparece \"carregados — há mais resultados\" e o botão \"Carregar mais\", que traz os próximos.","dica":"Você pode mostrar 25, 50 ou 100 de cada vez no botão \"25 por página\", na barra de filtros.","antes":[],"destaques":[{"alvo":{"texto":"^\\d+ contatos$","regex":true},"rotulo":"Total na tela","tipo":"caixa"}]}]},{"id":"achando-um-contato","titulo":"Achando um contato","objetivo":"Encontrar um cliente pela busca e pelos filtros de etiqueta, origem e pessoais, e colocar a lista na ordem que você quiser.","papel":"admin","busca":["buscar contato","procurar cliente","pesquisar telefone","filtro","etiqueta","tag","origem do contato","pessoais","ordenar por nome","limpar filtros"],"passos":[{"id":"p1","titulo":"Buscar pelo nome","texto":"Digite parte do nome, do e-mail ou do telefone na busca. Aqui digitamos \"Fern\" e a lista já mostra a Fernanda Oliveira. A lista filtra logo depois que você para de digitar.","dica":"Digite pelo menos 2 letras. Não precisa acertar o acento: \"Joao\" também acha \"João\".","rota":"/app/contacts","antes":[{"acao":"fill","alvo":{"placeholder":"Buscar por nome, email ou telefone…"},"valor":"Fern"},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"placeholder":"Buscar por nome, email ou telefone…"},"rotulo":"Nome, e-mail ou telefone","tipo":"seta"},{"alvo":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000005'])"},"rotulo":"Contato encontrado","tipo":"caixa"}],"clicar":{"role":"button","nome":"Limpar filtros","exato":true}},{"id":"p2","titulo":"Filtrar por etiqueta","texto":"Clique em \"Limpar filtros\" para apagar a busca. Depois clique no botão \"Tag: todas\" e marque uma etiqueta, como \"convenio\", para ver só os clientes marcados com ela. O menu fica aberto enquanto você marca.","dica":"As etiquetas do menu são as dos contatos que já estão na lista.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Limpar filtros","exato":true}},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"role":"button","nome":"Tag: todas","exato":true}},{"acao":"aguardar","alvo":{"role":"menuitemcheckbox","nome":"convenio","exato":true}}],"destaques":[{"alvo":{"role":"menuitemcheckbox","nome":"convenio","exato":true},"rotulo":"Marque a etiqueta","tipo":"seta"}],"clicar":{"role":"menuitemcheckbox","nome":"convenio","exato":true}},{"id":"p3","titulo":"Duas etiquetas: todas ou qualquer uma","texto":"Marcamos \"convenio\" e \"retorno\". Com duas ou mais etiquetas marcadas, aparecem duas opções: \"Todas (E)\" mostra só quem tem todas as etiquetas, e \"Qualquer uma (OU)\" mostra quem tem pelo menos uma.","dica":"Depois que você marca uma etiqueta, o menu passa a mostrar só as etiquetas dos contatos que sobraram na lista.","antes":[{"acao":"click","alvo":{"role":"menuitemcheckbox","nome":"convenio","exato":true}},{"acao":"click","alvo":{"role":"menuitemcheckbox","nome":"retorno","exato":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"group","dentro":{"role":"menu"}},"rotulo":"Todas ou qualquer uma","tipo":"caixa"}]},{"id":"p4","titulo":"O resultado do filtro","texto":"Fechamos o menu. O botão agora diz \"Tag: convenio +1\": a primeira etiqueta escolhida e quantas mais. Com \"Todas (E)\", só a Fernanda Oliveira tem as duas etiquetas.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"button","nome":"^Tag: convenio","regex":true},"rotulo":"Etiquetas escolhidas","tipo":"caixa"},{"alvo":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000005'])"},"rotulo":"Tem as duas etiquetas","tipo":"caixa"}],"clicar":{"role":"button","nome":"Limpar filtros","exato":true}},{"id":"p5","titulo":"Filtrar pela origem","texto":"O botão \"Todas as origens\" mostra de onde o contato veio: cadastro à mão (\"Manual\"), WhatsApp, site, planilha (\"Importado (CSV)\"), agenda do celular ou anúncio. Aqui escolhemos \"Importado (CSV)\" e a lista mostra só quem entrou por planilha.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Limpar filtros","exato":true}},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"role":"button","nome":"Todas as origens","exato":true}},{"acao":"click","alvo":{"role":"menuitem","nome":"Importado (CSV)","exato":true}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"button","nome":"Importado (CSV)","exato":true},"rotulo":"Origem escolhida","tipo":"caixa"},{"alvo":{"css":"table tbody"},"rotulo":"Só quem veio de planilha","tipo":"caixa"}],"clicar":{"testid":"filtro-pessoais"}},{"id":"p6","titulo":"Os contatos pessoais","texto":"Contatos marcados como pessoais, como um parente, ficam fora da lista normal. Ligue o botão \"Pessoais\" para ver só eles. Ligado, ele fica colorido.","dica":"Para tirar a marca de pessoal, abra a ficha do contato e clique em \"Desmarcar pessoal\". Só gerentes e administradores veem esse botão.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Limpar filtros","exato":true}},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"testid":"filtro-pessoais"}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"testid":"filtro-pessoais"},"rotulo":"Ligado: só pessoais","tipo":"caixa"},{"alvo":{"texto":"Pessoal","exato":true,"dentro":{"css":"tr:has(a[href='/app/contacts/be2c0000-0000-4000-8000-000000000004'])"}},"rotulo":"Contato pessoal","tipo":"caixa"}],"clicar":{"testid":"filtro-pessoais"}},{"id":"p7","titulo":"Quem está parado há mais tempo","texto":"A lista começa pelos contatos com movimento mais recente. Os títulos de coluna com setinhas mudam a ordem: clicando de novo no mesmo título, a ordem inverte. Aqui desligamos \"Pessoais\" e clicamos em \"Última atividade\": agora quem está há mais tempo sem movimento aparece primeiro, bom para lembrar de chamar de volta.","dica":"Contatos sem nenhuma atividade ficam sempre no fim, em qualquer ordem.","antes":[{"acao":"click","alvo":{"testid":"filtro-pessoais"}},{"acao":"esperar","ms":800},{"acao":"click","alvo":{"role":"button","nome":"Última atividade","exato":true,"dentro":{"css":"table thead"}}},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"role":"button","nome":"Última atividade","exato":true,"dentro":{"css":"table thead"}},"rotulo":"Ordem invertida","tipo":"caixa"},{"alvo":{"css":"table tbody tr:first-child"},"rotulo":"Mais tempo parado","tipo":"caixa"}]}]},{"id":"cadastrando-um-contato","titulo":"Cadastrando um contato","objetivo":"Cadastrar à mão um cliente que ainda não falou com a empresa.","papel":"admin","busca":["novo contato","cadastrar cliente","adicionar paciente","criar contato","incluir telefone","cadastro manual"],"passos":[{"id":"p1","titulo":"O botão Novo contato","texto":"Para cadastrar alguém que ainda não escreveu para a empresa, clique em \"Novo contato\", no canto de cima.","rota":"/app/contacts","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Novo contato","exato":true},"rotulo":"Cadastrar um cliente","tipo":"caixa"}],"clicar":{"role":"button","nome":"Novo contato","exato":true}},{"id":"p2","titulo":"Preencher o cadastro","texto":"Preencha o nome e pelo menos o e-mail ou o telefone. O telefone vai com DDD; não precisa digitar o +55. Em \"Tags\", separe as etiquetas por vírgula. O CPF é opcional.","dica":"Se o telefone, o e-mail ou o CPF já pertencer a outro contato, o cadastro é recusado com um aviso.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Novo contato","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"Nome","exato":true,"dentro":{"role":"dialog"}},"valor":"Carolina Mendes"},{"acao":"fill","alvo":{"rotulo":"Email","exato":true,"dentro":{"role":"dialog"}},"valor":"carolina.mendes@email.com"},{"acao":"fill","alvo":{"rotulo":"Telefone (DDD + número)","exato":true},"valor":"(11) 98765-0030"},{"acao":"fill","alvo":{"rotulo":"Tags (separadas por vírgula)","exato":true},"valor":"primeira-consulta, nutricao"}],"destaques":[{"alvo":{"role":"dialog"},"rotulo":"Novo contato","tipo":"caixa"},{"alvo":{"texto":"Preencha pelo menos um identificador (email ou telefone).","exato":true},"rotulo":"E-mail ou telefone é obrigatório","tipo":"seta"}],"clicar":{"role":"button","nome":"Criar contato","exato":true}},{"id":"p3","titulo":"O contato na lista","texto":"Clicamos em \"Criar contato\". A janela fecha e o contato entra na lista, com as etiquetas que você digitou. Ele fica registrado com a origem \"Manual\", e dá para achá-lo no filtro de origem. Aqui buscamos \"Carolina\" para encontrá-la.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar contato","exato":true}},{"acao":"aguardar","alvo":{"role":"link","nome":"Carolina Mendes","exato":true}},{"acao":"fill","alvo":{"placeholder":"Buscar por nome, email ou telefone…"},"valor":"Carolina"},{"acao":"esperar","ms":1000}],"destaques":[{"alvo":{"css":"tr:has(a:text-is('Carolina Mendes'))"},"rotulo":"Contato cadastrado","tipo":"caixa"}]}]},{"id":"editar-e-excluir","titulo":"Editando e excluindo pela lista","objetivo":"Corrigir o cadastro de um cliente e saber o que acontece ao excluir, sem sair da lista.","papel":"admin","busca":["editar contato","corrigir telefone","mudar nome do cliente","data de nascimento","adicionar etiqueta","excluir contato","apagar cliente"],"passos":[{"id":"p1","titulo":"O lápis da linha","texto":"O lápis no fim da linha abre o cadastro para editar, sem sair da lista. Vamos completar o cadastro da Gabriela Duarte.","rota":"/app/contacts","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Editar contato Gabriela Duarte","exato":true},"rotulo":"Editar este contato","tipo":"seta"}],"clicar":{"role":"button","nome":"Editar contato Gabriela Duarte","exato":true}},{"id":"p2","titulo":"Mudar os dados","texto":"Na janela \"Editar contato\" você muda nome, e-mail, telefone e data de nascimento. Para pôr uma etiqueta, digite no campo de baixo e aperte Enter. Se ela já existir, aparece como sugestão para clicar. Para tirar uma etiqueta, clique no X dela. Aqui pusemos a etiqueta \"nutricao\". No fim, clique em \"Salvar\".","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar contato Gabriela Duarte","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"role":"textbox","nome":"Adicionar etiqueta","exato":true},"valor":"nutricao"},{"acao":"press","tecla":"Enter","alvo":{"role":"textbox","nome":"Adicionar etiqueta","exato":true}}],"destaques":[{"alvo":{"css":"div.flex.flex-wrap.gap-1:has(button[aria-label='Remover etiqueta nutricao'])"},"rotulo":"Etiquetas (o X tira)","tipo":"caixa"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p3","titulo":"O cadastro atualizado","texto":"Clicamos em \"Salvar\". A janela fecha e a linha já mostra a etiqueta nova.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"tr:has(a[href='/app/contacts/be2c0000-0000-4000-8000-000000000001']) td:nth-child(5)"},"rotulo":"Etiquetas atualizadas","tipo":"caixa"}],"clicar":{"role":"button","nome":"Excluir contato Gabriela Duarte","exato":true}},{"id":"p4","titulo":"Excluir pede confirmação","texto":"A lixeira pergunta antes de apagar. Excluir apaga o contato, as conversas e as mensagens dele, e não tem como desfazer. Os negócios dele no funil continuam, mas ficam sem cliente. Se o cliente tem ou já teve compromisso na Agenda, mesmo cancelado, a janela avisa e a exclusão não acontece. Aqui clicamos em \"Cancelar\".","antes":[{"acao":"click","alvo":{"role":"button","nome":"Excluir contato Gabriela Duarte","exato":true}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Confirmação","tipo":"caixa"},{"alvo":{"role":"button","nome":"Excluir","exato":true,"dentro":{"role":"alertdialog"}},"rotulo":"Apaga de vez","tipo":"seta"}],"clicar":{"role":"button","nome":"Cancelar","exato":true}}]},{"id":"a-ficha-do-contato","titulo":"A ficha do contato","objetivo":"Abrir a ficha de um cliente, achar a conversa e os dados dele, escolher o vendedor dono e ver o histórico.","papel":"admin","busca":["ficha do cliente","detalhes do contato","histórico do cliente","timeline","carteira","vendedor dono","marcar como pessoal","sempre humano","LGPD","anonimizar"],"passos":[{"id":"p1","titulo":"Abrir a ficha","texto":"Clique no nome de um cliente na lista para abrir a ficha completa dele. Vamos abrir a da Fernanda Oliveira.","rota":"/app/contacts","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Fernanda Oliveira","exato":true},"rotulo":"Abre a ficha","tipo":"seta"}],"clicar":{"role":"link","nome":"Fernanda Oliveira","exato":true}},{"id":"p2","titulo":"O topo da ficha","texto":"No topo ficam o nome, o e-mail, o telefone e as etiquetas. \"Marcar como pessoal\" tira o contato do atendimento: as conversas fecham e param a IA, as mensagens automáticas de retomada, as campanhas e os envios. \"Marcar como sempre humano\" faz a IA parar de responder este cliente até alguém clicar em \"Remover marca de humano\". Os dois pedem confirmação antes. \"Editar\" abre a janela de edição, com os campos personalizados a mais.","dica":"Só gerentes e administradores veem os dois botões de marcar.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Fernanda Oliveira","exato":true}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Fernanda Oliveira","exato":true}}],"destaques":[{"alvo":{"role":"heading","nome":"Fernanda Oliveira","exato":true},"rotulo":"Nome do cliente","tipo":"caixa"},{"alvo":{"testid":"marcar-pessoal"},"rotulo":"Tirar do atendimento","tipo":"seta"},{"alvo":{"testid":"marcar-sempre-humano"},"rotulo":"IA para de responder","tipo":"seta"},{"alvo":{"role":"button","nome":"Editar","exato":true},"rotulo":"Editar o cadastro","tipo":"seta"}]},{"id":"p3","titulo":"A conversa e os dados","texto":"Se o cliente já conversou com a empresa, logo abaixo aparece a última mensagem. Clique ali para abrir a conversa na Inbox. A aba \"Visão geral\" mostra os dados do cadastro: nome, nome no WhatsApp, e-mail, telefone, data de nascimento, origem, última atividade, data do cadastro e etiquetas.","antes":[],"destaques":[{"alvo":{"role":"link","nome":"^Abrir conversa no Inbox","regex":true},"rotulo":"Abrir a conversa","tipo":"caixa"},{"alvo":{"css":"dl"},"rotulo":"Dados do cadastro","tipo":"caixa"}]},{"id":"p4","titulo":"O vendedor dono","texto":"O quadro \"Carteira\" diz qual pessoa da equipe é dona deste cliente. Com um dono, os negócios novos do cliente já nascem no nome dessa pessoa. Se o cliente escrever numa conversa que está com outra pessoa, o dono recebe uma tarefa avisando. Escolha o nome na lista e clique em \"Salvar carteira\". Sem dono, o atendimento segue como sempre.","dica":"Só gerentes e administradores escolhem o dono.","antes":[{"acao":"rolar","alvo":{"testid":"carteira-do-contato"}},{"acao":"selecionar","alvo":{"testid":"carteira-seletor"},"opcao":"Ana Ribeiro"}],"destaques":[{"alvo":{"testid":"carteira-do-contato"},"rotulo":"Carteira do cliente","tipo":"caixa"},{"alvo":{"testid":"carteira-salvar"},"rotulo":"Gravar o dono","tipo":"seta"}]},{"id":"p5","titulo":"O histórico do cliente","texto":"A aba \"Timeline\" conta o que aconteceu com este cliente, do mais novo para o mais antigo, separado por dia. Entram aqui os movimentos dos negócios dele, como a entrada no funil (\"Entrou no funil\") e a troca de etapa (\"Mudou de estágio\"), e as anotações da equipe. Ao lado de cada linha aparece quem fez.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Timeline","exato":true}},{"acao":"esperar","ms":1200}],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"Aba \"Timeline\" aberta","tipo":"caixa"},{"alvo":{"role":"tabpanel"},"rotulo":"O que aconteceu","tipo":"caixa"}]},{"id":"p6","titulo":"Apagar os dados a pedido do cliente","texto":"A aba \"LGPD\" serve para quando o cliente pede que a empresa apague os dados dele. \"Anonimizar contato\" troca o nome por \"Cliente Anonimizado\" seguido de um número e apaga e-mail, telefone e documento. Antes, a janela pede o motivo e que você digite ANONIMIZAR. Não tem como desfazer: use só com o pedido formal do cliente ou ordem judicial.","dica":"Só administradores veem a aba LGPD.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"LGPD","exato":true}},{"acao":"esperar","ms":800}],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"Aba \"LGPD\" aberta","tipo":"caixa"},{"alvo":{"role":"button","nome":"Anonimizar contato","exato":true},"rotulo":"Não tem volta","tipo":"seta"}]}]},{"id":"varios-de-uma-vez","titulo":"Mexendo em vários contatos de uma vez","objetivo":"Marcar vários contatos e pôr uma etiqueta em todos com um clique só.","papel":"admin","busca":["vários contatos","em massa","selecionar todos","etiqueta em lote","mudar responsável","marcar contatos","ação em lote"],"passos":[{"id":"p1","titulo":"Marcar os contatos","texto":"A caixinha no começo de cada linha marca o contato. Marcamos a Mariana Souza e a Gabriela Duarte. Assim que um contato é marcado, aparece uma barra acima da lista dizendo quantos estão marcados.","dica":"A caixinha do título da lista marca de uma vez todos os contatos que estão na tela. Para desmarcar todos, use o X no fim da barra.","rota":"/app/contacts","antes":[{"acao":"click","alvo":{"testid":"selecionar-contato-be200000-0000-4000-8000-000000000001"}},{"acao":"click","alvo":{"testid":"selecionar-contato-be2c0000-0000-4000-8000-000000000001"}}],"destaques":[{"alvo":{"testid":"barra-de-contatos-em-lote"},"rotulo":"Contatos marcados","tipo":"caixa"},{"alvo":{"testid":"selecionar-contato-be200000-0000-4000-8000-000000000001"},"rotulo":"Marcar","tipo":"seta"},{"alvo":{"testid":"selecionar-todos-contatos"},"rotulo":"Marcar todos da tela","tipo":"seta"}],"clicar":{"testid":"lote-mais-acoes"}},{"id":"p2","titulo":"O que dá para fazer","texto":"Clique em \"Mais ações\". Dá para adicionar ou remover uma etiqueta, mudar o vendedor dono de todos (\"Mudar responsável\") e preencher um campo personalizado. O X no fim da barra desmarca todos.","dica":"\"Mudar responsável\" só aparece para gerentes e administradores.","antes":[{"acao":"click","alvo":{"testid":"lote-mais-acoes"}},{"acao":"aguardar","alvo":{"testid":"lote-adicionar-etiqueta"}}],"destaques":[{"alvo":{"role":"menu"},"rotulo":"Ações para os marcados","tipo":"caixa"},{"alvo":{"testid":"lote-limpar"},"rotulo":"Desmarca todos","tipo":"caixa"}],"clicar":{"testid":"lote-adicionar-etiqueta"}},{"id":"p3","titulo":"Escolher a etiqueta","texto":"Em \"Adicionar etiqueta\", digite a etiqueta e clique em \"Adicionar\". Aqui digitamos \"nutricao\". Ela entra em todos os contatos marcados, e a etiqueta que eles já tinham continua.","antes":[{"acao":"click","alvo":{"testid":"lote-adicionar-etiqueta"}},{"acao":"aguardar","alvo":{"testid":"lote-tag-input"}},{"acao":"fill","alvo":{"testid":"lote-tag-input"},"valor":"nutricao"}],"destaques":[{"alvo":{"testid":"lote-tag-input"},"rotulo":"Digite a etiqueta","tipo":"caixa"}],"clicar":{"testid":"lote-tag-confirmar"}},{"id":"p4","titulo":"Pronto para todos","texto":"Clicamos em \"Adicionar\". A etiqueta \"nutricao\" já aparece nas duas linhas, e a marcação some sozinha.","antes":[{"acao":"click","alvo":{"testid":"lote-tag-confirmar"}},{"acao":"esperar","ms":2000}],"destaques":[{"alvo":{"texto":"nutricao","exato":true,"dentro":{"css":"tr:has(a[href='/app/contacts/be2c0000-0000-4000-8000-000000000001'])"}},"rotulo":"Gabriela: etiqueta nova","tipo":"caixa"},{"alvo":{"texto":"nutricao","exato":true,"dentro":{"css":"tr:has(a[href='/app/contacts/be200000-0000-4000-8000-000000000001'])"}},"rotulo":"Mariana: etiqueta nova","tipo":"caixa"}]}]},{"id":"trazer-e-levar","titulo":"Repetidos, planilhas e agenda do celular","objetivo":"Juntar contatos repetidos, trazer clientes de uma planilha ou da agenda do celular e baixar a lista.","papel":"admin","busca":["contato duplicado","juntar contatos","importar planilha","importar csv","excel","agenda do celular","sincronizar contatos","exportar contatos","baixar lista"],"passos":[{"id":"p1","titulo":"Contatos repetidos","texto":"O botão \"Duplicados\" procura a mesma pessoa cadastrada duas vezes, pelo mesmo telefone ou e-mail. Aqui a Juliana Castro foi cadastrada de novo por uma planilha, com o mesmo celular. Escolha qual cadastro fica: o outro é absorvido por ele. O sistema já deixa marcado o cadastro com movimento mais recente.","rota":"/app/contacts","antes":[{"acao":"click","alvo":{"role":"button","nome":"Duplicados","exato":true}},{"acao":"aguardar","alvo":{"texto":"Este fica","exato":true}}],"destaques":[{"alvo":{"texto":"^Agrupados por","regex":true},"rotulo":"Por que parecem a mesma pessoa","tipo":"caixa"},{"alvo":{"texto":"Este fica","exato":true},"rotulo":"Cadastro que fica","tipo":"seta"}],"clicar":{"role":"button","nome":"Juntar","exato":true}},{"id":"p2","titulo":"Juntar não tem volta","texto":"\"Juntar\" pede confirmação e diz quem fica e quem é absorvido. Conversas, mensagens, negócios e histórico passam para o cadastro que fica, e o outro sai da lista. Não tem como desfazer. Aqui clicamos em \"Cancelar\".","dica":"Só gerentes e administradores conseguem juntar contatos.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Juntar","exato":true}},{"acao":"aguardar","alvo":{"role":"alertdialog"}}],"destaques":[{"alvo":{"role":"alertdialog"},"rotulo":"Confira quem fica","tipo":"caixa"}],"clicar":{"role":"button","nome":"Cancelar","exato":true}},{"id":"p3","titulo":"Trazer de uma planilha","texto":"\"Importar CSV\" traz contatos de uma planilha. O arquivo precisa ter uma linha de títulos com colunas como nome, telefone, email, cpf, nascimento e tags. No Excel, use \"Salvar como\" e escolha \"CSV UTF-8\". Cabem até 500 linhas por arquivo. No fim, a janela mostra quantos entraram, quantos já existiam e quais linhas deram problema.","rota":"/app/contacts","antes":[{"acao":"click","alvo":{"role":"button","nome":"Importar CSV","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"texto":"^Envie um arquivo","regex":true,"dentro":{"role":"dialog"}},"rotulo":"Colunas aceitas e limite","tipo":"caixa"},{"alvo":{"rotulo":"Arquivo CSV","exato":true},"rotulo":"Escolha o arquivo","tipo":"seta"}]},{"id":"p4","titulo":"Trazer da agenda do celular","texto":"\"Sincronizar agenda\" traz os contatos salvos na agenda do celular conectado ao número da empresa, só os que têm WhatsApp. Quem já está cadastrado não é repetido. No fim, a janela mostra quantos entraram e quantos foram deixados de fora. Atenção ao aviso com o triângulo: vêm também os contatos pessoais do celular, e só pode receber campanha quem autorizou.","dica":"Sem um número de WhatsApp conectado em \"Conexões\", a janela avisa e o botão \"Sincronizar\" fica desligado. Se o celular tiver muitos contatos, clique em \"Continuar de onde parou\" para seguir do próximo.","antes":[{"acao":"press","tecla":"Escape"},{"acao":"click","alvo":{"role":"button","nome":"Sincronizar agenda","exato":true}},{"acao":"aguardar","alvo":{"role":"note"}}],"destaques":[{"alvo":{"texto":"^Número","regex":true,"dentro":{"role":"dialog"}},"rotulo":"Número conectado","tipo":"caixa"},{"alvo":{"role":"note"},"rotulo":"Leia antes","tipo":"caixa"}]},{"id":"p5","titulo":"Baixar a lista","texto":"\"Exportar\" baixa os contatos num arquivo. \"Exportar CSV\" é uma planilha, que pode ser aberta no Excel ou no Google Planilhas. \"Exportar vCard\" é o formato que o celular importa. Sai a lista inteira com os filtros que estiverem ligados na tela, não só a página que você está vendo, até 10.000 contatos.","dica":"Só gerentes e administradores veem o botão \"Exportar\".","antes":[{"acao":"press","tecla":"Escape"},{"acao":"click","alvo":{"role":"button","nome":"Exportar","exato":true}},{"acao":"aguardar","alvo":{"role":"menuitem","nome":"Exportar CSV","exato":true}}],"destaques":[{"alvo":{"role":"menu"},"rotulo":"Dois formatos","tipo":"caixa"}]}]}]},{"id":"tarefas","titulo":"Tarefas","tela":"/app/tasks","resumo":"A lista do que a equipe combinou de fazer, com prazo e responsável: anotar, concluir, filtrar e ver tudo num calendário.","licoes":[{"id":"tarefas-conhecendo-a-tela","titulo":"Conhecendo a tela de Tarefas","objetivo":"Entender como as tarefas da equipe ficam organizadas por prazo e o que cada linha mostra.","papel":"admin","busca":["tarefas","lista de tarefas","o que fazer","pendências da equipe","tarefas atrasadas","prazo das tarefas","lembretes"],"passos":[{"id":"p1","titulo":"As tarefas, separadas por prazo","texto":"Tarefas é a lista do que a equipe combinou de fazer, como \"ligar de volta na terça\". A tela separa as tarefas em grupos pelo prazo. \"Atrasadas\" vem primeiro, em vermelho, porque pede ação agora: são as tarefas com prazo num dia que já passou. Depois vêm \"Hoje\", \"Esta semana\" (os próximos 7 dias), \"Mais tarde\" e, no fim, \"Sem prazo\". Uma tarefa de hoje cujo horário já passou continua em \"Hoje\", com a hora em vermelho. Um grupo sem nenhuma tarefa nem aparece.","dica":"A tela abre mostrando só as tarefas em aberto. As já feitas ficam escondidas; você aprende a vê-las na lição sobre filtros.","rota":"/app/tasks","antes":[],"destaques":[{"alvo":{"role":"heading","nome":"Atrasadas","exato":true},"rotulo":"Prazo num dia que passou","tipo":"caixa"},{"alvo":{"role":"heading","nome":"Hoje","exato":true},"rotulo":"Vence hoje","tipo":"numero"},{"alvo":{"role":"heading","nome":"Esta semana","exato":true},"rotulo":"Próximos 7 dias","tipo":"numero"}]},{"id":"p2","titulo":"O que cada linha mostra","texto":"Cada linha é uma tarefa. Embaixo do título aparecem os detalhes, quando alguém escreveu. Depois vêm a prioridade (Baixa, Média, Alta ou Urgente), o dia e a hora do prazo (em vermelho quando já passou) e quem é o responsável. Quando a tarefa está ligada a um negócio do funil, o nome do negócio aparece no fim da linha.","antes":[],"destaques":[{"alvo":{"css":"div.group.rounded-lg:has-text('Enviar o plano alimentar revisado da Mariana')"},"rotulo":"Uma tarefa com todos os detalhes","tipo":"caixa"}]},{"id":"p3","titulo":"Os botões do alto da tela","texto":"No alto da tela ficam os comandos. O seletor \"Em aberto\" escolhe quais tarefas aparecem. \"Lista\" e \"Calendário\" trocam o jeito de ver as tarefas. \"Atualizar\" busca a lista de novo, para você ver o que um colega acabou de mudar. \"Nova tarefa\" abre o formulário para anotar uma tarefa.","dica":"Quem só tem permissão de leitura vê as tarefas, mas não vê o botão \"Nova tarefa\".","antes":[],"destaques":[{"alvo":{"css":"button[role=combobox]:has-text('Em aberto')"},"rotulo":"Quais tarefas mostrar","tipo":"caixa"},{"alvo":{"css":"div:has(> button[aria-pressed])"},"rotulo":"Lista ou calendário","tipo":"caixa"},{"alvo":{"role":"button","nome":"Atualizar","exato":true},"rotulo":"Buscar de novo","tipo":"caixa"},{"alvo":{"role":"button","nome":"Nova tarefa","exato":true},"rotulo":"Anotar uma tarefa","tipo":"caixa"}]}]},{"id":"tarefas-criar-uma-tarefa","titulo":"Criar uma tarefa","objetivo":"Anotar uma tarefa nova com detalhes, prioridade e responsável.","papel":"admin","busca":["criar tarefa","nova tarefa","anotar tarefa","lembrete para equipe","responsável pela tarefa","prioridade","passar tarefa para colega"],"passos":[{"id":"p1","titulo":"Abrir o formulário","texto":"Para anotar uma tarefa nova, clique em \"Nova tarefa\", no canto de cima, à direita.","rota":"/app/tasks","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Nova tarefa","exato":true},"rotulo":"Clique aqui","tipo":"seta"}],"clicar":{"role":"button","nome":"Nova tarefa","exato":true}},{"id":"p2","titulo":"O que precisa ser feito","texto":"No primeiro campo, \"O que precisa ser feito\", escreva a tarefa numa frase curta. Ele é o único campo obrigatório. Em \"Detalhes\", anote o que você vai querer lembrar quando chegar a hora.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova tarefa","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"O que precisa ser feito"},"valor":"Ligar para a Camila e confirmar a avaliação postural"},{"acao":"fill","alvo":{"rotulo":"Detalhes"},"valor":"Ela perguntou se a avaliação é no mesmo dia da primeira sessão."}],"destaques":[{"alvo":{"rotulo":"O que precisa ser feito"},"rotulo":"Título da tarefa","tipo":"caixa"},{"alvo":{"rotulo":"Detalhes"},"rotulo":"Anotações","tipo":"caixa"}]},{"id":"p3","titulo":"Prazo, prioridade e situação","texto":"Em \"Prazo\" você escolhe o dia e em \"Horário\" a hora. O prazo é opcional: sem ele, a tarefa vai para o grupo \"Sem prazo\". A hora só fica liberada depois que você escolhe o dia. \"Prioridade\" vai de Baixa a Urgente e já vem como Média; aqui escolhemos Alta. \"Situação\" já vem como Pendente.","dica":"Para criar a tarefa já com o dia preenchido, use o calendário: é a lição \"Ver as tarefas no calendário\".","antes":[{"acao":"click","alvo":{"rotulo":"Prioridade"}},{"acao":"click","alvo":{"role":"option","nome":"Alta","exato":true}}],"destaques":[{"alvo":{"rotulo":"Prazo"},"rotulo":"Dia","tipo":"caixa"},{"alvo":{"rotulo":"Horário"},"rotulo":"Hora","tipo":"caixa"},{"alvo":{"rotulo":"Prioridade"},"rotulo":"Prioridade","tipo":"caixa"},{"alvo":{"rotulo":"Situação"},"rotulo":"Situação","tipo":"caixa"}]},{"id":"p4","titulo":"Quem vai fazer","texto":"Em \"Responsável\", escolha quem vai cumprir a tarefa. A lista traz as pessoas da equipe, menos quem só tem permissão de leitura; você aparece como \"Eu\". \"Ninguém\" deixa a tarefa sem dono.","antes":[{"acao":"click","alvo":{"rotulo":"Responsável"}}],"destaques":[{"alvo":{"role":"option","nome":"Ana Ribeiro","exato":true},"rotulo":"Pessoas da equipe","tipo":"caixa"},{"alvo":{"role":"option","nome":"Ninguém","exato":true},"rotulo":"Sem responsável","tipo":"numero"}],"clicar":{"role":"option","nome":"Ana Ribeiro","exato":true}},{"id":"p5","titulo":"Salvar","texto":"Com tudo preenchido, clique em \"Salvar\". \"Cancelar\" fecha o formulário sem guardar nada.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Ana Ribeiro","exato":true}}],"destaques":[{"alvo":{"rotulo":"Responsável"},"rotulo":"Ana vai fazer","tipo":"caixa"},{"alvo":{"role":"button","nome":"Cancelar","exato":true},"rotulo":"Fechar sem guardar","tipo":"numero"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Guardar a tarefa","tipo":"caixa"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p6","titulo":"A tarefa entrou na lista","texto":"A tarefa aparece na lista na hora. Como ficou sem prazo, ela entrou no grupo \"Sem prazo\", com a prioridade Alta e a Ana Ribeiro como responsável.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"css":"div.group.rounded-lg:has-text('Ligar para a Camila e confirmar a avaliação postural')"}}],"destaques":[{"alvo":{"css":"div.group.rounded-lg:has-text('Ligar para a Camila e confirmar a avaliação postural')"},"rotulo":"Tarefa nova","tipo":"caixa"}]}]},{"id":"tarefas-concluir-editar-apagar","titulo":"Concluir, editar e apagar","objetivo":"Marcar uma tarefa como feita, mudar uma tarefa e apagar a que não serve mais.","papel":"admin","busca":["concluir tarefa","marcar como feita","editar tarefa","apagar tarefa","excluir tarefa","mudar prioridade","riscar tarefa"],"passos":[{"id":"p1","titulo":"Os comandos de cada linha","texto":"A caixinha à esquerda de cada tarefa marca a tarefa como concluída. Quando você passa o mouse sobre a linha, aparecem dois botões à direita: o lápis, para editar, e a lixeira, para apagar.","rota":"/app/tasks","antes":[{"acao":"hover","alvo":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}}],"destaques":[{"alvo":{"role":"checkbox","nome":"Marcar como concluída","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}},"rotulo":"Concluir","tipo":"caixa"},{"alvo":{"role":"button","nome":"Editar a tarefa","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}},"rotulo":"Editar","tipo":"numero"},{"alvo":{"role":"button","nome":"Apagar a tarefa","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}},"rotulo":"Apagar","tipo":"numero"}],"clicar":{"role":"checkbox","nome":"Marcar como concluída","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}}},{"id":"p2","titulo":"Tarefa concluída","texto":"Ao clicar na caixinha, a tarefa do Roberto foi marcada como concluída e saiu da lista, que mostra só o que está em aberto. Agora só a tarefa da Mariana está atrasada. Para rever as concluídas, troque o filtro para \"Concluída\" (próxima lição).","dica":"Se a tarefa estiver ligada a um negócio, a conclusão fica registrada na \"Linha do tempo\" da ficha do negócio.","antes":[{"acao":"click","alvo":{"role":"checkbox","nome":"Marcar como concluída","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Ligar para o Roberto e remarcar a fisioterapia')"}}},{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"section:has(> h2:text-is('Atrasadas'))"},"rotulo":"Só a da Mariana sobrou","tipo":"caixa"}]},{"id":"p3","titulo":"Editar uma tarefa","texto":"Clique no lápis para abrir a tarefa no formulário \"Editar tarefa\". Ele traz tudo o que já estava preenchido. Aqui vamos subir a prioridade da tarefa da Fernanda para Urgente.","antes":[{"acao":"hover","alvo":{"css":"div.group.rounded-lg:has-text('Confirmar o retorno da Fernanda com o Dr. Paulo')"}},{"acao":"click","alvo":{"role":"button","nome":"Editar a tarefa","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Confirmar o retorno da Fernanda com o Dr. Paulo')"}}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"click","alvo":{"rotulo":"Prioridade"}}],"destaques":[{"alvo":{"role":"option","nome":"Urgente","exato":true},"rotulo":"Mudar para Urgente","tipo":"caixa"}],"clicar":{"role":"option","nome":"Urgente","exato":true}},{"id":"p4","titulo":"Salvar a mudança","texto":"Clique em \"Salvar\". A linha da tarefa mostra a prioridade nova na hora.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Urgente","exato":true}},{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"texto":"Urgente","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Confirmar o retorno da Fernanda com o Dr. Paulo')"}}}],"destaques":[{"alvo":{"texto":"Urgente","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Confirmar o retorno da Fernanda com o Dr. Paulo')"}},"rotulo":"Agora é Urgente","tipo":"caixa"}]},{"id":"p5","titulo":"Apagar em dois cliques","texto":"Para apagar, clique na lixeira. No lugar dela aparece o botão vermelho \"Confirmar\": só ao clicar nele a tarefa é apagada. Tarefa apagada não volta. Se ela só não vai mais ser feita, prefira editar e mudar a situação para \"Cancelada\".","antes":[{"acao":"hover","alvo":{"css":"div.group.rounded-lg:has-text('Repor luvas e máscaras do consultório odontológico')"}},{"acao":"click","alvo":{"role":"button","nome":"Apagar a tarefa","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Repor luvas e máscaras do consultório odontológico')"}}},{"acao":"hover","alvo":{"css":"div.group.rounded-lg:has-text('Repor luvas e máscaras do consultório odontológico')"}}],"destaques":[{"alvo":{"role":"button","nome":"Confirmar","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Repor luvas e máscaras do consultório odontológico')"}},"rotulo":"Confirmar apaga de vez","tipo":"caixa"}]}]},{"id":"tarefas-filtrar-por-situacao","titulo":"Ver as tarefas concluídas e as em andamento","objetivo":"Usar o filtro de situação para ver as tarefas concluídas, canceladas ou em andamento, e reabrir uma tarefa.","papel":"admin","busca":["tarefas concluídas","ver tarefas feitas","filtro de tarefas","tarefas canceladas","reabrir tarefa","em andamento"],"passos":[{"id":"p1","titulo":"O filtro de situação","texto":"O seletor no alto começa em \"Em aberto\", que junta as tarefas pendentes e as em andamento. Clique nele para escolher outra situação: \"Pendente\", \"Em andamento\", \"Concluída\" ou \"Cancelada\".","rota":"/app/tasks","antes":[{"acao":"click","alvo":{"css":"button[role=combobox]:has-text('Em aberto')"}}],"destaques":[{"alvo":{"role":"listbox"},"rotulo":"Escolha a situação","tipo":"caixa"}],"clicar":{"role":"option","nome":"Concluída","exato":true}},{"id":"p2","titulo":"As tarefas concluídas","texto":"Com \"Concluída\", a lista mostra o grupo \"Encerradas\": as tarefas aparecem riscadas e com a caixinha marcada. Para reabrir uma tarefa, clique na caixinha marcada: ela volta a ser pendente e reaparece em \"Em aberto\".","antes":[{"acao":"click","alvo":{"role":"option","nome":"Concluída","exato":true}},{"acao":"aguardar","alvo":{"role":"heading","nome":"Encerradas","exato":true}}],"destaques":[{"alvo":{"css":"button[role=combobox]:has-text('Concluída')"},"rotulo":"Filtro: Concluída","tipo":"caixa"},{"alvo":{"role":"checkbox","nome":"Reabrir a tarefa","exato":true,"dentro":{"css":"div.group.rounded-lg:has-text('Enviar o endereço da clínica para a Fernanda')"}},"rotulo":"Clique para reabrir","tipo":"caixa"}]},{"id":"p3","titulo":"As tarefas em andamento","texto":"Com \"Em andamento\", aparecem só as tarefas que alguém marcou como \"Em andamento\". Essa marcação é feita à mão, no formulário da tarefa, no campo \"Situação\".","dica":"Para voltar à lista normal, escolha \"Em aberto\" no mesmo seletor.","antes":[{"acao":"click","alvo":{"css":"button[role=combobox]"}},{"acao":"click","alvo":{"role":"option","nome":"Em andamento","exato":true}},{"acao":"aguardar","alvo":{"css":"div.group.rounded-lg:has-text('Montar a escala de férias da recepção')"}}],"destaques":[{"alvo":{"css":"button[role=combobox]:has-text('Em andamento')"},"rotulo":"Filtro: Em andamento","tipo":"caixa"},{"alvo":{"css":"div.group.rounded-lg:has-text('Montar a escala de férias da recepção')"},"rotulo":"Marcada em andamento","tipo":"caixa"}]}]},{"id":"tarefas-calendario","titulo":"Ver as tarefas no calendário","objetivo":"Ver as tarefas do mês num calendário, abrir uma tarefa e criar outra já com o dia escolhido.","papel":"admin","busca":["calendário de tarefas","tarefas do mês","ver por data","agenda de tarefas","tarefa no dia","criar tarefa no calendário"],"passos":[{"id":"p1","titulo":"Trocar para o calendário","texto":"Clique em \"Calendário\" para ver as tarefas do mês, cada uma no dia do seu prazo. O dia de hoje fica marcado com um círculo colorido. As tarefas atrasadas aparecem em vermelho. As setas dos lados do nome do mês passam para o mês anterior e para o próximo.","dica":"Num dia com mais de três tarefas, aparece \"+1 mais\", \"+2 mais\"… Esse aviso não abre nada; para ver todas, volte para \"Lista\". O calendário mostra as mesmas tarefas do seletor de situação (com \"Em aberto\", as concluídas ficam de fora), e as tarefas sem prazo não aparecem nele.","rota":"/app/tasks","antes":[{"acao":"click","alvo":{"role":"button","nome":"Calendário","exato":true}}],"destaques":[{"alvo":{"css":"h2.capitalize"},"rotulo":"Mês que você está vendo","tipo":"caixa"},{"alvo":{"css":"div.grid.grid-cols-7 > div:has(> span.bg-primary)"},"rotulo":"Hoje","tipo":"caixa"},{"alvo":{"role":"button","nome":"Mês anterior","exato":true},"rotulo":"Mês anterior","tipo":"numero"},{"alvo":{"role":"button","nome":"Próximo mês","exato":true},"rotulo":"Próximo mês","tipo":"numero"}]},{"id":"p2","titulo":"Abrir uma tarefa pelo calendário","texto":"Clique no nome de uma tarefa para abrir o formulário \"Editar tarefa\" com tudo o que já foi preenchido.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Confirmar o retorno da Fernanda com o Dr. Paulo","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"role":"dialog"},"rotulo":"A tarefa aberta","tipo":"caixa"}]},{"id":"p3","titulo":"Criar uma tarefa num dia","texto":"Clique num espaço vazio de um dia para abrir \"Nova tarefa\" com aquele dia já em \"Prazo\". O horário começa às 9h e pode ser trocado. Escreva o que precisa ser feito e clique em \"Salvar\".","antes":[{"acao":"press","tecla":"Escape"},{"acao":"click","alvo":{"css":"div.grid.grid-cols-7 > div:has(> span.bg-primary) + div > span, div.grid.grid-cols-7 > div:has(> span.bg-primary):not(:has(+ div > span)) > span"}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"fill","alvo":{"rotulo":"O que precisa ser feito"},"valor":"Lembrar os pacientes do jejum para o exame de sangue"},{"acao":"fill","alvo":{"rotulo":"Detalhes"},"valor":"Exame é na segunda às 7h; jejum de 8 horas."}],"destaques":[{"alvo":{"rotulo":"Prazo"},"rotulo":"Dia já preenchido","tipo":"caixa"},{"alvo":{"rotulo":"Horário"},"rotulo":"Hora","tipo":"caixa"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p4","titulo":"A tarefa no dia","texto":"Depois de \"Salvar\", a tarefa aparece no dia escolhido.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"Lembrar os pacientes do jejum para o exame de sangue","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Lembrar os pacientes do jejum para o exame de sangue","exato":true},"rotulo":"Tarefa nova","tipo":"caixa"}]}]},{"id":"tarefas-ligadas-a-negocio","titulo":"Tarefas ligadas a um negócio","objetivo":"Ir da tarefa para o negócio do funil e ver as tarefas daquele negócio.","papel":"admin","busca":["tarefa do negócio","tarefa do lead","abrir negócio da tarefa","funil e tarefas","tarefas do cliente"],"passos":[{"id":"p1","titulo":"O nome do negócio é um atalho","texto":"Quando uma tarefa está ligada a um negócio do funil, o nome do negócio aparece no fim da linha. Clique nele para abrir o negócio.","rota":"/app/tasks","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Primeira consulta nutricional — Mariana","exato":true},"rotulo":"Abrir o negócio","tipo":"seta"}],"clicar":{"role":"link","nome":"Primeira consulta nutricional — Mariana","exato":true}},{"id":"p2","titulo":"As tarefas dentro do negócio","texto":"O funil abre com a ficha do negócio por cima. Na seção \"Tarefas\" da ficha aparecem só as tarefas deste negócio, inclusive as já concluídas, e, ao lado do título, a conta de quantas estão abertas e quantas estão atrasadas. Dali também dá para criar uma tarefa em \"Nova tarefa\": ela já nasce ligada ao negócio.","antes":[{"acao":"click","alvo":{"role":"link","nome":"Primeira consulta nutricional — Mariana","exato":true}},{"acao":"aguardar","alvo":{"css":"section[aria-labelledby='dossie-tarefas']"}},{"acao":"esperar","ms":2500},{"acao":"rolar","alvo":{"css":"section[aria-labelledby='dossie-tarefas']"}}],"destaques":[{"alvo":{"css":"section[aria-labelledby='dossie-tarefas']"},"rotulo":"Tarefas deste negócio","tipo":"caixa"},{"alvo":{"role":"button","nome":"Nova tarefa","exato":true,"dentro":{"css":"section[aria-labelledby='dossie-tarefas']"}},"rotulo":"Criar tarefa já ligada","tipo":"numero"}]},{"id":"p3","titulo":"Criar uma tarefa pelo negócio","texto":"Clique em \"Nova tarefa\", na seção \"Tarefas\" da ficha. O formulário é o mesmo da tela de Tarefas, com duas diferenças: a tarefa já nasce ligada a este negócio, e o campo \"Responsável\" já vem com você (\"Eu\"), porque quem anota o próximo passo do negócio quase sempre é quem vai cumpri-lo.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova tarefa","exato":true,"dentro":{"css":"section[aria-labelledby='dossie-tarefas']"}}},{"acao":"aguardar","alvo":{"role":"dialog","nome":"Nova tarefa","exato":true}}],"destaques":[{"alvo":{"rotulo":"Responsável","exato":true,"dentro":{"role":"dialog","nome":"Nova tarefa","exato":true}},"rotulo":"Já vem com você","tipo":"caixa"}]}]}]},{"id":"agentes","titulo":"Agentes","tela":"/app/ai/agents","resumo":"Onde você monta os atendentes virtuais que respondem seus clientes no WhatsApp: as instruções, o que eles podem fazer, o material que consultam e a hora de entrar no ar.","licoes":[{"id":"conhecendo-os-agentes","titulo":"Conhecendo a tela de Agentes","objetivo":"Reconhecer o cartão de cada agente, entender o que dizem os selos e achar um agente pela busca.","papel":"admin","busca":["agentes","agente de ia","robô","atendente virtual","lista de agentes","publicado","rascunho","buscar agente","criar agente"],"passos":[{"id":"p1","titulo":"Um cartão para cada agente","texto":"A tela Agentes, no grupo \"Agente de IA\" do menu, reúne os atendentes virtuais que respondem seus clientes no WhatsApp. Cada agente aparece num cartão. Nesta clínica de exemplo existe um só: a Bia, que faz a recepção. Para montar outro agente, clique em \"Criar novo\".","dica":"Só o administrador vê \"Criar novo\" e o menu de ações do cartão. O gerente entra na tela, mas só consegue olhar: o botão do cartão vira \"Visualizar\".","rota":"/app/ai/agents","antes":[],"destaques":[{"alvo":{"css":"li:has(h3[title=\"Bia — Recepção virtual\"])"},"rotulo":"O cartão da Bia","tipo":"caixa"},{"alvo":{"role":"button","nome":"Criar novo","exato":true},"rotulo":"Montar outro agente","tipo":"seta"}]},{"id":"p2","titulo":"O que o cartão mostra","texto":"O selo \"Publicado\" quer dizer que o agente está no ar: as mensagens novas do WhatsApp vão para ele. Quando aparece \"Rascunho\", ele não está atendendo, porque ainda não foi publicado ou foi pausado. O selo \"default\" marca o agente padrão da empresa. Abaixo do nome aparecem a empresa de inteligência artificial e o modelo que estão valendo. Em \"Prioridade\" fica a ordem de preferência, que só importa quando há mais de um agente. Em \"Tipo\" aparece um código interno do sistema: é só informativo, você não precisa mexer.","antes":[],"destaques":[{"alvo":{"css":"[aria-label=\"status: Publicado\"]"},"rotulo":"Está no ar","tipo":"caixa"},{"alvo":{"texto":"default","exato":true},"rotulo":"Agente padrão","tipo":"caixa"},{"alvo":{"texto":"^anthropic ·","regex":true},"rotulo":"Empresa de IA e modelo","tipo":"caixa"},{"alvo":{"css":"li dl > div:nth-child(2)"},"rotulo":"Ordem de preferência","tipo":"caixa"}]},{"id":"p3","titulo":"Achar um agente","texto":"Quando a lista crescer, digite parte do nome no campo de busca. Se nenhum agente tiver aquele nome, aparece o aviso \"Nenhum agente corresponde aos filtros atuais.\". Na caixa \"Todos\", ao lado, escolha \"Publicado\" para ver só os que estão no ar. Os agentes arquivados ficam escondidos: marque \"Incluir arquivados\" para vê-los.","antes":[{"acao":"fill","alvo":{"rotulo":"Buscar agentes"},"valor":"Nutri"}],"destaques":[{"alvo":{"rotulo":"Buscar agentes"},"rotulo":"Busca pelo nome","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Filtrar por status"},"rotulo":"Filtrar pela situação","tipo":"caixa"},{"alvo":{"role":"checkbox","nome":"Incluir arquivados"},"rotulo":"Mostrar os arquivados","tipo":"seta"},{"alvo":{"texto":"Nenhum agente corresponde aos filtros atuais."},"rotulo":"Nenhum agente com esse nome","tipo":"caixa"}]},{"id":"p4","titulo":"Abrir um agente","texto":"Apague o que digitou na busca e o cartão da Bia volta. Para abrir a configuração de um agente, clique em \"Editar\" no cartão dele.","antes":[{"acao":"fill","alvo":{"rotulo":"Buscar agentes"},"valor":""}],"destaques":[{"alvo":{"role":"button","nome":"Editar","exato":true},"rotulo":"Abrir a configuração","tipo":"seta"}],"clicar":{"role":"button","nome":"Editar","exato":true}}]},{"id":"menu-do-cartao","titulo":"O menu de ações do cartão","objetivo":"Saber o que fazem Duplicar, Renomear, Pausar e Arquivar, e trocar o nome de um agente.","papel":"admin","busca":["duplicar agente","copiar agente","renomear agente","trocar nome","pausar agente","despausar","arquivar agente","desligar robô"],"passos":[{"id":"p1","titulo":"Editar, duplicar e renomear","texto":"O botão de três pontinhos, no canto do cartão, abre o menu de ações. \"Editar\" abre a configuração, igual ao botão do cartão. \"Duplicar\" cria uma cópia do agente com as mesmas instruções e ajustes, como rascunho: a cópia não entra no ar sozinha. \"Renomear\" troca só o nome.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Menu de ações","exato":true}}],"destaques":[{"alvo":{"role":"menuitem","nome":"Editar","exato":true},"rotulo":"Abrir a configuração","tipo":"numero"},{"alvo":{"role":"menuitem","nome":"Duplicar","exato":true},"rotulo":"Cópia em rascunho","tipo":"numero"},{"alvo":{"role":"menuitem","nome":"Renomear","exato":true},"rotulo":"Trocar o nome","tipo":"numero"}]},{"id":"p2","titulo":"Pausar e arquivar","texto":"\"Pausar\" faz o agente parar de responder os clientes, sem perder nada do que foi configurado. Depois disso, o item vira \"Despausar\", que põe o agente de volta no ar. \"Arquivar\" tira o agente do ar e da lista, e não dá para desarquivar pela tela. Aqui ele aparece apagado porque a Bia é o agente padrão, e o agente padrão não pode ser arquivado.","dica":"Pausar pelo menu é o mesmo que o botão \"Pausar automático\" dentro da página do agente.","antes":[],"destaques":[{"alvo":{"role":"menuitem","nome":"Pausar","exato":true},"rotulo":"Parar de responder","tipo":"caixa"},{"alvo":{"role":"menuitem","nome":"Arquivar","exato":true},"rotulo":"Bloqueado para o agente padrão","tipo":"caixa"}],"clicar":{"role":"menuitem","nome":"Renomear","exato":true}},{"id":"p3","titulo":"Trocar o nome","texto":"Em \"Renomear\", digite o novo nome e clique em \"Salvar\". Só o nome muda: as versões publicadas e o histórico continuam iguais. Para desistir, clique em \"Cancelar\".","antes":[{"acao":"click","alvo":{"role":"menuitem","nome":"Renomear","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"rotulo":"Nome","exato":true,"dentro":{"role":"dialog"}},"rotulo":"O novo nome","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Guardar o nome","tipo":"caixa"},{"alvo":{"role":"button","nome":"Cancelar","exato":true,"dentro":{"role":"dialog"}},"rotulo":"Desistir","tipo":"caixa"}],"clicar":{"role":"button","nome":"Cancelar","exato":true,"dentro":{"role":"dialog"}}}]},{"id":"abrindo-um-agente","titulo":"Por dentro de um agente","objetivo":"Entender o topo da página do agente: o modo de operação, as abas, o selo da versão no ar e as três partes da configuração.","papel":"admin","busca":["configurar agente","modo assistido","modo automático","pausar automático","retomar automático","versão publicada","rascunho","publicar agente"],"passos":[{"id":"p1","titulo":"Automático ou assistido","texto":"No alto da página do agente fica a \"Operação do agente\". No modo automático, ele responde sozinho, seguindo as regras que você configurou. No modo assistido, ele só prepara sugestões dentro da conversa, e nada é enviado sem a aprovação de uma pessoa. O botão \"Pausar automático\" para na hora as respostas que ele manda sozinho: a configuração fica guardada, as sugestões do modo assistido continuam e o botão vira \"Retomar automático\".","dica":"A troca de modo e a pausa valem assim que você clica. Não precisa salvar.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}}],"destaques":[{"alvo":{"role":"combobox","nome":"Modo de operação"},"rotulo":"Automático ou assistido","tipo":"caixa"},{"alvo":{"role":"button","nome":"Pausar automático","exato":true},"rotulo":"Parar as respostas sozinhas","tipo":"caixa"}]},{"id":"p2","titulo":"As abas do agente","texto":"Logo abaixo ficam as abas do agente. Você começa em \"Configuração\", onde monta o agente. \"Teste\" mostra como ele responderia, sem mandar nada ao cliente. \"Capacidades\" conta o que ele usou, \"Execuções\" lista cada vez que ele trabalhou, \"Histórico\" guarda as versões e \"Propostas\" traz as melhorias que ele sugere. A última lição mostra o Teste, o Histórico, as Execuções e as Propostas.","antes":[],"destaques":[{"alvo":{"css":"[role=\"tablist\"]:has(> [role=\"tab\"][data-state])"},"rotulo":"As abas do agente","tipo":"caixa"}]},{"id":"p3","titulo":"A versão no ar e os botões","texto":"Ao lado do nome, o selo \"Publicado v1\" diz que a versão 1 é a que está atendendo. As instruções, a inteligência, o número e as regras de atendimento viram um rascunho: os clientes só veem essas mudanças depois que você publica. Nome, descrição e ordem de preferência mudam assim que você salva o rascunho. Enquanto não há nada para salvar, os botões ficam apagados, e a frase embaixo diz o que falta para publicar.","antes":[],"destaques":[{"alvo":{"texto":"Publicado v1","exato":true},"rotulo":"Versão que está atendendo","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar rascunho","exato":true},"rotulo":"Guardar as mudanças","tipo":"caixa"},{"alvo":{"role":"button","nome":"Publicar","exato":true},"rotulo":"Pôr no ar","tipo":"caixa"},{"alvo":{"testid":"motivo-do-publicar"},"rotulo":"O que falta para publicar","tipo":"caixa"}]},{"id":"p4","titulo":"As três partes da configuração","texto":"A configuração tem três partes. \"Conversa com o cliente\" é como ele atende. \"Organiza o sistema\" é o que ele registra por dentro depois da conversa. \"Confere antes de enviar\" mostra as verificações de cada mensagem. As duas primeiras partes formam um rascunho só, salvo pelo mesmo botão. As escolhas da terceira valem na hora, para a empresa toda.","antes":[],"destaques":[{"alvo":{"role":"tablist","nome":"Papéis do agente"},"rotulo":"As três partes","tipo":"caixa"}]}]},{"id":"identidade-e-inteligencia","titulo":"Nome, inteligência, número e limites","objetivo":"Preencher quem é o agente, entender a escolha da inteligência artificial e da chave, ligar o número de WhatsApp e conhecer os limites de cada atendimento.","papel":"admin","busca":["nome do agente","chave de acesso","credencial","anthropic","modelo de ia","número do whatsapp","limite de custo","esperar antes de responder"],"passos":[{"id":"p1","titulo":"Quem é este agente","texto":"Na parte \"Conversa com o cliente\", o primeiro bloco é \"Quem é este agente\". O \"Nome\" é o que aparece na lista de agentes, e a \"Descrição\" é uma anotação sua sobre o que ele faz. A \"Ordem de preferência\" só importa quando mais de um agente pode atender a mesma conversa: o de número maior tenta primeiro. Com um agente só, deixe como está. Atenção: estes três campos valem assim que você salva o rascunho, sem precisar publicar.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}}],"destaques":[{"alvo":{"rotulo":"Nome","exato":true},"rotulo":"Nome na lista","tipo":"caixa"},{"alvo":{"rotulo":"Descrição","exato":true},"rotulo":"Anotação sua","tipo":"caixa"},{"alvo":{"rotulo":"Ordem de preferência (0 a 1000)"},"rotulo":"Quem tenta primeiro","tipo":"caixa"}]},{"id":"p2","titulo":"A inteligência e a chave","texto":"Em \"A inteligência que ele usa\" você escolhe a empresa de inteligência artificial, o modelo e a \"Chave de acesso\", que é o código da sua conta nessa empresa. Nesta instalação de exemplo nenhuma chave foi cadastrada. Por isso aparecem o aviso em vermelho e o link \"Cadastrar credencial anthropic\", que leva à tela onde você cola a chave. Sem chave, o agente não consegue salvar mudanças.","dica":"Se a chave foi colocada durante a instalação do sistema, ela aparece na lista como \"A chave desta instalação\".","antes":[{"acao":"rolar","alvo":{"rotulo":"Chave de acesso","exato":true}}],"destaques":[{"alvo":{"rotulo":"Empresa de inteligência artificial"},"rotulo":"Empresa de IA","tipo":"caixa"},{"alvo":{"rotulo":"Chave de acesso","exato":true},"rotulo":"A chave da sua conta","tipo":"caixa"},{"alvo":{"role":"link","nome":"Cadastrar credencial anthropic","exato":true},"rotulo":"Cadastrar a chave","tipo":"seta"},{"alvo":{"texto":"^Esta instalação não tem chave de anthropic","regex":true},"rotulo":"Falta a chave","tipo":"caixa"}]},{"id":"p3","titulo":"Por qual número ele atende","texto":"\"Por qual número ele atende\" liga o agente a um número de WhatsApp da empresa. Aqui está escolhido o \"Recepção Bem Viver\", que aparece como \"Conectado\". Sem um número escolhido, o rascunho até salva, mas o agente não pode ser publicado.","dica":"Se a empresa ainda não tiver nenhum número de WhatsApp, aparece o link \"Conectar WhatsApp\", que leva à tela de Conexões. Um número que caiu continua na lista com a situação ao lado, mas o agente só pode ser publicado com um número \"Conectado\".","antes":[],"destaques":[{"alvo":{"rotulo":"Número conectado"},"rotulo":"O número de WhatsApp","tipo":"caixa"}]},{"id":"p4","titulo":"Freios de segurança","texto":"Os \"Freios de segurança\" limitam cada atendimento. Em \"Ações por atendimento\" você define quantas ações o agente pode fazer numa resposta, e em \"Mensagens anteriores que ele lê\", quanto da conversa ele relê antes de responder. Em \"Esperar antes de responder\", as mensagens que o cliente manda em sequência, dentro desse tempo, viram uma resposta só. Deixando vazio, vale o padrão da instalação.","antes":[{"acao":"rolar","alvo":{"rotulo":"Esperar antes de responder (segundos)"}}],"destaques":[{"alvo":{"rotulo":"Ações por atendimento (1 a 25)"},"rotulo":"Ações por atendimento","tipo":"caixa"},{"alvo":{"rotulo":"Mensagens anteriores que ele lê"},"rotulo":"Quanto da conversa ele lê","tipo":"caixa"},{"alvo":{"rotulo":"Esperar antes de responder (segundos)"},"rotulo":"Juntar mensagens seguidas","tipo":"caixa"}]}]},{"id":"instrucoes-e-capacidades","titulo":"Instruções, capacidades e conhecimento","objetivo":"Escrever as instruções do agente, entender como salvar e publicar, e escolher o que ele pode fazer e o material que ele consulta.","papel":"admin","busca":["instruções do agente","prompt","salvar rascunho","publicar versão","descartar alterações","capacidades","o que o agente pode fazer","base de conhecimento","material da clínica"],"passos":[{"id":"p1","titulo":"As instruções dele","texto":"Em \"As instruções dele\" você escreve, com suas palavras, quem o agente é e como deve atender: o tom, o que ele pode responder e o que deve passar para a equipe. No canto, o número com barra, como \"57/20.000\", mostra quantos caracteres você já usou, de no máximo 20.000. O outro número, ao lado, é uma estimativa técnica e pode ser ignorado.","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}}],"destaques":[{"alvo":{"css":"textarea.font-mono"},"rotulo":"Quem ele é e como atende","tipo":"caixa"},{"alvo":{"testid":"contador-do-prompt"},"rotulo":"Caracteres usados","tipo":"seta"}]},{"id":"p2","titulo":"Mudou? Salve e publique","texto":"Assim que você muda algo, o botão \"Descartar alterações\" acende, para voltar ao que estava. Aqui \"Salvar rascunho\" continua apagado porque falta a chave de acesso da lição anterior. Com a chave, ele guarda a mudança como \"Rascunho v2\" e o botão de publicar vira \"Publicar v2\". Ao publicar, uma janela resume o que muda e pede confirmação. A versão anterior fica guardada no Histórico. Para desfazer a mudança, clique em \"Descartar alterações\".","antes":[{"acao":"fill","alvo":{"css":"textarea.font-mono"},"valor":"Você é a Bia, recepcionista virtual da Clínica Bem Viver, que tem nutrição, fisioterapia e odontologia.\nFale de um jeito acolhedor e com frases curtas.\nAjude o paciente a marcar, remarcar ou cancelar consultas.\nNunca diga o que a pessoa tem nem indique remédio: dúvidas de saúde vão para a equipe."}],"destaques":[{"alvo":{"role":"button","nome":"Descartar alterações","exato":true},"rotulo":"Voltar ao que estava","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar rascunho","exato":true},"rotulo":"Apagado: falta a chave","tipo":"caixa"},{"alvo":{"css":"textarea.font-mono"},"rotulo":"Instruções alteradas","tipo":"caixa"}],"clicar":{"role":"button","nome":"Descartar alterações","exato":true}},{"id":"p3","titulo":"Respostas em mensagens curtas","texto":"Em \"Estilo de resposta\", ligar \"Responder em várias mensagens curtas\" faz o agente mandar a resposta em várias bolhas, como uma pessoa digitando, em vez de um bloco único. Ligado, aparece o campo do tamanho máximo de cada bolha.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Descartar alterações","exato":true}}],"destaques":[{"alvo":{"role":"switch","nome":"Responder em várias mensagens curtas (como uma pessoa digita)","exato":true},"rotulo":"Várias bolhas curtas","tipo":"seta"}]},{"id":"p4","titulo":"O que o agente pode fazer","texto":"\"O que o agente pode fazer\" define o que ele faz sozinho durante o atendimento. As capacidades vêm em pacotes por tarefa, como \"Atender e responder\" e \"Vender e mover o funil\": ligar um pacote liga as capacidades dele de uma vez. As que têm \"Efeito que não dá para desfazer\" ficam no quadro vermelho e só se ligam uma a uma. O contador mostra quantas estão ligadas. O limite é 27: acima disso o agente se confunde na hora de escolher o que usar, então ligue só os pacotes de que o seu negócio precisa.","dica":"\"Escolher uma a uma (modo avançado)\", no fim da lista, mostra todas as capacidades separadas.","antes":[{"acao":"rolar","alvo":{"testid":"switch-pacote-vender"}}],"destaques":[{"alvo":{"testid":"consumo-teto"},"rotulo":"Quantas estão ligadas","tipo":"caixa"},{"alvo":{"testid":"pacote-atender"},"rotulo":"Um pacote por tarefa","tipo":"caixa"},{"alvo":{"testid":"criticas-vender"},"rotulo":"Só uma a uma","tipo":"caixa"}]},{"id":"p5","titulo":"O que ele consulta antes de responder","texto":"\"O que ele consulta antes de responder\" é o material da sua clínica que o agente pode ler, como perguntas frequentes, preços e preparo de exames. Ele procura ali antes de responder e cita de onde tirou. Nesta clínica ainda não há material, e o link leva à tela onde você cadastra. Sem material marcado, ele responde só com o que a inteligência artificial já sabe.","antes":[],"destaques":[{"alvo":{"testid":"agente-sem-acervo"},"rotulo":"Ainda sem material","tipo":"caixa"},{"alvo":{"role":"link","nome":"Comece pelo que ele mais vai precisar","exato":true},"rotulo":"Cadastrar material","tipo":"seta"}]}]},{"id":"quando-responder-e-passar","titulo":"Quando ele responde e quando chama a equipe","objetivo":"Definir quando o agente entra em ação, o horário de atendimento e as situações em que ele passa a conversa para uma pessoa.","papel":"admin","busca":["horário de funcionamento","fora do horário","não responder grupos","passar para humano","chamar atendente","palavras-chave","sentimento","follow-up","comandos #on #off"],"passos":[{"id":"p1","titulo":"Quando ele entra em ação","texto":"\"Quando ele entra em ação\" diz o que faz o agente responder: uma mensagem nova do cliente. Ele nunca responde em grupos nem às mensagens que saem do seu próprio número. Se você preencher \"Só responder quando a mensagem falar de algo específico\", ele só entra quando a mensagem tiver uma das palavras, separadas por barra vertical (|).","rota":"/app/ai/agents","antes":[{"acao":"click","alvo":{"role":"button","nome":"Editar","exato":true}},{"acao":"aguardar","alvo":{"testid":"papel-conversa"}},{"acao":"rolar","alvo":{"rotulo":"Só responder quando a mensagem falar de algo específico (opcional)"}}],"destaques":[{"alvo":{"texto":"Uma mensagem nova do cliente","exato":true},"rotulo":"O que faz ele responder","tipo":"caixa"},{"alvo":{"rotulo":"Só responder quando a mensagem falar de algo específico (opcional)"},"rotulo":"Só certos assuntos","tipo":"caixa"}]},{"id":"p2","titulo":"Horário de funcionamento","texto":"Ligando \"Só atender em horário de funcionamento\", aparecem o fuso horário, o início, o fim e os dias da semana do atendimento. Ele já vem das 8h às 20h, de segunda a sexta (na tela aparece como 08:00 AM e 08:00 PM), e você ajusta como quiser. Em \"Mensagem fora do horário\" você escreve o aviso para quem chamar com a clínica fechada (o texto cinza no campo é só um exemplo): ele vai uma vez por cliente em cada período fechado, e nunca para quem pediu para não receber mensagens. Para valer, salve o rascunho e publique.","antes":[{"acao":"click","alvo":{"role":"switch","nome":"Só atender em horário de funcionamento","exato":true}},{"acao":"rolar","alvo":{"rotulo":"Mensagem fora do horário (opcional)"}}],"destaques":[{"alvo":{"role":"switch","nome":"Só atender em horário de funcionamento","exato":true},"rotulo":"Liga o horário","tipo":"seta"},{"alvo":{"rotulo":"Início","exato":true},"rotulo":"Começa","tipo":"caixa"},{"alvo":{"rotulo":"Fim","exato":true},"rotulo":"Termina","tipo":"caixa"},{"alvo":{"rotulo":"Mensagem fora do horário (opcional)"},"rotulo":"Aviso com a clínica fechada","tipo":"caixa"}]},{"id":"p3","titulo":"Passar para uma pessoa","texto":"\"Passar para uma pessoa\" tem duas chaves. A primeira deixa o agente chamar alguém da equipe quando percebe que o caso não é dele. A segunda, que só funciona com a primeira ligada, passa a conversa quando o cliente fala de assunto jurídico, como Procon ou advogado. Em \"Palavras que chamam uma pessoa na hora\" ficam as expressões, como \"atendente\", que passam a conversa direto para a equipe.","dica":"Quem pede para falar com uma pessoa é sempre passado, mesmo com a chave do assunto jurídico desligada.","antes":[{"acao":"rolar","alvo":{"css":"div.space-y-2:has(> label[for=\"handoff_kw\"])"}}],"destaques":[{"alvo":{"role":"switch","nome":"Deixar o agente chamar uma pessoa quando perceber que não é caso dele","exato":true},"rotulo":"Chamar a equipe","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Passar para uma pessoa quando o cliente falar de assunto jurídico (Procon, advogado, processo)","exato":true},"rotulo":"Assunto jurídico","tipo":"seta"},{"alvo":{"css":"div.space-y-2:has(> label[for=\"handoff_kw\"])"},"rotulo":"Palavras que chamam a equipe","tipo":"caixa"}]},{"id":"p4","titulo":"O clima da conversa","texto":"O \"Limiar de sentimento\" é uma nota do clima da conversa, de 0 a 1. Abaixo dela, o clima é considerado fechado e a conversa passa para uma pessoa. Nota mais alta manda mais conversas para a equipe. Numa clínica, contar o problema de saúde não é irritação: o que conta é hostilidade com o atendimento.","dica":"Este campo salva sozinho quando você sai dele, sem passar pelo rascunho.","antes":[{"acao":"rolar","alvo":{"role":"switch","nome":"Deixar o agente pedir uma tarefa a alguém e seguir conversando","exato":true}}],"destaques":[{"alvo":{"rotulo":"Nota mínima do clima, de 0 a 1"},"rotulo":"Nota do clima","tipo":"caixa"}]},{"id":"p5","titulo":"Pedir ajuda, propostas e follow-up","texto":"Com \"Deixar o agente pedir uma tarefa a alguém\", ele abre um pedido interno, como aprovar um desconto, e continua atendendo até alguém responder. A chave de \"Propostas comerciais\" deixa ele rascunhar uma proposta quando o cliente pede orçamento. Em \"Follow-up\", ele retoma s

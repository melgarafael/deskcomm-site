 na Meta. Os três dados vêm desse app, na parte WhatsApp → Configuração da API: o ID do número de telefone, o ID da conta do WhatsApp Business e o token de acesso. Ao clicar em \"Validar e conectar\", o sistema confere os dados com a Meta antes de guardar. Se o número não responder, nada é salvo. Depois de conectar, olhe o quadro logo abaixo: se ele disser \"Cole isto no painel da Meta\", copie os valores para o painel da Meta, senão as respostas dos clientes não chegam.","dica":"O token fica guardado de forma protegida e nunca mais aparece na tela.","rota":"/app/connections?aba=oficial","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"rotulo":"ID do número de telefone"},"rotulo":"ID do número de telefone","tipo":"caixa"},{"alvo":{"rotulo":"ID da conta do WhatsApp Business"},"rotulo":"Conta do WhatsApp Business","tipo":"caixa"},{"alvo":{"rotulo":"Token de acesso"},"rotulo":"Chave da Meta","tipo":"caixa"},{"alvo":{"role":"button","nome":"Validar e conectar","exato":true},"rotulo":"Conferir e ligar","tipo":"seta"}]},{"id":"p2","titulo":"Templates da Meta","texto":"Na sub-aba \"Templates da Meta\" ficam os modelos de mensagem aprovados pela Meta. Eles são criados na sua conta do WhatsApp Business, e esta tela só mostra uma cópia deles. Sem o canal oficial conectado, aparece \"Canal oficial não conectado\": conecte primeiro na sub-aba \"Conexão\". Depois de conectar, o botão \"Sincronizar com a Meta\" traz os modelos. Passadas 24 horas da última mensagem do cliente, só um modelo aprovado pode ser enviado. O aviso fala em \"Conexões WhatsApp\": é a sub-aba \"Conexão\", ao lado.","dica":"Não confunda com \"Respostas rápidas\", do menu: aquelas são textos prontos da sua equipe.","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Templates da Meta"}},{"acao":"aguardar","alvo":{"texto":"Canal oficial não conectado","exato":true}}],"destaques":[{"alvo":{"css":"[role=tablist]:has(> [role=tab]:text-is('Templates da Meta'))"},"rotulo":"Conexão e Templates da Meta","tipo":"caixa"},{"alvo":{"texto":"Canal oficial não conectado","exato":true},"rotulo":"Falta conectar","tipo":"caixa"}]},{"id":"p3","titulo":"Provedor parceiro","texto":"A aba \"Provedor parceiro\" liga um número oficial do WhatsApp Business por meio de uma empresa parceira, cujo nome aparece no título do cartão. Você precisa ter conta com essa empresa. Cole a \"Conta\" (o identificador do número no painel do parceiro) e a \"Chave de API\" e clique em \"Conectar\". A chave é testada com o parceiro antes de ser guardada, e o selo \"Não conectado\" muda quando der certo. Logo depois, a tela mostra dois valores para colar no painel do parceiro. Copie na hora: o segredo só aparece uma vez, e sem esse passo as respostas dos clientes não chegam.","rota":"/app/connections?aba=parceiro","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"rotulo":"Conta","exato":true},"rotulo":"Identificador no parceiro","tipo":"caixa"},{"alvo":{"rotulo":"Chave de API","exato":true},"rotulo":"Chave do parceiro","tipo":"caixa"},{"alvo":{"texto":"Não conectado","exato":true},"rotulo":"Situação","tipo":"caixa"}]},{"id":"p4","titulo":"Telefone","texto":"A aba \"Telefone\" lista os números que recebem ligações. Cada número aponta para um agente de voz e um modo de atendimento. Para cadastrar, clique em \"Novo número\". As ligações só chegam se quem cuida da instalação tiver contratado e ligado a linha telefônica: cadastrar aqui, sozinho, não faz o telefone tocar. A clínica de exemplo ainda não tem nenhum.","rota":"/app/connections?aba=telefonia","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"role":"button","nome":"Novo número","exato":true},"rotulo":"Cadastrar um número","tipo":"seta"},{"alvo":{"texto":"Nenhum número cadastrado ainda.","exato":true},"rotulo":"Lista vazia","tipo":"caixa"}]},{"id":"p5","titulo":"Redes sociais","texto":"A aba \"Redes sociais\" traz as mensagens das suas contas em redes sociais para o atendimento. Ela usa um provedor externo que você precisa contratar. Primeiro cole a \"Chave de API\" desse provedor e clique em \"Buscar perfis\". Escolha o perfil da empresa e clique em \"Salvar conexão\". Depois autorize cada rede em \"Autorizar conta\" e, no cartão da conta, clique em \"Receber no atendimento\" para as mensagens entrarem na Inbox.","rota":"/app/connections?aba=sociais","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"rotulo":"Chave de API","exato":true},"rotulo":"Chave do provedor","tipo":"caixa"},{"alvo":{"role":"button","nome":"Buscar perfis","exato":true},"rotulo":"Achar o perfil da empresa","tipo":"seta"}]},{"id":"p6","titulo":"Chamada de voz","texto":"A aba \"Chamada de voz\" liga as chamadas de voz pelo WhatsApp. Ela depende de um serviço que quem cuida da instalação do sistema precisa configurar. Enquanto isso não acontece, a aba mostra o aviso \"A chamada de voz não está configurada.\" A linha de baixo do aviso é um recado técnico para quem cuida da instalação. Você não precisa entendê-la, só repassá-la.","rota":"/app/connections?aba=voz","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"texto":"A chamada de voz não está configurada.","exato":true},"rotulo":"Falta configurar o serviço","tipo":"caixa"}]}]}]},{"id":"webhooks","titulo":"Webhooks","tela":"/app/webhooks","resumo":"Onde você liga os formulários do seu site ao funil, vê cada contato que chegou por eles e cria avisos automáticos para outros sistemas quando algo acontece no CRM.","licoes":[{"id":"conhecendo-a-tela","titulo":"Conhecendo a tela de Webhooks","objetivo":"Saber para que serve cada aba e ler de relance se cada formulário está ligado e recebendo contatos.","papel":"admin","busca":["webhooks","integração","formulário do site","landing page","receber contatos de fora","ligar outro sistema","fontes de captação"],"passos":[{"id":"p1","titulo":"As quatro abas","texto":"A tela de Webhooks liga o CRM a outros lugares. Na aba \"Receber dados\" ficam as fontes: cada formulário ou landing page que traz contatos para o seu funil. \"Leads recebidos\" mostra tudo o que chegou por esses formulários. Em \"Automações\" você cria regras que agem sozinhas, como avisar outro sistema quando um paciente fecha. \"Atividade\" mostra o que cada automação fez.","dica":"Só quem é gerente ou administrador vê esta tela. Os atendentes que tentam abri-la vão para a Inbox.","rota":"/app/webhooks","antes":[],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"As quatro abas","tipo":"caixa"},{"alvo":{"role":"button","nome":"Nova fonte","exato":true},"rotulo":"Ligar um formulário novo","tipo":"seta"}]},{"id":"p2","titulo":"Uma fonte para cada formulário","texto":"Cada cartão é uma fonte. O selo verde \"Ativa\" quer dizer que ela está aceitando contatos. \"Pausada\" quer dizer que ela recusa os envios: quem preencher aquele formulário não entra no funil. Embaixo do nome aparece há quanto tempo chegou o último contato, ou \"nunca recebeu\" se ainda não chegou nenhum. Um formulário que costumava receber todo dia e está parado há muito tempo merece uma olhada.","antes":[],"destaques":[{"alvo":{"texto":"Ativa","exato":true,"dentro":{"css":"div.cursor-pointer:has-text('Avaliação nutricional')"}},"rotulo":"Aceitando contatos","tipo":"caixa"},{"alvo":{"texto":"^último recebimento","regex":true,"dentro":{"css":"div.cursor-pointer:has-text('Avaliação nutricional')"}},"rotulo":"Último contato que chegou","tipo":"caixa"},{"alvo":{"texto":"Pausada","exato":true,"dentro":{"css":"div.cursor-pointer:has-text('Pilates para iniciantes')"}},"rotulo":"Recusando envios","tipo":"caixa"}],"clicar":{"texto":"Formulário do site — Avaliação nutricional","exato":true}},{"id":"p3","titulo":"Abrindo uma fonte","texto":"Clique num cartão para abrir o painel da fonte, à direita. No alto ficam o nome e a situação. O lápis ao lado do nome serve para renomear a fonte. Logo abaixo vem o endereço da fonte: é ele que você cola no seu site. A próxima lição mostra como.","dica":"Logo abaixo do endereço há três chaves técnicas: autorizar IA, atualizar o card e reaproveitar o card. Elas servem para integrações feitas por um programador. Pode deixá-las desligadas.","antes":[{"acao":"click","alvo":{"texto":"Formulário do site — Avaliação nutricional","exato":true}},{"acao":"aguardar","alvo":{"texto":"Endereço da fonte","exato":true}}],"destaques":[{"alvo":{"css":"div.flex.items-center.gap-2:has(> div.min-w-0 > button[aria-label='Editar nome da fonte'])"},"rotulo":"Nome, lápis e situação","tipo":"caixa"},{"alvo":{"css":"section:has(> p:text-is('Endereço da fonte'))"},"rotulo":"Endereço da fonte","tipo":"caixa"}]}]},{"id":"criar-fonte","titulo":"Criar uma fonte para o seu formulário","objetivo":"Criar uma fonte nova e escolher em que funil e etapa os contatos do formulário vão entrar.","papel":"admin","busca":["criar fonte","conectar formulário","nova landing page","contatos do site no funil","formulário cair no funil","captar leads do site"],"passos":[{"id":"p1","titulo":"Começar uma fonte","texto":"Para cada formulário ou landing page, crie uma fonte. Assim você sabe de onde veio cada contato e pode pausar um formulário sem mexer nos outros. Clique em \"Nova fonte\".","rota":"/app/webhooks","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Nova fonte","exato":true},"rotulo":"Criar uma fonte","tipo":"seta"}],"clicar":{"role":"button","nome":"Nova fonte","exato":true}},{"id":"p2","titulo":"Dar um nome","texto":"Dê à fonte um nome que diga qual é o formulário. Aqui, \"Formulário de avaliação postural\". Depois escolha o \"Funil de entrada\", o funil em que o contato vai entrar. O \"Estágio de entrada\" (a etapa do funil) só abre depois do funil. Em \"URL de obrigado\", cole a página de agradecimento do seu site. Ela vale para o formulário pronto do CRM. Preencha agora: depois de criada, a fonte não deixa mudar esse endereço.","dica":"Se for usar o formulário pronto e deixar a URL de obrigado vazia, quem enviar verá uma página com texto técnico. O exemplo em cinza dentro do campo é só um modelo e some quando você digita.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova fonte","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog","nome":"Nova fonte de captação"}},{"acao":"fill","alvo":{"rotulo":"Nome","exato":true},"valor":"Formulário de avaliação postural"}],"destaques":[{"alvo":{"rotulo":"Nome","exato":true},"rotulo":"Nome do formulário","tipo":"caixa"},{"alvo":{"css":"div.space-y-2:has(> label:text-is('Funil de entrada')) button[role=combobox]"},"rotulo":"Funil de entrada","tipo":"caixa"},{"alvo":{"css":"div.space-y-2:has(> label:text-is('Estágio de entrada')) button[role=combobox]"},"rotulo":"Abre depois do funil","tipo":"caixa"},{"alvo":{"rotulo":"URL de obrigado (opcional)","exato":true},"rotulo":"Página depois do envio","tipo":"caixa"}],"clicar":{"css":"div.space-y-2:has(> label:text-is('Funil de entrada')) button[role=combobox]"}},{"id":"p3","titulo":"Escolher o funil","texto":"A lista mostra os funis da sua empresa. Nesta clínica de exemplo há um só, \"Pacientes\". Clique nele.","antes":[{"acao":"click","alvo":{"css":"div.space-y-2:has(> label:text-is('Funil de entrada')) button[role=combobox]"}}],"destaques":[{"alvo":{"role":"option","nome":"Pacientes","exato":true},"rotulo":"O funil dos pacientes","tipo":"caixa"}],"clicar":{"role":"option","nome":"Pacientes","exato":true}},{"id":"p4","titulo":"Escolher a etapa","texto":"Agora, em \"Estágio de entrada\", escolha a etapa do funil em que o contato entra. Quem preenche um formulário em geral ainda está no começo, então \"Primeiro contato\" costuma ser a escolha certa.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Pacientes","exato":true}},{"acao":"click","alvo":{"css":"div.space-y-2:has(> label:text-is('Estágio de entrada')) button[role=combobox]"}}],"destaques":[{"alvo":{"role":"option","nome":"Primeiro contato","exato":true},"rotulo":"Onde o contato entra","tipo":"caixa"}],"clicar":{"role":"option","nome":"Primeiro contato","exato":true}},{"id":"p5","titulo":"Criar a fonte","texto":"Confira o funil e o estágio e clique em \"Criar fonte\". Se esquecer um dos dois, a tela avisa e não cria. Capriche nessa escolha: depois de criada, a fonte não deixa trocar o funil nem o estágio.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Primeiro contato","exato":true}}],"destaques":[{"alvo":{"css":"div.space-y-2:has(> label:text-is('Funil de entrada')) button[role=combobox]"},"rotulo":"Funil escolhido","tipo":"caixa"},{"alvo":{"css":"div.space-y-2:has(> label:text-is('Estágio de entrada')) button[role=combobox]"},"rotulo":"Estágio escolhido","tipo":"caixa"},{"alvo":{"css":"div:has(> button:text-is('Cancelar')):has(> button:text-is('Criar fonte'))"},"rotulo":"Criar","tipo":"caixa"}],"clicar":{"role":"button","nome":"Criar fonte","exato":true}},{"id":"p6","titulo":"A fonte pronta","texto":"A fonte nasce ativa, e o painel dela abre sozinho. O endereço no alto já está pronto para usar: cada envio com nome, telefone ou e-mail vira um contato no funil Pacientes, na etapa Primeiro contato. As chaves técnicas logo abaixo do endereço podem ficar desligadas. A próxima lição mostra como colocar esse endereço no seu site.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar fonte","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog","nome":"Formulário de avaliação postural"}}],"destaques":[{"alvo":{"css":"div.flex.items-center.gap-2:has(> div.min-w-0 > button[aria-label='Editar nome da fonte'])"},"rotulo":"Já nasce ativa","tipo":"caixa"},{"alvo":{"css":"section:has(> p:text-is('Endereço da fonte'))"},"rotulo":"O endereço para o seu site","tipo":"caixa"}]}]},{"id":"ligar-ao-site","titulo":"Ligar a fonte ao seu site","objetivo":"Colocar o formulário no seu site, ajustar as perguntas, testar se funciona e saber pausar ou proteger a fonte.","papel":"admin","busca":["colar formulário no site","endereço do webhook","elementor","wordpress","testar formulário","lead de teste","perguntas do formulário"],"passos":[{"id":"p1","titulo":"O endereço da fonte","texto":"Abra a fonte do formulário que você quer ligar. O endereço da fonte é para onde o seu formulário manda os dados. Muitos construtores de site têm um campo para colar esse endereço. O botão ao lado copia o endereço inteiro. No seu CRM, o endereço começa com o endereço da sua instalação.","rota":"/app/webhooks","antes":[{"acao":"click","alvo":{"texto":"Formulário do site — Avaliação nutricional","exato":true}},{"acao":"aguardar","alvo":{"texto":"Endereço da fonte","exato":true}}],"destaques":[{"alvo":{"css":"code.truncate"},"rotulo":"Endereço da fonte","tipo":"caixa"},{"alvo":{"css":"section:has(> p:text-is('Endereço da fonte')) button"},"rotulo":"Copiar","tipo":"seta"}]},{"id":"p2","titulo":"Perguntas extras do formulário","texto":"Além de nome, WhatsApp e e-mail, o formulário pode ter perguntas suas. Esta fonte já pergunta \"Qual é o seu objetivo?\", com uma lista de opções. \"+ Adicionar pergunta\" cria outra: você escreve a pergunta e escolhe o tipo de resposta (texto curto, texto longo, número, moeda, lista de opções ou caixa de seleção). \"Remover\" tira a pergunta. O botão \"Salvar perguntas\" só fica disponível depois que você muda alguma coisa. As respostas ficam guardadas no lead.","dica":"\"Resposta obrigatória\" faz o formulário pronto não deixar enviar sem essa resposta. \"Chave enviada ao CRM\" é o nome interno do campo: pode deixar o que aparece.","antes":[{"acao":"rolar","alvo":{"role":"button","nome":"+ Adicionar pergunta","exato":true}}],"destaques":[{"alvo":{"css":"div.space-y-3.rounded-sm:has-text('Pergunta 1')"},"rotulo":"Uma pergunta sua","tipo":"caixa"},{"alvo":{"role":"button","nome":"+ Adicionar pergunta","exato":true},"rotulo":"Mais uma pergunta","tipo":"seta"},{"alvo":{"role":"button","nome":"Salvar perguntas","exato":true},"rotulo":"Salvar","tipo":"seta"}]},{"id":"p3","titulo":"O formulário pronto","texto":"Se o seu site não tem formulário, use o pronto. \"Copiar formulário\" copia o código, já com as suas perguntas e apontando para o endereço certo. Cole esse código numa área de código do seu site, ou entregue a quem cuida dele. Para quem enviar ver uma página de agradecimento, a fonte precisa ter sido criada com a \"URL de obrigado\" preenchida.","antes":[{"acao":"rolar","alvo":{"role":"button","nome":"Copiar formulário","exato":true}}],"destaques":[{"alvo":{"css":"textarea[readonly]"},"rotulo":"O código do formulário","tipo":"caixa"},{"alvo":{"role":"button","nome":"Copiar formulário","exato":true},"rotulo":"Copiar","tipo":"seta"}]},{"id":"p4","titulo":"Passo a passo para o seu caso","texto":"Clique em \"Como conectar no seu caso\" para ver onde colar o endereço nas ferramentas mais usadas: Elementor Pro, JetFormBuilder, WordPress, Zapier ou n8n, e \"Formulário próprio\", que é o código pronto do passo anterior. Logo abaixo, \"Para desenvolvedores\" traz um exemplo técnico para quem programa.","antes":[{"acao":"click","alvo":{"texto":"Como conectar no seu caso","exato":true}},{"acao":"rolar","alvo":{"texto":"Para desenvolvedores","exato":true}}],"destaques":[{"alvo":{"css":"details[open]"},"rotulo":"Onde colar em cada ferramenta","tipo":"caixa"}]},{"id":"p5","titulo":"Testar a fonte","texto":"Para ter certeza de que está tudo certo, clique em \"Enviar lead de teste\". Um contato chamado \"Lead de Teste\" entra no funil, na etapa da fonte. Quando dá certo, aparece o link \"Ver no Kanban\", e o envio aparece em \"Últimos recebimentos\". Atenção: o teste é um contato de verdade. Se você tiver automações para quando entra um contato novo, como uma mensagem de boas-vindas, elas também rodam para ele.","dica":"Depois do teste, apague o card \"Lead de Teste\" do funil e o contato dele em Contatos, para ele não se misturar com os pacientes de verdade.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Enviar lead de teste","exato":true}},{"acao":"aguardar","alvo":{"role":"link","nome":"Ver no Kanban","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Enviar lead de teste","exato":true},"rotulo":"Testar","tipo":"seta"},{"alvo":{"role":"link","nome":"Ver no Kanban","exato":true},"rotulo":"Deu certo: veja no funil","tipo":"caixa"}]},{"id":"p6","titulo":"Últimos recebimentos","texto":"Em \"Últimos recebimentos\" fica cada envio que chegou por esta fonte, do mais novo para o mais antigo. O primeiro é o teste que você acabou de fazer. A bolinha verde quer dizer só que o envio chegou; a vermelha, que a assinatura não conferiu. Para saber se o envio virou lead, veja a aba \"Leads recebidos\". A lista se atualiza sozinha a cada 5 segundos enquanto o painel está aberto.","antes":[{"acao":"esperar","ms":1500}],"destaques":[{"alvo":{"css":"section:has(> p:text-is('Últimos recebimentos'))"},"rotulo":"O que chegou por esta fonte","tipo":"caixa"}]},{"id":"p7","titulo":"Pausar ou excluir","texto":"Para parar de receber contatos por um tempo, desligue \"Fonte ativa\": aparece o aviso \"Fonte pausada.\", o formulário passa a ser recusado e nada entra no funil. Ao fechar o painel, o cartão da fonte mostra \"Pausada\". Ligue de novo quando quiser. \"Excluir fonte\" desliga o endereço para sempre. Os contatos que já chegaram continuam no funil.","dica":"Acima fica a \"Assinatura (HMAC)\". Ela é só para quem tem um programador ligando outro sistema: protege o endereço para que só esse sistema consiga mandar contatos. Não ligue se você usa o formulário pronto ou um construtor de site: eles não sabem assinar, e todos os envios passam a ser recusados. Com ela ligada, o botão de teste também fica desligado.","antes":[{"acao":"rolar","alvo":{"role":"button","nome":"Excluir fonte","exato":true}}],"destaques":[{"alvo":{"css":"section:has(p:text-is('Fonte ativa'))"},"rotulo":"Ligar e pausar","tipo":"caixa"},{"alvo":{"role":"button","nome":"Excluir fonte","exato":true},"rotulo":"Excluir de vez","tipo":"seta"}]}]},{"id":"leads-recebidos","titulo":"Ver quem preencheu seus formulários","objetivo":"Encontrar cada envio dos formulários, saber se ele virou lead e entender por que um envio não entrou.","papel":"admin","busca":["leads recebidos","quem preencheu o formulário","formulário não chegou","lead não entrou","origem do lead","utm campanha"],"passos":[{"id":"p1","titulo":"Tudo o que chegou","texto":"A aba \"Leads recebidos\" lista cada envio dos seus formulários, do mais novo para o mais antigo: quem é, o contato, por qual fonte chegou, o dia e a hora, a página de origem e o resultado. \"Virou lead\" quer dizer que entrou no funil. \"Reenvio\" é quando o sistema que envia manda de novo o mesmo envio, com o mesmo código de identificação: ele não cria outro lead. Se a mesma pessoa preencher o formulário duas vezes, cada envio vira um lead. \"Não entrou\" quer dizer que o envio foi recusado.","dica":"Existe também \"Card atualizado\": aparece só em fontes com assinatura em que você ligou a opção de atualizar o card, quando o envio muda um card que já existia.","rota":"/app/webhooks?aba=leads","antes":[],"destaques":[{"alvo":{"role":"table"},"rotulo":"Envios dos formulários","tipo":"caixa"},{"alvo":{"texto":"Reenvio","exato":true},"rotulo":"Envio repetido pelo sistema","tipo":"caixa"},{"alvo":{"texto":"Não entrou","exato":true},"rotulo":"Envio recusado","tipo":"caixa"}]},{"id":"p2","titulo":"Procurar e filtrar","texto":"No alto ficam os filtros. Digite um nome, telefone ou e-mail e aperte Enter (ou clique na lupa). Também dá para ver só uma fonte, só um resultado ou um período, com \"De\" e \"Até\". Vamos ver só os envios que não entraram: clique em \"Resultado\".","antes":[],"destaques":[{"alvo":{"rotulo":"Nome, telefone ou e-mail","exato":true},"rotulo":"Buscar pessoa","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Filtrar por fonte","exato":true},"rotulo":"Fonte","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Filtrar por resultado","exato":true},"rotulo":"Resultado","tipo":"caixa"},{"alvo":{"rotulo":"De","exato":true},"rotulo":"Início do período","tipo":"caixa"},{"alvo":{"rotulo":"Até","exato":true},"rotulo":"Fim do período","tipo":"caixa"}],"clicar":{"role":"combobox","nome":"Filtrar por resultado","exato":true}},{"id":"p3","titulo":"Só os que não entraram","texto":"Com \"Não entrou\" escolhido, a lista mostra só os envios recusados. Este não tem nome: a tabela mostra \"(sem identificação)\". Clique nele para ver o motivo.","antes":[{"acao":"click","alvo":{"role":"combobox","nome":"Filtrar por resultado","exato":true}},{"acao":"click","alvo":{"role":"option","nome":"Não entrou","exato":true}},{"acao":"aguardar","alvo":{"role":"button","nome":"(sem identificação)","exato":true}}],"destaques":[{"alvo":{"role":"combobox","nome":"Filtrar por resultado","exato":true},"rotulo":"Filtro ligado","tipo":"caixa"},{"alvo":{"role":"button","nome":"(sem identificação)","exato":true},"rotulo":"Envio sem nome","tipo":"seta"}],"clicar":{"role":"button","nome":"(sem identificação)","exato":true}},{"id":"p4","titulo":"Por que não entrou","texto":"O painel abre com o motivo em vermelho. Aqui o formulário não mandou nome, telefone nem e-mail que o CRM reconhecesse. Logo abaixo, em \"O que o formulário trouxe\", você vê os nomes que o formulário usou nos campos. Com isso, quem cuida do site sabe o que corrigir.","antes":[{"acao":"click","alvo":{"role":"button","nome":"(sem identificação)","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"texto":"^O envio não trazia nome","regex":true},"rotulo":"O motivo","tipo":"caixa"},{"alvo":{"css":"section:has(h3:has-text('O que o formulário trouxe'))"},"rotulo":"O que chegou","tipo":"caixa"}]},{"id":"p5","titulo":"Um envio que virou lead","texto":"Agora um envio que deu certo, o da Larissa Mendes. Em \"O que o formulário trouxe\" aparecem nome, telefone, e-mail e a resposta da pergunta extra. O botão \"Cadastrar como campo do lead\" transforma essa resposta num campo do funil, que passa a aparecer no card do lead.","rota":"/app/webhooks?aba=leads","antes":[{"acao":"click","alvo":{"role":"button","nome":"Larissa Mendes","exato":true,"dentro":{"css":"tr:has-text('Virou lead'):has-text('Larissa Mendes')"}}},{"acao":"aguardar","alvo":{"role":"dialog"}}],"destaques":[{"alvo":{"css":"section:has(h3:has-text('O que o formulário trouxe'))"},"rotulo":"O que a Larissa enviou","tipo":"caixa"},{"alvo":{"role":"button","nome":"Cadastrar como campo do lead","exato":true},"rotulo":"Guardar como campo do lead","tipo":"seta"}]},{"id":"p6","titulo":"De onde veio e onde está","texto":"Em \"De onde veio\" aparecem a página do formulário, o endereço de internet (IP) e o navegador de quem enviou. As linhas com \"utm\" dizem de qual anúncio ou campanha a pessoa veio, quando o seu link tem essa marcação. Aqui, do Instagram, campanha \"avaliacao-outubro\". O botão \"Ver o lead no funil\" abre o lead que esse envio criou.","antes":[{"acao":"rolar","alvo":{"role":"link","nome":"Ver o lead no funil","exato":true}}],"destaques":[{"alvo":{"css":"section:has(h3:has-text('De onde veio'))"},"rotulo":"Página e campanha","tipo":"caixa"},{"alvo":{"role":"link","nome":"Ver o lead no funil","exato":true},"rotulo":"Abrir o lead","tipo":"seta"}]}]},{"id":"avisar-outro-sistema","titulo":"Avisar outro sistema quando algo acontece","objetivo":"Montar uma automação que manda um aviso para outro sistema (planilha, financeiro, laboratório) quando algo acontece no CRM.","papel":"admin","busca":["avisar outro sistema","enviar dados para outro sistema","webhook de saída","integrar com planilha","automação","quando fechar negócio avisar"],"passos":[{"id":"p1","titulo":"Suas automações","texto":"A aba \"Automações\" mostra as regras da sua empresa. Cada cartão traz o nome, a situação (\"Ativa\" ou \"Pausada\"), quando ela age e quantas ações faz. A chave liga e pausa a regra. Os ícones à direita abrem a regra no designer (um desenho do caminho), editam e excluem. No alto, \"Montar no designer\" cria uma regra nova direto no designer. Esta regra avisa o sistema do financeiro sempre que um paciente fecha.","rota":"/app/webhooks?aba=automacoes","antes":[],"destaques":[{"alvo":{"css":"div.rounded-lg:has-text('Avisar o financeiro quando o paciente fechar')"},"rotulo":"Uma automação","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Pausar Avisar o financeiro quando o paciente fechar","exato":true},"rotulo":"Ligar e pausar","tipo":"seta"},{"alvo":{"role":"button","nome":"Nova automação","exato":true},"rotulo":"Criar uma regra","tipo":"caixa"},{"alvo":{"role":"link","nome":"Montar no designer","exato":true},"rotulo":"Regra nova no designer","tipo":"caixa"}],"clicar":{"role":"button","nome":"Nova automação","exato":true}},{"id":"p2","titulo":"Nome e momento","texto":"Toda automação tem três partes: QUANDO (o que acontece), SE (uma condição, se quiser) e ENTÃO (o que fazer). Dê um nome que diga o que ela faz. Depois escolha o QUANDO: clique em \"Escolha o gatilho\".","antes":[{"acao":"click","alvo":{"role":"button","nome":"Nova automação","exato":true}},{"acao":"aguardar","alvo":{"role":"dialog","nome":"Nova automação"}},{"acao":"fill","alvo":{"rotulo":"Nome da automação","exato":true},"valor":"Avisar o laboratório de horário marcado"}],"destaques":[{"alvo":{"rotulo":"Nome da automação","exato":true},"rotulo":"Nome da regra","tipo":"caixa"},{"alvo":{"css":"section:has(> h3:text-is('QUANDO')) > button[role=combobox]"},"rotulo":"QUANDO","tipo":"caixa"}],"clicar":{"css":"section:has(> h3:text-is('QUANDO')) > button[role=combobox]"}},{"id":"p3","titulo":"Quando ela age","texto":"A lista traz tudo o que pode disparar uma automação: um contato novo, um lead que muda de etapa, um negócio ganho ou perdido, uma mensagem que chega, um horário marcado ou cancelado, e outros. Para avisar o laboratório, escolha \"Quando um horário for marcado\".","antes":[{"acao":"click","alvo":{"css":"section:has(> h3:text-is('QUANDO')) > button[role=combobox]"}},{"acao":"hover","alvo":{"role":"option","nome":"Quando um horário for marcado","exato":true}}],"destaques":[{"alvo":{"role":"option","nome":"Quando um horário for marcado","exato":true},"rotulo":"Horário marcado","tipo":"caixa"}],"clicar":{"role":"option","nome":"Quando um horário for marcado","exato":true}},{"id":"p4","titulo":"Condição e ação","texto":"A parte SE é opcional. Com \"Adicionar condição\" você limita a regra, por exemplo, a um tipo de atendimento. Para avisar sempre, deixe vazio. Na parte ENTÃO, clique em \"Adicionar ação\" para escolher o que a automação faz.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Quando um horário for marcado","exato":true}}],"destaques":[{"alvo":{"role":"button","nome":"Adicionar condição","exato":true},"rotulo":"SE (opcional)","tipo":"caixa"},{"alvo":{"css":"section:has(> h3:text-is('ENTÃO')) > button[role=combobox]"},"rotulo":"ENTÃO","tipo":"caixa"}],"clicar":{"css":"section:has(> h3:text-is('ENTÃO')) > button[role=combobox]"}},{"id":"p5","titulo":"Escolher \"Avisar outro sistema\"","texto":"Entre as ações, \"Avisar outro sistema (webhook)\" é a que manda os dados do que aconteceu para o endereço de outro sistema. Esse outro sistema precisa ter um endereço próprio para receber avisos. É assim que o CRM conversa com um sistema de gestão ou com ferramentas como Zapier e n8n, que podem levar o aviso adiante, por exemplo para uma planilha.","antes":[{"acao":"click","alvo":{"css":"section:has(> h3:text-is('ENTÃO')) > button[role=combobox]"}},{"acao":"hover","alvo":{"role":"option","nome":"Avisar outro sistema (webhook)","exato":true}}],"destaques":[{"alvo":{"role":"option","nome":"Avisar outro sistema (webhook)","exato":true},"rotulo":"Avisar outro sistema","tipo":"caixa"}],"clicar":{"role":"option","nome":"Avisar outro sistema (webhook)","exato":true}},{"id":"p6","titulo":"O endereço do outro sistema","texto":"Cole em \"Endereço (URL)\" o endereço que o outro sistema te deu para receber avisos. O \"Segredo (opcional)\" serve para o outro sistema conferir que o aviso veio mesmo do seu CRM. Só preencha se quem cuida dele pedir; o texto cinza é só um exemplo. \"Incluir o responsável no corpo\" fica desligado: ligue só se o outro sistema precisar saber quem da equipe atende o cliente.","dica":"Embaixo, \"Adicionar ação\" soma outra ação à mesma regra.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Avisar outro sistema (webhook)","exato":true}},{"acao":"fill","alvo":{"placeholder":"https://meusistema.com/webhook","exato":true},"valor":"https://laboratorio.bemviver.example/agendamentos"}],"destaques":[{"alvo":{"placeholder":"https://meusistema.com/webhook","exato":true},"rotulo":"Endereço do outro sistema","tipo":"caixa"},{"alvo":{"placeholder":"uma senha só sua","exato":true},"rotulo":"Segredo (opcional)","tipo":"caixa"},{"alvo":{"css":"div.rounded-md.border:has-text('Incluir o responsável no corpo')"},"rotulo":"Quem atende (desligado)","tipo":"caixa"}]},{"id":"p7","titulo":"Criar a automação","texto":"Clique em \"Criar automação\". Ela nasce pausada, para você revisar antes, e aparece na lista com o selo \"Pausada\" e a chave desligada. Quando tiver revisado, ligue a chave: a partir daí, cada horário marcado manda um aviso para o endereço do laboratório. Na aba \"Atividade\" você confere se ele chegou.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Criar automação","exato":true}},{"acao":"aguardar","alvo":{"role":"switch","nome":"Ligar Avisar o laboratório de horário marcado","exato":true}}],"destaques":[{"alvo":{"css":"div.rounded-lg:has-text('Avisar o laboratório de horário marcado')"},"rotulo":"A automação nova, pausada","tipo":"caixa"},{"alvo":{"role":"switch","nome":"Ligar Avisar o laboratório de horário marcado","exato":true},"rotulo":"Ligar quando estiver pronta","tipo":"seta"}]}]},{"id":"conferir-avisos","titulo":"Conferir se o aviso chegou","objetivo":"Ver na aba Atividade se cada automação funcionou e o que fazer quando um aviso não chega.","papel":"admin","busca":["atividade das automações","aviso não chegou","webhook falhou","reenviar aviso","histórico de automações","erro 404"],"passos":[{"id":"p1","titulo":"O que cada automação fez","texto":"A aba \"Atividade\" mostra cada vez que uma automação agiu, da mais recente para a mais antiga. Cada cartão traz o nome da regra, há quanto tempo foi e o resultado. \"Sucesso\" quer dizer que todas as ações da regra deram certo; num aviso, que o outro sistema respondeu que recebeu. \"Falhou\" quer dizer que nenhuma ação deu certo; num aviso, que o outro sistema não aceitou ou não respondeu.","dica":"Pode aparecer também \"Parcial\", quando só algumas ações deram certo, e \"Aguardando envio\", quando uma mensagem espera para sair.","rota":"/app/webhooks?aba=atividade","antes":[],"destaques":[{"alvo":{"texto":"Sucesso","exato":true},"rotulo":"Tudo deu certo","tipo":"caixa"},{"alvo":{"texto":"Falhou","exato":true},"rotulo":"Nada deu certo","tipo":"caixa"}]},{"id":"p2","titulo":"Quando o aviso falha","texto":"Embaixo da ação que falhou aparece o que o outro sistema respondeu. Aqui é \"http_404\": o endereço não foi encontrado do outro lado. Em geral é endereço digitado errado ou que mudou. Confira o endereço na automação (o lápis do cartão, na aba Automações). Depois volte aqui e clique em \"Reenviar\": o mesmo aviso sai de novo e um cartão novo mostra o resultado.","antes":[],"destaques":[{"alvo":{"texto":"http_404","exato":true},"rotulo":"O que o outro sistema respondeu","tipo":"caixa"},{"alvo":{"role":"button","nome":"Reenviar","exato":true},"rotulo":"Mandar de novo","tipo":"seta"}]},{"id":"p3","titulo":"Ver as novidades","texto":"Se algo acabou de acontecer e ainda não aparece na lista, clique em \"Atualizar\" para buscar as execuções mais novas.","antes":[],"destaques":[{"alvo":{"role":"button","nome":"Atualizar","exato":true},"rotulo":"Buscar as mais novas","tipo":"seta"}]}]}]},{"id":"desempenho","titulo":"Desempenho","tela":"/app/metrics","resumo":"Os números do atendimento e das vendas dos últimos 30 dias: o que o resultado custou, por que se perdeu, quanto deve entrar e como cada pessoa da equipe está indo.","licoes":[{"id":"conhecendo-o-desempenho","titulo":"Conhecendo a tela de Desempenho","objetivo":"Saber o que a tela de Desempenho mostra, de que período são os números e como cada cartão se lê.","papel":"admin","busca":["desempenho","métricas","relatório","números do atendimento","resultados das vendas","painel","indicadores","últimos 30 dias"],"passos":[{"id":"p1","titulo":"Onde ficam os números","texto":"A tela Desempenho junta os números do atendimento e das vendas da clínica. Você chega a ela pelo menu, em \"Desempenho\", no grupo Análise. A maior parte dos números olha para os últimos 30 dias, contados até agora, e não há como escolher outro período nesta tela. O Funil e a Previsão são a exceção: eles mostram os negócios que estão abertos agora. O campo \"Atendente\" mostra parte dos blocos só para uma pessoa da equipe; ele aparece numa lição mais adiante.","dica":"Role a tela para baixo: os blocos aparecem nesta ordem: Atrito, Perdas, Previsão, Funil, Performance por atendente, Por canal e Ganhos por período.","rota":"/app/metrics","antes":[],"destaques":[{"alvo":{"css":"header:has(h1)"},"rotulo":"Desempenho: quase tudo dos últimos 30 dias","tipo":"caixa"},{"alvo":{"css":"button[role=combobox]:has-text('Todos os atendentes')"},"rotulo":"Filtro por atendente","tipo":"caixa"},{"alvo":{"role":"link","nome":"Desempenho","exato":true,"dentro":{"role":"navigation","nome":"Navegação principal"}},"rotulo":"No menu, em Análise","tipo":"seta"}]},{"id":"p2","titulo":"O bloco Atrito","texto":"O primeiro bloco, \"Atrito\", mostra o que o resultado custou para o cliente e para a equipe. A frase de cima diz em que base os números foram medidos: quantas demandas foram encerradas nos últimos 30 dias e quantas ainda estão abertas. Uma demanda é um pedido de um cliente, do começo ao fim do atendimento. Logo abaixo fica a régua que diz depois de quantas horas sem resposta uma conversa conta como perdida; ela tem uma lição própria.","antes":[],"destaques":[{"alvo":{"texto":"O que o resultado custou para os dois lados."},"rotulo":"A base dos números","tipo":"caixa"},{"alvo":{"css":"div.flex-wrap:has(> input[aria-label^='Horas de silêncio'])"},"rotulo":"Régua do silêncio","tipo":"caixa"}]},{"id":"p3","titulo":"Como ler um cartão","texto":"O Atrito tem quatro cartões: Conversão, Automação, Custo humano e Contenção. Todos se leem do mesmo jeito. À esquerda, em letra grande, fica o resultado (aqui, \"Negócios ganhos\": quantos negócios foram ganhos nos últimos 30 dias). À direita, em \"O que isso custou\", ficam as medidas do preço desse resultado. Os dois lados ficam juntos de propósito: um número bom só vale se o custo dele também estiver bom.","antes":[],"destaques":[{"alvo":{"css":"section div[class*='sm:w-48']","n":0},"rotulo":"O resultado","tipo":"caixa"},{"alvo":{"css":"section div.min-w-0.flex-1.border-t","n":0},"rotulo":"O custo desse resultado","tipo":"caixa"}]}]},{"id":"atrito-cartao-a-cartao","titulo":"Atrito: os quatro cartões","objetivo":"Entender o que mede cada cartão do Atrito e o que quer dizer o traço no lugar de um número.","papel":"admin","busca":["atrito","conversão","automação","custo humano","contenção","cliente sumiu","o que significa o traço","tempo de espera"],"passos":[{"id":"p1","titulo":"Conversão","texto":"O cartão Conversão põe os negócios ganhos ao lado do esforço que o cliente teve. \"Turnos até o desfecho (mediana)\" mostra quantas mensagens, somando os dois lados, um atendimento típico trocou até ser encerrado. As duas linhas de \"Insistência\" contam quantas vezes o agente voltou a procurar o cliente por conta própria; elas só são medidas nos atendimentos que viraram um caso do agente, e aqui aparecem com \"—\" porque não houve nenhum. \"Descadastros no período\" conta quem pediu para não receber mais mensagens. \"Conversas que morreram no silêncio\" mostra, das conversas em que a clínica falou, quantas acabaram com a clínica falando por último, o cliente sem responder há mais de 72 horas e ninguém encerrando.","rota":"/app/metrics","antes":[],"destaques":[{"alvo":{"css":"section div.rounded-lg.border:has-text('Negócios ganhos')"},"rotulo":"Conversão","tipo":"caixa"},{"alvo":{"texto":"Turnos até o desfecho (mediana)","exato":true},"rotulo":"Mensagens até o fim","tipo":"caixa"},{"alvo":{"texto":"Conversas que morreram no silêncio (após 72h)","exato":true},"rotulo":"Cliente que sumiu","tipo":"caixa"}]},{"id":"p2","titulo":"Automação","texto":"O cartão Automação mostra quanto o agente de IA respondeu sozinho. \"Respostas dadas pelo agente\" é a parte das respostas aos clientes que foi escrita pelo agente; as mensagens de automação não entram nessa conta. Do lado do custo: \"Passagens para humano\" conta as vezes em que o agente passou para uma pessoa o atendimento de um cliente que tem negócio no funil. \"Respostas humanas fora do sistema\" mostra, em porcentagem, quanto das respostas da equipe saiu pelo celular, fora do Deskcomm. \"Clientes que repetiram depois da passagem\" mostra, entre os atendimentos passados para uma pessoa, em quantos o cliente teve de repetir o que já tinha dito. \"Perguntas que a pessoa teve de repetir\" mostra, também em porcentagem, quantas vezes o cliente mandou de novo quase a mesma frase depois de receber uma resposta.","antes":[{"acao":"rolar","alvo":{"texto":"Perguntas que a pessoa teve de repetir","exato":true}}],"destaques":[{"alvo":{"texto":"Respostas dadas pelo agente","exato":true},"rotulo":"Parte respondida pelo agente","tipo":"caixa"},{"alvo":{"texto":"Respostas humanas fora do sistema","exato":true},"rotulo":"Respondido pelo celular","tipo":"caixa"},{"alvo":{"texto":"Perguntas que a pessoa teve de repetir","exato":true},"rotulo":"Pergunta repetida","tipo":"caixa"}]},{"id":"p3","titulo":"Custo humano","texto":"O cartão Custo humano mostra o trabalho da equipe. O número grande é o total de demandas encerradas no período. \"Espera na fila humana\" mede quanto o cliente esperou até alguém da equipe agir, nos atendimentos que o agente passou adiante; aqui aparece \"—\" porque não houve nenhum no período. As linhas vizinhas medem quantas vezes a equipe precisou entrar em cada demanda, a espera dos casos mais demorados (p90) e quantas demandas precisaram subir para alguém de nível acima. \"Demandas abertas sem próximo passo\" conta os atendimentos abertos em que nada está marcado para acontecer: é alguém esperando sem que ninguém tenha combinado o que vem depois. A última linha mostra, em porcentagem, quantas falas do cliente esperaram mais de 4 horas pela primeira resposta.","antes":[{"acao":"rolar","alvo":{"texto":"^Esperas sem nenhuma resposta por mais de","regex":true}}],"destaques":[{"alvo":{"texto":"Demandas encerradas","exato":true},"rotulo":"Atendimentos encerrados","tipo":"caixa"},{"alvo":{"texto":"Espera na fila humana (mediana)","exato":true},"rotulo":"Espera por uma pessoa","tipo":"seta"},{"alvo":{"texto":"Demandas abertas sem próximo passo","exato":true},"rotulo":"Sem próximo passo","tipo":"caixa"},{"alvo":{"texto":"^Esperas sem nenhuma resposta por mais de","regex":true},"rotulo":"Cliente sem resposta","tipo":"caixa"}]},{"id":"p4","titulo":"Contenção e o traço","texto":"O cartão Contenção conta as mensagens que saíram sem uma pessoa escrever. \"Mensagens enviadas pelo agente\" são as do agente de IA. À direita, em \"O que isso custou\", \"Vetos por execução\" mostra, em média, quantas vezes o sistema segurou uma mensagem do agente antes de ela sair. Logo abaixo aparecem as enviadas por automação (regras, follow-up e lembretes da agenda) e por integração com outro sistema, contadas à parte para não se misturarem com as do agente. Quando um número aparece como \"—\", não houve dado suficiente para medir: o traço não quer dizer zero.","antes":[{"acao":"rolar","alvo":{"texto":"^\"—\" significa","regex":true}}],"destaques":[{"alvo":{"texto":"Mensagens enviadas pelo agente","exato":true},"rotulo":"Enviadas pelo agente","tipo":"caixa"},{"alvo":{"texto":"Mensagens enviadas por automação","exato":true},"rotulo":"Enviadas por automação","tipo":"caixa"},{"alvo":{"texto":"^\"—\" significa","regex":true},"rotulo":"Traço = sem dado, não zero","tipo":"caixa"}]}]},{"id":"regua-do-abandono","titulo":"Ajustando quando uma conversa conta como perdida","objetivo":"Mudar o número de horas de silêncio depois do qual uma conversa conta como perdida no Atrito.","papel":"admin","busca":["conversa perdida","cliente não respondeu","horas sem resposta","mudar 72 horas","régua do abandono","silêncio","abandono"],"passos":[{"id":"p1","titulo":"A régua do silêncio","texto":"No alto do Atrito fica a frase \"Contar como perdida no silêncio após 72 horas sem resposta\". É ela que decide quando uma conversa entra na medida \"Conversas que morreram no silêncio\", no cartão Conversão. O aviso \"(padrão do sistema)\" quer dizer que a régua está no valor padrão, 72 horas. Clínicas que costumam esperar menos pelo retorno do paciente podem querer um número menor.","dica":"Só quem é gerente ou administrador muda a régua. Os atendentes veem o mesmo número numa frase só para leitura, sem o campo para editar.","rota":"/app/metrics","antes":[],"destaques":[{"alvo":{"css":"div.flex-wrap:has(> input[aria-label^='Horas de silêncio'])"},"rotulo":"Horas até contar como perdida","tipo":"caixa"},{"alvo":{"texto":"Conversas que morreram no silêncio (após 72h)","exato":true},"rotulo":"A medida que usa a régua","tipo":"caixa"}]},{"id":"p2","titulo":"Digite o novo número","texto":"Clique no campo e troque o número de horas, por exemplo para 48. Assim que o número muda, aparece o botão \"Salvar\" ao lado, e o aviso \"(padrão do sistema)\" sai. O campo aceita um número inteiro de 1 a 2160 horas (90 dias); fora disso, aparece um aviso em vermelho e o botão fica desligado. Clique em \"Salvar\".","antes":[{"acao":"fill","alvo":{"rotulo":"Horas de silêncio até considerar a conversa perdida"},"valor":"48"}],"destaques":[{"alvo":{"css":"div.flex-wrap:has(> input[aria-label^='Horas de silêncio'])"},"rotulo":"Novo número de horas","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Aparece quando você muda o número","tipo":"seta"}],"clicar":{"role":"button","nome":"Salvar","exato":true}},{"id":"p3","titulo":"A medida muda junto","texto":"Depois de salvar, o botão some e a medida do cartão Conversão passa a se chamar \"Conversas que morreram no silêncio (após 48h)\", já contada com a régua nova. Aqui o número não mudou, porque a única conversa perdida já estava em silêncio havia mais de 72 horas. A régua vale para toda a empresa e muda também a leitura dos dias que já passaram. Para voltar ao padrão, digite 72 e salve de novo.","antes":[{"acao":"click","alvo":{"role":"button","nome":"Salvar","exato":true}},{"acao":"aguardar","alvo":{"texto":"Conversas que morreram no silêncio (após 48h)","exato":true}}],"destaques":[{"alvo":{"css":"div.flex-wrap:has(> input[aria-label^='Horas de silêncio'])"},"rotulo":"Régua salva","tipo":"caixa"},{"alvo":{"texto":"Conversas que morreram no silêncio (após 48h)","exato":true},"rotulo":"Contada com a régua nova","tipo":"caixa"}]}]},{"id":"perdas-e-previsao","titulo":"Perdas e previsão","objetivo":"Ver por que e em que etapa os negócios foram perdidos, quanto valiam, e o que a previsão precisa para funcionar.","papel":"admin","busca":["negócios perdidos","motivo da perda","por que perdi","previsão de vendas","quanto vou faturar","chance de fechamento","valor perdido"],"passos":[{"id":"p1","titulo":"Por que os negócios foram perdidos","texto":"O cartão \"Perdas\" lista os negócios perdidos nos últimos 30 dias de três jeitos. \"Por motivo\" usa o motivo escolhido quando o negócio foi marcado como perdido. \"Por categoria\" junta os motivos em grupos: \"Preço\" conta como \"Nós\", \"Sem resposta do cliente\" como \"Ausência\" e \"Cancelado pelo cliente\" como \"Cliente\". \"Por etapa de saída\" mostra em que etapa do funil o negócio estava quando foi perdido. A maior quantidade vem sempre em cima.","dica":"Só gerentes e administradores veem o cartão Perdas.","rota":"/app/metrics","antes":[{"acao":"rolar","alvo":{"texto":"Moedas nunca são somadas entre si: cada balde é o total da própria moeda.","exato":true}}],"destaques":[{"alvo":{"css":"div.space-y-2:has(> h3:text-is('Por motivo'))"},"rotulo":"Por motivo","tipo":"caixa"},{"alvo":{"css":"div.space-y-2:has(> h3:text-is('Por categoria'))"},"rotulo":"Por categoria","tipo":"caixa"},{"alvo":{"css":"div.space-y-2:has(> h3:text-is('Por etapa de saída'))"},"rotulo":"Em que etapa se perdeu","tipo":"caixa"}]},{"id":"p2","titulo":"Quanto se perdeu","texto":"Em \"Valor por moeda\" aparecem quantos negócios foram perdidos e a soma do valor deles. Se a clínica vende em mais de uma moeda, cada uma fica numa linha, sem somar uma com a outra.","antes":[],"destaques":[{"alvo":{"role":"heading","nome":"Valor por moeda","exato":true},"rotulo":"Valor por moeda","tipo":"caixa"},{"alvo":{"texto":"R$ 5.790,00","exato":true},"rotulo":"Valor dos negócios perdidos","tipo":"caixa"}]},{"id":"p3","titulo":"A previsão do funil","texto":"O cartão \"Previsão\" estima quanto deve entrar por mês com os negócios abertos do funil principal, usando a chance de fechamento de cada etapa. Nesta clínica nenhuma etapa tem chance definida, por isso todo o valor em aberto aparece em \"Sem chance definida na etapa — falta calibrar\". Quando as etapas têm chance, aparece uma tabela por mês com o valor \"Ponderado\" (o valor vezes a chance) e o \"Bruto\" (o valor cheio). Negócio sem data prevista de fechamento fica numa linha à parte.","dica":"A chance de cada etapa se define em \"Etapas do funil\" (no menu, em \"Ver tudo em CRM\"), no campo \"Chance de fechamento (0 a 100)\".","antes":[{"acao":"rolar","alvo":{"texto":"^BRL: R\\$","regex":true}}],"destaques":[{"alvo":{"texto":"Chance de fechamento definida em cada etapa do funil.","exato":true},"rotulo":"De onde vem a chance","tipo":"caixa"},{"alvo":{"css":"div.text-sm:has(> p:text-is('Sem chance definida na etapa — falta calibrar'))"},"rotulo":"Falta definir a chance das etapas","tipo":"caixa"}]}]},{"id":"funil-e-equipe","titulo":"Funil e desempenho da equipe","objetivo":"Ler quantos negócios estão abertos em cada etapa, comparar a equipe e ver os números de uma pessoa só.","papel":"admin","busca":["funil","desempenho por atendente","comparar equipe","tempo de resposta","quem vendeu mais","média e mediana","filtrar atendente"],"passos":[{"id":"p1","titulo":"O funil de agora","texto":"O cartão \"Funil\" conta os negócios abertos agora em cada etapa. Ele mostra uma barra para cada etapa de todos os funis da clínica, e o número do título é o total de abertos. Cada barra é proporcional à etapa com mais negócios, e as etapas vazias também aparecem, inclusive as de ganho e de perda, que ficam em zero: um negócio que chega nelas deixa de estar aberto. Os negócios ganhos ou perdidos não entram aqui: este cartão olha para o que ainda está em andamento, e não para os últimos 30 dias.","rota":"/app/metrics","antes":[],"destaques":[{"alvo":{"css":"div.rounded-lg.border.bg-surface:has-text('Funil ·')"},"rotulo":"Negócios abertos por etapa","tipo":"caixa"}]},{"id":"p2","titulo":"Performance por atendente","texto":"A tabela compara as pessoas da equipe nos últimos 30 dias; o \"(você)\" marca quem está usando a tela. \"Ganhos\" e \"Perdidos\" contam os negócios fechados que estavam no nome da pessoa. \"Conversas\" conta as conversas passadas para ela. \"1ª resposta\" é o tempo entre a primeira mensagem do cliente e a primeira resposta escrita por alguém da equipe, nas conversas que estão no nome da pessoa. A média soma todos os tempos; a mediana é o tempo do meio. Na linha da Helena, a média fica bem maior que a mediana: uma única resposta demorada, de horas, puxa a média para cima, e a mediana mostra a resposta típica. Os tempos aparecem em minutos: 120min são 2 horas.","dica":"Negócio levado para outro funil não conta como perdido.","antes":[],"destaques":[{"alvo":{"css":"div.rounded-lg.border.bg-surface:has-text('Performance por atendente')"},"rotulo":"Comparação da equipe","tipo":"caixa"},{"alvo":{"texto":"1ª resposta (média / mediana)","exato":true},"rotulo":"Tempo da 1ª resposta","tipo":"seta"},{"alvo":{"role":"row","nome":"Helena Prado"},"rotulo":"Média alta, mediana baixa","tipo":"caixa"}]},{"id":"p3","titulo":"Escolher uma pessoa","texto":"No alto da tela, o campo \"Atendente\" abre a lista da equipe. Escolha uma pessoa para ver só os números dela. Clique em \"Ana Ribeiro\".","antes":[{"acao":"click","alvo":{"css":"button[role=combobox]:has-text('Todos os atendentes')"}}],"destaques":[{"alvo":{"role":"option","nome":"Ana Ribeiro","exato":true},"rotulo":"Ana Ribeiro","tipo":"caixa"}],"clicar":{"role":"option","nome":"Ana Ribeiro","exato":true}},{"id":"p4","titulo":"Os números de uma pessoa","texto":"Com uma pessoa escolhida, o funil passa a se chamar \"Funil do atendente\" e conta só os negócios abertos no nome dela, e a tabela fica só com a linha dela. O cartão \"Por canal\" também passa a contar só as conversas dela. O Atrito, as Perdas, a Previsão e os Ganhos por período continuam mostrando a clínica inteira. Para voltar, escolha \"Todos os atendentes\".","antes":[{"acao":"click","alvo":{"role":"option","nome":"Ana Ribeiro","exato":true}},{"acao":"rolar","alvo":{"texto":"Performance por atendente","exato":true}}],"destaques":[{"alvo":{"texto":"^Funil do atendente","regex":true},"rotulo":"Só os negócios da Ana","tipo":"caixa"},{"alvo":{"css":"div.rounded-lg.border.bg-surface:has-text('Performance por atendente')"},"rotulo":"Só a linha da Ana","tipo":"caixa"},{"alvo":{"texto":"^Por canal","regex":true},"rotulo":"Só as conversas dela","tipo":"caixa"}]}]},{"id":"canais-e-ganhos","titulo":"Por canal e ganhos por período","objetivo":"Ver o atendimento de cada número de WhatsApp e acompanhar os ganhos por dia, semana ou mês.","papel":"admin","busca":["por canal","número do whatsapp","conversas sem resposta","ganhos por dia","vendas por semana","gráfico de vendas","evolução"],"passos":[{"id":"p1","titulo":"Cada número de WhatsApp","texto":"O cartão \"Por canal\" tem uma linha para cada número de WhatsApp que teve atendimento nos últimos 30 dias; um número parado no período não aparece. \"Conversas\" conta as conversas passadas para alguém da equipe nesse período. \"1ª resposta (média)\" é o tempo médio até a primeira resposta escrita por uma pessoa. \"Sem resposta\" conta, dessas conversas, quantas ainda não tiveram nenhuma resposta de alguém da equipe. Um número arquivado que teve atendimento no período continua aparecendo, marcado \"(arquivado)\".","rota":"/app/metrics","antes":[{"acao":"rolar","alvo":{"texto":"Sem resposta","exato":true}}],"destaques":[{"alvo":{"css":"div.rounded-lg.border.bg-surface:has-text('Por canal ·')"},"rotulo":"Atendimento por número","tipo":"caixa"},{"alvo":{"texto":"Sem resposta","exato":true},"rotulo":"Ainda sem resposta da equipe","tipo":"seta"}]},{"id":"p2","titulo":"Ganhos por período","texto":"O último cartão mostra os negócios ganhos ao longo dos últimos 30 dias. O número do título é o total de ganhos, de toda a clínica. A linha do gráfico passa por cada dia, e os dias sem ganho aparecem com zero, para os vales não sumirem. Mais abaixo, rolando a tela, uma tabela repete os mesmos números, período por período. O campo à direita do título, hoje em \"Dia\", escolhe se os ganhos são juntados por dia, por semana ou por mês; o período continua sendo os últimos 30 dias. Clique nele.","antes":[],"destaques":[{"alvo":{"testid":"ganhos-no-tempo"},"rotulo":"Ganhos de cada dia","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Granularidade","exato":true},"rotulo":"Dia, semana ou mês","tipo":"caixa"}],"clicar":{"role":"combobox","nome":"Granularidade","exato":true}},{"id":"p3","titulo":"Ver por semana","texto":"Escolha \"Semana\" para juntar os ganhos de cada semana num ponto só. Assim fica mais fácil ver se as vendas estão subindo ou caindo, sem o sobe e desce de um dia para o outro. \"Mês\" serve pouco aqui: como a tela olha só 30 dias, ele mostra no máximo dois meses, e os dois incompletos.","antes":[{"acao":"click","alvo":{"role":"combobox","nome":"Granularidade","exato":true}},{"acao":"click","alvo":{"role":"option","nome":"Semana","exato":true}},{"acao":"esperar","ms":2500}],"destaques":[{"alvo":{"testid":"ganhos-no-tempo"},"rotulo":"Ganhos de cada semana","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Granularidade","exato":true},"rotulo":"Agora por semana","tipo":"caixa"}]}]},{"id":"o-que-o-atendente-ve","titulo":"O que um atendente vê","objetivo":"Saber como a tela de Desempenho aparece para quem tem o cargo de atendente.","papel":"agent","busca":["atendente vê","minha performance","meus números","cargo atendente","permissão desempenho","sua performance"],"passos":[{"id":"p1","titulo":"A tela para um atendente","texto":"Esta é a mesma tela, aberta pela Ana Ribeiro, que tem o cargo de atendente. Ela não vê o campo para escolher outra pessoa da equipe, e a régua do silêncio aparece só como uma frase, sem campo para editar. O cartão Perdas também não aparece para quem é atendente.","rota":"/app/metrics","antes":[],"destaques":[{"alvo":{"texto":"Atrito, seu funil e sua performance nos últimos 30 dias.","exato":true},"rotulo":"Texto para o atendente","tipo":"caixa"},{"alvo":{"texto":"^Uma conversa conta como perdida no silêncio após","regex":true},"rotulo":"Régua só para leitura","tipo":"caixa"}]},{"id":"p2","titulo":"Números só dela","texto":"Para quem é atendente, boa parte dos números conta só o que a pessoa pode ver: os negócios e as conversas no nome dela e, no padrão da instalação, os que ainda não têm responsável. Por isso o cartão Conversão mostra os negócios ganhos que a Ana enxerga, e não os da clínica toda, e as conversas que morreram no silêncio são contadas só entre as que ela vê. Já as contagens de demandas (a base no alto do Atrito, \"Demandas encerradas\" e \"Demandas abertas sem próximo passo\") continuam sendo da clínica inteira.","antes":[],"destaques":[{"alvo":{"texto":"Negócios ganhos","exato":true},"rotulo":"Ganhos que a Ana vê","tipo":"caixa"},{"alvo":{"texto":"Conversas que morreram no silêncio (após 72h)","exato":true},"rotulo":"Só as conversas que ela vê","tipo":"caixa"}]},{"id":"p3","titulo":"Sua performance","texto":"Mais abaixo, o funil conta os negócios abertos que a Ana enxerga: os dela e os que estão sem responsável. A tabela se chama \"Sua performance\" e tem uma linha só, a dela: os ganhos, os perdidos, as conversas e o tempo da primeira resposta. Os cartões \"Por canal\" e \"Ganhos por período\" também contam só o que ela enxerga, por isso mostram números menores que os da clínica toda.","antes":[{"acao":"rolar","alvo":{"texto":"Sua performance","exato":true}}],"destaques":[{"alvo":{"texto":"^Funil\\s+·","regex":true},"rotulo":"Negócios que ela enxerga","tipo":"caixa"},{"alvo":{"css":"div.rounded-lg.border.bg-surface:has-text('Sua performance')"},"rotulo":"Só a linha da Ana","tipo":"caixa"}]}]}]},{"id":"meta-ads","titulo":"Meta Ads","tela":"/app/ads/meta","resumo":"Onde você acompanha quanto gastou e quanto custou cada resultado dos anúncios do Facebook e do Instagram, depois de ligar a sua conta de anúncios.","licoes":[{"id":"conhecendo-a-tela","titulo":"Conhecendo a tela de Meta Ads","objetivo":"Achar a tela de Meta Ads, entender de onde vêm os números e reconhecer o que ela mostra antes de a conta de anúncios ser ligada.","papel":"admin","busca":["meta ads","anúncios do facebook","anúncios do instagram","campanhas pagas","quanto gastei em anúncio","custo por resultado","tráfego pago"],"passos":[{"id":"p1","titulo":"Onde fica a tela","texto":"Meta Ads fica no menu da esquerda, no grupo \"Análise\", logo abaixo de \"Desempenho\". É a tela dos anúncios pagos do Facebook e do Instagram: quanto você gastou em cada campanha e quanto custou cada resultado. Só administradores e gerentes veem este item no menu.","dica":"Leia junto com \"Desempenho\": lá você vê o que aconteceu depois que o cliente chegou; aqui, quanto custou trazê-lo.","rota":"/app/ads/meta","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Meta Ads","exato":true,"dentro":{"role":"navigation","nome":"Navegação principal","exato":true}},"rotulo":"Meta Ads no menu","tipo":"seta"},{"alvo":{"role":"heading","nome":"Meta Ads","exato":true,"n":0},"rotulo":"A tela aberta","tipo":"caixa"}]},{"id":"p2","titulo":"Os números vêm na hora","texto":"A frase no alto avisa como a tela funciona: ela não guarda os números. Eles são buscados no Facebook na hora: quando a tela abre, quando você troca a conta ou o período, e quando você clica em \"Atualizar\". Esse botão só aparece depois que a conta de anúncios estiver ligada. Até lá, nada aparece aqui.","antes":[],"destaques":[{"alvo":{"texto":"Os números vêm da plataforma no momento em que você clica em Atualizar"},"rotulo":"Números buscados na hora","tipo":"caixa"}]},{"id":"p3","titulo":"Ainda sem conta ligada","texto":"Numa instalação nova, a tela mostra \"Nenhuma conta de anúncios conectada.\". O botão \"Conectar conta de anúncios\" leva à página onde você cola o acesso da sua conta. Só quem é administrador vê esse botão. Para seguir, clique nele.","dica":"Quem é gerente vê a mesma tela, mas no lugar do botão aparece um pedido para chamar quem administra. Isso está na última lição.","antes":[],"destaques":[{"alvo":{"texto":"Nenhuma conta de anúncios conectada.","exato":true},"rotulo":"Ainda não ligada","tipo":"caixa"},{"alvo":{"role":"link","nome":"Conectar conta de anúncios","exato":true},"rotulo":"Ligar a conta","tipo":"seta"}],"clicar":{"role":"link","nome":"Conectar conta de anúncios","exato":true}}]},{"id":"conectar-a-conta","titulo":"Ligando a sua conta de anúncios","objetivo":"Saber onde e como colar o token de acesso da conta de anúncios, e o que cada campo da página de conexão pede.","papel":"admin","busca":["conectar facebook ads","ligar conta de anúncios","token de acesso meta","onde colo o token","ads_read","conta padrão de anúncios","integrar anúncios"],"passos":[{"id":"p1","titulo":"Pelo caminho das Configurações","texto":"Além do botão da tela de Meta Ads, a página de conexão também abre por \"Configurações\", no rodapé do menu. Ela fica na seção \"Sua empresa\", no cartão \"Meta Ads\". Não confunda com o cartão \"Conversões\": ele serve para outra coisa e pede um token diferente. Clique no cartão \"Meta Ads\", na coluna da direita (não no item \"Meta Ads\" do menu).","rota":"/app/settings","antes":[],"destaques":[{"alvo":{"css":"a[href='/app/settings/meta-ads']"},"rotulo":"Ligar a conta de anúncios","tipo":"seta"}],"clicar":{"css":"a[href='/app/settings/meta-ads']"}},{"id":"p2","titulo":"Uma ligação só para ler","texto":"A frase do alto garante que a ligação é só de leitura: nada é criado, pausado ou alterado na sua conta de anúncios. O quadro azul diz o que você precisa trazer: um token de acesso, que é uma senha especial que o Facebook gera para o sistema poder ler os seus anúncios. Ele é gerado no site Meta for Developers e precisa da permissão \"ads_read\".","dica":"O token fica guardado de forma protegida e nunca é mostrado de volta, nem para você. Atenção: para gerar o token é preciso ter um aplicativo criado no Meta for Developers, e alguns tokens vencem em poucas horas. Se a tela de Meta Ads pedir um token novo pouco depois de ligar, foi isso. Gere um token de longa duração.","antes":[{"acao":"click","alvo":{"css":"a[href='/app/settings/meta-ads']"}},{"acao":"aguardar","alvo":{"rotulo":"Token de acesso","exato":true}}],"destaques":[{"alvo":{"texto":"É uma conexão só de leitura"},"rotulo":"Nada muda na sua conta","tipo":"caixa"},{"alvo":{"texto":"O token precisa da permissão ads_read"},"rotulo":"O que você precisa trazer","tipo":"caixa"}]},{"id":"p3","titulo":"O campo do token","texto":"Cole o token no campo \"Token de acesso\". O \"EAA...\" cinza dentro do campo é só um exemplo de como o token começa: o campo ainda está vazio. Enquanto ele estiver vazio, ou curto demais para ser um token inteiro, o botão \"Salvar\" fica apagado e, ao lado, aparece \"Cole o token para poder salvar.\". Na primeira vez, o token é obrigatório.","antes":[],"destaques":[{"alvo":{"rotulo":"Token de acesso","exato":true},"rotulo":"Cole o token aqui","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Apagado até colar o token","tipo":"seta"},{"alvo":{"texto":"Cole o token para poder salvar.","exato":true},"rotulo":"Por que não dá para salvar","tipo":"caixa"}]},{"id":"p4","titulo":"A conta que abre primeiro","texto":"O campo \"Conta padrão (opcional)\" escolhe qual conta de anúncios a tela de Meta Ads abre primeiro. Escreva \"act_\" seguido dos números da conta, como no exemplo cinza dentro do campo. Se deixar em branco, a tela abre a primeira conta ativa que o token alcançar.","dica":"Se o número não estiver nesse formato, ao salvar aparece \"Confira os campos: algum valor não está no formato esperado.\".","antes":[],"destaques":[{"alvo":{"rotulo":"Conta padrão (opcional)","exato":true},"rotulo":"Opcional: act_ e os números","tipo":"caixa"}]},{"id":"p5","titulo":"Pronto para salvar","texto":"Com o token colado, ele aparece como pontinhos, para ninguém ler por cima do seu ombro, e \"Salvar\" acende. Ao salvar, aparece \"Conexão salva.\" e o campo do token fica vazio de novo, porque o token nunca é mostrado de volta. O sistema não testa o token na hora de salvar: se ele estiver vencido ou sem a permissão \"ads_read\", o aviso aparece na tela de Meta Ads, dizendo o que fazer.","dica":"Depois de ligada, esta página mostra também o botão \"Desconectar\". Ele apaga o token guardado e a tela de Meta Ads volta a pedir uma conexão.","antes":[{"acao":"fill","alvo":{"rotulo":"Token de acesso","exato":true},"valor":"EAAexemploDeTokenDaClinicaBemViver0000"}],"destaques":[{"alvo":{"rotulo":"Token de acesso","exato":true},"rotulo":"Token colado","tipo":"caixa"},{"alvo":{"role":"button","nome":"Salvar","exato":true},"rotulo":"Agora dá para salvar","tipo":"seta"}]}]},{"id":"quem-pode-ver","titulo":"Quem vê e quem liga a conta","objetivo":"Entender o que o gerente vê na tela de Meta Ads e por que só o administrador liga a conta de anúncios.","papel":"manager","busca":["gerente não consegue conectar","sem permissão meta ads","403 sem permissão","quem pode ver anúncios","atendente não vê meta ads","pedir para administrador"],"passos":[{"id":"p1","titulo":"O gerente também vê a tela","texto":"Aqui você está como Carlos Mendes, gerente da clínica. Para ele, \"Meta Ads\" também aparece no menu, no grupo \"Análise\". Os números dos anúncios, como orçamento e custo de cada resultado, são da empresa inteira e não de um atendente só. Por isso só gerentes e administradores veem esta tela.","dica":"Atendentes não veem \"Meta Ads\" no menu.","rota":"/app/ads/meta","antes":[],"destaques":[{"alvo":{"role":"link","nome":"Meta Ads","exato":true,"dentro":{"role":"navigation","nome":"Navegação principal","exato":true}},"rotulo":"Também no menu do gerente","tipo":"seta"}]},{"id":"p2","titulo":"Sem botão para ligar","texto":"Enquanto a conta não está ligada, o gerente não vê o botão \"Conectar conta de anúncios\". No lugar dele aparece o pedido: \"Peça a quem administra a organização para conectar a conta de anúncios em Configurações.\".","antes":[],"destaques":[{"alvo":{"texto":"Peça a quem administra a organização para conectar a conta de anúncios em Configurações.","exato":true},"rotulo":"Chame quem administra","tipo":"caixa"}]},{"id":"p3","titulo":"A página de conexão é do administrador","texto":"O gerente nem vê o cartão \"Meta Ads\" em Configurações. Se ele abrir a página de conexão pelo endereço, aparece \"403 — Sem permissão\". Ligar ou trocar o token é só para o administrador: o token dá acesso à conta de anúncios inteira da empresa, e escolher qual conta ligar é decisão de quem administra. O botão \"Voltar pra Inbox\" leva de volta ao trabalho.","rota":"/app/settings/meta-ads","antes":[],"destaques":[{"alvo":{"role":"heading","nome":"403 — Sem permissão","exato":true},"rotulo":"Só o administrador entra","tipo":"caixa"}]}]}]},{"id":"atividades","titulo":"Atividades","tela":"/app/activities","resumo":"O relatório do que aconteceu no CRM num período: quanto foi a equipe, quanto foram os agentes de IA, quem fez cada coisa e quais assuntos mais ocuparam o atendimento.","licoes":[{"id":"conhecendo-atividades","titulo":"Conhecendo a tela Atividades","objetivo":"Ler o resumo do período: o total de acontecimentos, quanto foi a equipe, os agentes e o automático, e em que dias tudo aconteceu.","papel":"admin","busca":["atividades","relatório","o que aconteceu","o que a equipe fez","histórico da semana","quem fez o quê","produtividade da equipe"],"passos":[{"id":"p1","titulo":"O que esta tela mostra","texto":"A tela Atividades mostra o que aconteceu no seu CRM num período e quem fez cada coisa. Cada acontecimento é algo que ficou registrado num negócio do funil: mudar de etapa, assumir uma conversa, marcar um horário, concluir uma tarefa. A tela abre na aba \"Atividades\", com os \"Últimos 7 dias\". À direita aparece o total de acontecimentos do período.","dica":"A outra aba, \"Por etiqueta\", mostra quais assuntos mais ocuparam o atendimento. Ela tem uma lição só para ela.","rota":"/app/activities","antes":[],"destaques":[{"alvo":{"role":"tablist"},"rotulo":"As duas abas","tipo":"caixa"},{"alvo":{"role":"combobox","nome":"Período","exato":true},"rotulo":"Período do relatório","tipo":"caixa"},{"alvo":{"testid":"total-de-atividades"},"rotulo":"Total do período","tipo":"caixa"}]},{"id":"p2","titulo":"Gente, agente ou automático","texto":"Os três cartões dividem o total por origem. \"A equipe\" conta o que as pessoas da sua equipe fizeram. \"Os agentes\" conta o que os agentes de IA fizeram sozinhos. \"Automático\" conta o que não foi nem uma pessoa da equipe nem um agente: o próprio sistema (por exemplo, ao criar o negócio quando chega a primeira mensagem), uma automação ou o próprio cliente. Embaixo do número fica a porcentagem do total.","dica":"O desenho ao lado de cada nome se repete na tela inteira: bolinha cheia é pessoa, anel é agente de IA e bolinha tracejada é automático.","antes":[],"destaques":[{"alvo":{"testid":"origem-filled"},"rotulo":"Feito pela equipe","tipo":"caixa"},{"alvo":{"testid":"origem-ring"},"rotulo":"Feito pelos agentes de IA","tipo":"caixa"},{"alvo":{"testid":"origem-dashed"},"rotulo":"Feito automaticamente","tipo":"caixa"}]},{"id":"p3","titulo":"Em que dias as coisas aconteceram","texto":"O quadro \"Quando\" tem uma barra por dia, com a data embaixo. O dia de hoje também entra: em \"Últimos 7 dias\" aparecem 8 barras. Quanto mais alta a barra, mais coisa aconteceu naquele dia. Para ver o número exato, pare o mouse sobre a barra. No celular, o número aparece escrito embaixo da data. A primeira e a última barra pegam só um pedaço do dia, por isso podem sair mais baixas.","dica":"Um dia sem nenhum acontecimento fica com uma barrinha mínima: ninguém mexeu nos negócios naquele dia. Pode ser um domingo, mas vale conferir se o atendimento não ficou parado.","antes":[],"destaques":[{"alvo":{"testid":"serie-diaria"},"rotulo":"Uma barra por dia","tipo":"caixa"}]}]},{"id":"quem-fez-o-que","titulo":"Quem fez o quê","objetivo":"Ver quem mais trabalhou no período, que tipo de coisa foi feita, e ir de um acontecimento até o negócio dele.","papel":"admin","busca":["quem fez","ranking da equipe","o que cada atendente fez","o que a IA fez","linha do tempo","histórico de ações","abrir o negócio"],"passos":[{"id":"p1","titulo":"Os dois rankings","texto":"\"Quem fez\" lista quem agiu no período (cada pessoa da equipe, cada agente de IA e o automático), de quem fez mais para quem fez menos, com o número e uma barra do tamanho da parte de cada um. O desenho antes do nome diz o tipo: bolinha cheia é pessoa, anel é agente e bolinha tracejada é automático (o sistema ou uma automação). Ao lado, \"O que foi feito\" faz a mesma conta pelo tipo de acontecimento, como \"Mudou de estágio\" ou \"Assumiu a conversa\".","rota":"/app/activities","antes":[{"acao":"aguardar","alvo":{"testid":"ranking-de-atores"}},{"acao":"rolar","alvo":{"css":"[data-testid='ranking-de-tipos'] > div:nth-child(8)"}}],"destaques":[{"alvo":{"testid":"ranking-de-atores"},"rotulo":"Quem fez","tipo":"caixa"},{"alvo":{"testid":"ranking-de-tipos"},"rotulo":"O que foi feito","tipo":"caixa"}]},{"id":"p2","titulo":"A linha do tempo da operação","texto":"Mais embaixo fica a \"Linha do tempo da operação\": os acontecimentos do período, do mais recente para o mais antigo. Cada linha traz o dia e a hora, o que aconteceu, quem fez, o negócio e o nome do cliente. Quando há um motivo, ele aparece logo abaixo: por exemplo, de qual etapa para qual o negócio foi movido. O nome do negócio é um link. Clique nele para abrir o negócio.","dica":"A lista mostra até os 200 acontecimentos mais recentes. Se o período tiver mais, um aviso no fim da lista diz o total.","antes":[{"acao":"rolar","alvo":{"css":"[data-testid='lista-de-atividades'] > li:nth-child(4)"}}],"destaques":[{"alvo":{"css":"[data-testid='lista-de-atividades'] > li:first-child"},"rotulo":"Quando, o quê, quem e com qual cliente","tipo":"caixa"},{"alvo":{"role":"link","dentro":{"css":"[data-testid='lista-de-atividades'] > li:first-child"}},"rotulo":"Abre o negócio","tipo":"seta"}],"clicar":{"role":"link","dentro":{"css":"[data-testid='lista-de-atividades'] > li:first-child"}}},{"id":"p3","titulo":"Do acontecimento ao negócio","texto":"O link leva ao funil onde o negócio está agora, com a ficha dele já aberta. Role a ficha até \"Linha do tempo\": ali fica o histórico completo daquele negócio, inclusive o acontecimento em que você clicou. A tela Atividades é o resumo de todos os negócios juntos; a ficha é a história de um só.","antes":[{"acao":"click","alvo":{"role":"link","dentro":{"css":"[data-testid='lista-de-atividades'] > li:first-child"}}},{"acao":"aguardar","alvo":{"role":"dialog"}},{"acao":"esperar","ms":1500},{"acao":"rolar","alvo":{"css":"[role='dialog'] section[data-secao='linha-do-tempo']"}}],"destaques":[{"alvo":{"css":"[role='dialog'] section[data-secao='linha-do-tempo']"},"rotulo":"Histórico deste negócio","tipo":"caixa"}]}]},{"id":"mudar-o-periodo","titulo":"Olhar um período maior","objetivo":"Trocar o período do relatório para 30 ou 90 dias e comparar com a última semana.","papel":"admin","busca":["mudar o período","últimos 30 dias","relatório do mês","últimos 90 dias","ver meses anteriores","filtrar por data"],"passos":[{"id":"p1","titulo":"Escolher o período","texto":"Clique no botão \"Últimos 7 dias\" para trocar o período. As opções são 7, 30 e 90 dias, sempre contando para trás a partir de agora. Os cartões, o gráfico, os rankings e a lista mudam juntos.","rota":"/app/activities","antes":[{"acao":"click","alvo":{"role":"combobox","nome":"Período","exato":true}},{"acao":"aguardar","alvo":{"role":"listbox"}}],"destaques":[{"alvo":{"role":"listbox"},"rotulo":"Os três períodos","tipo":"caixa"}],"clicar":{"role":"option","nome":"Últimos 30 dias","exato":true}},{"id":"p2","titulo":"O mês inteiro na tela","texto":"Com \"Últimos 30 dias\", entram também os acontecimentos das semanas anteriores. Aqui o total subiu de 29 para 39, e o gráfico \"Quando\" passou a ter uma barra para cada dia, de um mês atrás até hoje. Assim dá para comparar a última semana com as anteriores.","dica":"O período não fica guardado: ao sair e voltar para a tela, ela abre de novo nos \"Últimos 7 dias\". Se nada foi registrado no período escolhido, a tela mostra \"Nada aconteceu neste período\" e um botão \"Ver conversas\", que abre a Inbox.","antes":[{"acao":"click","alvo":{"role":"option","nome":"Últimos 30 dias","exato":true}},{"acao":"aguardar","alvo":{"texto":"39 acontecimentos","exato":true}}],"destaques":[{"alvo":{"role":"combobox","nome":"Período","exato":true},"rotulo":"Agora: 30 dias","tipo":"caixa"},{"alvo":{"testid":"total-de-atividades"},"rotulo":"Total do mês","tipo":"caixa"},{"alvo":{"testid":"serie-diaria"},"rotulo":"Um mês de barras","tipo":"caixa"}]}]},{"id":"por-etiqueta","titulo":"Quais assuntos mais ocuparam o atendimento","objetivo":"Usar a aba Por etiqueta para ver quais assuntos mais apareceram nas conversas e ir direto a elas na Inbox.","papel":"admin","busca":["por etiqueta","relatório de tags","assuntos mais comuns","tempo de espera","conversas por assunto","etiquetas mais usadas"],"passos":[{"id":"p1","titulo":"A aba Por etiqueta","texto":"A aba \"Por etiqueta\" mostra quais assuntos mais ocuparam o atendimento. Ela conta as etiquetas postas nas conversas (as \"Tags da conversa\" da Inbox), nas conversas que começaram no período. Uma conversa com duas etiquetas conta nas duas linhas. Por isso, no alto, o total aparece em \"etiquetagens\", e não em conversas.","dica":"Esta aba tem o seu próprio botão de período, com as mesmas opções de 7, 30 e 90 dias.","rota":"/app/activities","antes":[{"acao":"click","alvo":{"role":"tab","nome":"Por etiqueta","exato":true}},{"acao":"aguardar","alvo":{"testid":"tabela-por-etiqueta"}}],"destaques":[{"alvo":{"role":"tab","nome":"Por etiqueta","exato":true},"rotulo":"Aba Por etiqueta","tipo":"caixa"},{"alvo":{"testid":"total-de-etiquetagens"},"rotulo":"Total de etiquetas usadas","tipo":"caixa"},{"alvo":{"testid":"tabela-por-etiqueta"},"rotulo":"Uma linha por etiqueta","tipo":"caixa"}]},{"id":"p2","titulo":"Lendo uma linha","texto":"A tabela vem da etiqueta mais usada para a menos usada. Em cada linha, \"Conversas\" é quantas conversas tiveram aquela etiqueta. \"Abertas\" e \"Resolvidas\" separam as que ainda estão em andamento das já encerradas. \"Espera média\" é quanto tempo, em média, o cliente ficou esperando resposta (um traço quer dizer que não deu para medir). \"Fatia\" é a parte daquela etiqueta no total.","antes":[],"destaques":[{"alvo":{"testid":"linha-de-etiqueta","n":0},"rotulo":"O assunto mais comum","tipo":"caixa"},{"alvo":{"role":"columnheader","nome":"Espera média","exato":true},"rotulo":"Q lo":"radar"},{"href":"/app/agenda","rotulo":"Agenda","descricao":"O que está marcado, com quem, e quem atende — seu e da equipe.","modulo":"agenda"},{"href":"/app/templates","rotulo":"Respostas rápidas","descricao":"Scripts salvos para responder mais rápido, seus ou da equipe.","modulo":"respostas-rapidas"}]},{"grupo":"CRM","itens":[{"href":"/app/kanban","rotulo":"Funis","descricao":"Seus funis de venda — clique em um para abrir o quadro de clientes.","modulo":"funis"},{"href":"/app/contacts","rotulo":"Contatos","descricao":"As pessoas do outro lado da conversa e seu histórico.","modulo":"contatos"},{"href":"/app/tasks","rotulo":"Tarefas","descricao":"O que ficou combinado, com prazo — e o que já venceu sem ninguém fazer.","modulo":"tarefas"}]},{"grupo":"Agente de IA","itens":[{"href":"/app/ai/agents","rotulo":"Agentes","descricao":"Quem atende por você: instruções, modelo, ferramentas e publicação.","modulo":"agentes"},{"href":"/app/ai/followups","rotulo":"Follow-ups","descricao":"Como o agente retoma uma conversa que esfriou, para nenhuma morrer no silêncio.","modulo":"follow-ups"},{"href":"/app/ai/cases","rotulo":"Casos","descricao":"Os atendimentos que o agente conduziu, do início ao desfecho.","modulo":"casos"}]},{"grupo":"Canais","itens":[{"href":"/app/connections","rotulo":"Conexões","descricao":"Seus números de WhatsApp: por QR ou canal oficial da Meta, com saúde, reconexão e templates.","modulo":"conexoes"},{"href":"/app/webhooks","rotulo":"Webhooks","descricao":"Avise outros sistemas quando algo acontecer aqui dentro.","modulo":"webhooks"}]},{"grupo":"Análise","itens":[{"href":"/app/metrics","rotulo":"Desempenho","descricao":"Funil e performance por atendente nos últimos 30 dias.","modulo":"desempenho"},{"href":"/app/ads/meta","rotulo":"Meta Ads","descricao":"Quanto custou cada resultado das campanhas que trazem gente para cá.","modulo":"meta-ads"},{"href":"/app/activities","rotulo":"Atividades","descricao":"Relatório do que a equipe e os agentes fizeram n
